<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <title>Inventory · 5th Kajang BB</title>
    <link rel="icon" type="image/png" href="../bb-crest.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:ital,wght@0,400;0,700;1,400&family=Lexend:wght@500;600;700&display=swap" />
    <script>
      /* This page lives inside Parade HQ (the staff website). Opened on its own, it goes to Parade HQ's Inventory page,
         which asks for the staff login first. Local previews (localhost) are left alone. */
      (function () {
        var alone = window.top === window.self;
        if (alone && !/^(localhost|127\.0\.0\.1)$/.test(location.hostname)) { location.replace('../attendance/#inventory'); return; }
        /* Copy Parade HQ's theme and accent colour before the page draws, so it never flashes. */
        try {
          var h = window.parent.document.documentElement, r = document.documentElement;
          ['data-theme', 'data-accent'].forEach(function (a) { var v = h.getAttribute(a); if (v) r.setAttribute(a, v); });
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
