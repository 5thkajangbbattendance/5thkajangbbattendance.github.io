/* ---------- steps + validation ---------- */
function fail(m,el){var e=$('#err');e.textContent=m;e.hidden=false;if(el){el.focus({preventScroll:true});el.scrollIntoView({block:'center'});}else e.scrollIntoView({block:'center'});return false;}
function valid(step){
  if(step===1&&!S.sec) return fail('Choose a section to continue.',$('.choice'));
  if(step===2){
    var ch=chosen(); if(!ch.length) return fail('Add at least one part with the + button.',$('[data-q="1"]:not([disabled])'));
    for(var i=0;i<ch.length;i++){var l=ch[i],it=itemOf(l.id);
      if(sizesOf(it).length&&!l.size) return fail('Choose a size for '+it.name+'.',$('[data-k="'+l.k+'"][data-f="size"]'));
      if(it.ask&&!l.detail) return fail('Fill in "'+it.ask+'" for '+it.name+'.',$('[data-k="'+l.k+'"][data-f="detail"]'));}
  }
  if(step===3){
    var d=S.d, m=S.kind==='member';
    if(!d.childName) return fail(m?"Enter the member's name.":"Enter the child's name.",$('#fChild'));
    if(m&&!d.squad) return fail('Choose the squad, or "Not sure".',$('#fSquad'));
    if(!m&&d.age&&!/^\d{1,2}$/.test(d.age)) return fail('Enter the age as a number, such as 9.',$('#fAge'));
    if(!d.parentName) return fail('Enter the parent or guardian name.',$('#fParent'));
    if(d.phone.replace(/\D/g,'').length<7) return fail('Enter a phone number we can reach, such as 012-345 6789.',$('#fPhone'));
  }
  if(step===4&&!S.consent) return fail('Tick the box to agree that we may contact you about this order.',$('#fConsent'));
  return true;
}
function maxStep(){if(!S.sec)return 1;var ok2=chosen().length&&chosen().every(function(l){var it=itemOf(l.id);return (!sizesOf(it).length||l.size)&&(!it.ask||l.detail);});if(!ok2)return 2;var d=S.d;if(!d.childName||!d.parentName||d.phone.replace(/\D/g,'').length<7||(S.kind==='member'&&!d.squad))return 3;return 4;}
function go(n,push){
  if(S.step>4&&n<=4) return;
  n=Math.max(1,Math.min(n,maxStep()));
  if(n===S.step) return;
  S.step=n; if(push!==false) try{history.pushState({s:n},'','#step'+n);}catch(e){}
  render(true);
}
window.addEventListener('popstate',function(e){var n=(e.state&&e.state.s)||1;if(S.step>4)return;n=Math.max(1,Math.min(n,maxStep()));S.step=n;render(true);});
try{history.replaceState({s:1},'',location.pathname+location.search);}catch(e){}

$('#nextBtn').addEventListener('click',function(){
  $('#err')&&($('#err').hidden=true);
  if(!valid(S.step)) return;
  if(S.step<4) return go(S.step+1);
  send();
});
$('#backBtn').addEventListener('click',function(){if(S.step>1)history.back();});

$('#panel').addEventListener('click',function(e){
  var b=e.target.closest('button'); if(!b) return;
  if(b.dataset.sec){setSec(b.dataset.sec);render(false);var c=$('.choice[data-sec="'+b.dataset.sec+'"]');if(c)c.focus({preventScroll:true});return;}
  if(b.dataset.kind){S.kind=b.dataset.kind;render(false);return;}
  if(b.dataset.go){go(+b.dataset.go);return;}
  if(b.dataset.q){var l=lineOf(b.dataset.k);if(!l)return;l.qty=Math.max(0,Math.min(20,l.qty+ +b.dataset.q));var sel='[data-k="'+l.k+'"][data-q="'+b.dataset.q+'"]';repaintParts();var nb=$(sel);if(nb&&!nb.disabled)nb.focus({preventScroll:true});else{var o=$('[data-k="'+l.k+'"][data-q="1"]');if(o)o.focus({preventScroll:true});}return;}
  if(b.dataset.more){var nl={k:key(),id:b.dataset.more,size:'',detail:'',qty:1},at=-1;S.lines.forEach(function(x,i){if(x.id===nl.id)at=i;});S.lines.splice(at+1,0,nl);repaintParts();var f=$('[data-k="'+nl.k+'"][data-f]');if(f)f.focus({preventScroll:true});return;}
  if(b.dataset.rm){S.lines=S.lines.filter(function(x){return x.k!==b.dataset.rm;});repaintParts();return;}
  if(b.dataset.chart){openChart(itemOf(b.dataset.chart));return;}
  if(b.id==='againBtn'){S.lines.forEach(function(l){l.qty=0;l.size='';l.detail='';});S.lines=S.lines.filter(function(l,i,a){return a.findIndex(function(x){return x.id===l.id;})===i;});S.d.childName='';S.d.age='';S.d.squad='';S.d.notes='';S.consent=false;S.order=null;S.step=1;try{history.replaceState({s:1},'',location.pathname);}catch(x){}render(true);}
});

  if(t.dataset.d){S.d[t.dataset.d]=t.value.trim();}

  var t=e.target;
  if(t.dataset.f){var l=lineOf(t.dataset.k);if(l){l[t.dataset.f]=t.value.trim();if(t.dataset.f==='size'&&l.size&&!l.qty){l.qty=1;repaintParts();}paintBar();}}
  if(t.dataset.d){S.d[t.dataset.d]=t.value.trim();}
  if(t.id==='fConsent'){S.consent=t.checked;}
});
function openChart(it){
  if(!it||!it.chart) return;
  var wrap=document.createElement('div'); wrap.className='modal-wrap';
  wrap.innerHTML='<div class="modal" role="dialog" aria-modal="true" aria-labelledby="ch-t"><button class="ibtn modal-x" type="button" aria-label="Close">'+ICON.x+'</button><img src="'+esc(img(it.chart))+'" alt="Size chart for '+esc(it.name)+'"><div class="modal-b"><h2 id="ch-t" style="font-size:1.3rem">'+esc(it.name)+'</h2><p style="color:var(--muted)">If you are between two sizes, choose the bigger one. Ask an officer if you are unsure.</p></div></div>';
  document.body.appendChild(wrap); document.body.classList.add('modal-open');
  var prev=document.activeElement;
  function close(){wrap.remove();document.body.classList.remove('modal-open');document.removeEventListener('keydown',kd);try{prev&&prev.focus&&prev.focus({preventScroll:true});}catch(e){}}
  function kd(e){if(e.key==='Escape')close();}
  document.addEventListener('keydown',kd);
  wrap.addEventListener('click',function(e){if(e.target===wrap||e.target.closest('.modal-x'))close();});
  $('.modal-x',wrap).focus();
}

/* ---------- send ---------- */
function newRef(){var a='ABCDEFGHJKMNPQRSTUVWXYZ23456789',r='U-';for(var i=0;i<5;i++)r+=a[Math.floor(Math.random()*a.length)];return r;}
function send(){
  var btn=$('#nextBtn'), d=S.d, m=S.kind==='member';
  var o={kind:S.kind,section:S.sec,childName:d.childName,squad:m?d.squad:'',age:m?'':d.age,parentName:d.parentName,phone:d.phone,notes:d.notes,
    items:chosen().map(function(l){var it=itemOf(l.id);return {id:it.id,name:it.name,size:l.size||'',detail:l.detail||'',qty:l.qty,price:+it.price||0};}),total:total(),ref:newRef()};
  if(UCFG&&UCFG.roundId) o.round=UCFG.roundId;
  var done=function(){S.order=o;S.step=5;try{history.replaceState({s:5},'',location.pathname+'#done');}catch(e){}render(true);};
  var hp=$('#fWebsite'); if(hp&&hp.value) return done();
  btn.disabled=true; btn.textContent='Sending…';
  if(!openNow()){closedNote='';render(true);return;}
  if(!LIVE){setTimeout(function(){btn.disabled=false;done();},500);return;}
  var save=fs.collection('orders').add(Object.assign({},o,{status:'new',source:'website',createdAt:firebase.firestore.FieldValue.serverTimestamp()})).then(function(){return true;},function(x){console.warn('order save',x&&x.code);return false;});
  Promise.race([save,new Promise(function(res){setTimeout(function(){res(false);},12000);})]).then(function(ok){
    btn.disabled=false; btn.textContent='Send order';
    if(ok) return done();
    if(fs) fs.doc('config/uniform').get().then(function(d){if(d.exists){UCFG=d.data();if(!openNow()){closedNote=(UCFG.note?UCFG.note+'\n\n':'')+'Your order was not sent because ordering closed before it arrived.';render(true);}}}).catch(function(){});
    var text='Uniform order ('+SEC_INFO[o.section][0]+')\n'+(m?'Member: '+o.childName+(o.squad?', '+o.squad:''):'New member: '+o.childName+(o.age?', age '+o.age:''))+'\nParent: '+o.parentName+'\nPhone: '+o.phone+'\n'+
      o.items.map(function(x){var dd=[x.size,x.detail].filter(Boolean).join(', ');return x.qty+' x '+x.name+(dd?' ('+dd+')':'')+' = '+rm(x.qty*x.price);}).join('\n')+'\nTotal: '+rm(o.total)+(o.notes?'\nNotes: '+o.notes:'');
    var tel=String(SITE.phone||'').replace(/\D/g,''), e=$('#err');
    e.innerHTML='Your order could not be sent from this page. Please send it another way: <a href="https://wa.me/'+tel+'?text='+encodeURIComponent(text)+'" target="_blank" rel="noopener">send on WhatsApp</a> or <a href="mailto:'+esc(SITE.email)+'?subject='+encodeURIComponent('Uniform order')+'&body='+encodeURIComponent(text)+'">send by email</a>.';
    e.hidden=false; e.scrollIntoView({block:'center'});
  });
}

/* ---------- load ---------- */
render(false);
if(!LIVE){$('#demoFlag').hidden=false;}
else{
  try{firebase.initializeApp(FBCFG);fs=firebase.firestore();if(FBCFG.emulatorHost)fs.useEmulator(FBCFG.emulatorHost,8080);}catch(e){fs=null;}
  if(fs) Promise.all([
    fs.doc('config/site').get().then(function(d){return d.exists?d.data():null;}).catch(function(){return null;}),
    fs.collection('uniformItems').get().then(function(q){return q.docs.map(function(d){return Object.assign({},d.data(),{id:d.id});});}).catch(function(){return [];}),
    fs.doc('config/uniform').get().then(function(d){return d.exists?d.data():null;}).catch(function(){return null;})
  ]).then(function(r){
    UCFG=r[2];
    if(r[0]) ['email','phone','orderPay'].forEach(function(k){if(r[0][k])SITE[k]=r[0][k];});
    if(r[1].length){ITEMS=r[1].filter(function(x){return !x.hidden;});if(S.sec)setSec(S.sec);}
    if(S.step<=4) render(false);
  });
  setInterval(function(){if(S.step<=4&&UCFG&&UCFG.closesAtMs&&!openNow()&&!$('.closed'))render(true);},30000);
}
})();
</script>
