# One-click deploy on Render (Blueprint). The disk keeps the database between restarts and deploys.
services:
  - type: web
    name: bb-attendance
    runtime: node
    plan: starter            # persistent disks need a paid instance
    buildCommand: "true"
    startCommand: node server.js
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "22.13.0"
      - key: DB_FILE
        value: /var/data/attendance.db
      - key: COOKIE_SECURE
        value: "1"
      - key: ADMIN_USERNAME
        value: captain
      - key: ADMIN_PASSWORD
        sync: false          # Render asks you for this on first deploy
      - key: SEED_SAMPLE
        value: "0"           # start with an empty roster
    disk:
      name: attendance-data
      mountPath: /var/data
      sizeGB: 1
