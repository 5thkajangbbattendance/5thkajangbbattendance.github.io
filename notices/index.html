function linkify(t){return esc(t).replace(/(https?:\/\/[^\s<]+[^\s<.,;:!?)\]'"])/g,'<a href="$1" target="_blank" rel="noopener">$1</a>');}
function formState(f){if(!f)return 'gone';var s=f.status||'draft';if(s==='open'&&f.closesAtMs&&Date.now()>=f.closesAtMs)return 'closed';return s;}

var DEMO_N=[{id:'n-bbsunday',title:'BB Sunday 2027: please reply by next week',tag:'Event',body:'Join us for BB Sunday at Kajang Chinese Methodist Church. Members come in full uniform by 8:30 am.\nPlease fill in the form so we know who is coming.',image:'img/events/bb-sunday-2023.jpg',date:klToday(),until:'',pinned:true,published:true,buttons:[{label:'Fill in the form',form:'f-bbsunday',url:''}]},
  {id:'n-holiday',title:'No meeting on Chinese New Year weekend',tag:'Announcement',body:'There is no Saturday meeting during the Chinese New Year weekend. Meetings continue the week after.',image:'',date:klToday(),until:'',pinned:false,published:true,buttons:[]}];
var DEMO_F={'f-bbsunday':{title:'BB Sunday 2027 attendance',status:'open',closesAtMs:Date.now()+14*864e5}};

var NT_ICON={Announcement:'<path d="m3 11 18-5v12L3 14v-3z"/><path d="M11.6 16.8a3 3 0 1 1-5.8-1.6"/>',Event:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/>',Camp:'<path d="M3 20 12 4l9 16z"/><path d="M12 20v-5l-3 5M12 15l3 5"/>',Form:'<rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 3v2h6V3M9 10h6M9 14h6M9 18h3"/>',Reminder:'<path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.9 1.9 0 0 0 3.4 0"/>'};
function ntIcon(tag,w){return '<svg viewBox="0 0 24 24" width="'+(w||18)+'" height="'+(w||18)+'" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+(NT_ICON[tag]||NT_ICON.Announcement)+'</svg>';}
function seenNotes(){try{var a=JSON.parse(ls('bb-notices-seen')||'[]');return Array.isArray(a)?a:[];}catch(e){return [];}}
var NOTES=[], FORMS={}, TAG=(new URLSearchParams(location.search).get('type'))||'All', SEEN=seenNotes(), FIRST=true;
function visible(){var t=klToday();return NOTES.filter(function(n){return n.published!==false&&!(n.until&&n.until<t);}).sort(function(a,b){return (b.pinned?1:0)-(a.pinned?1:0)||(b.date||'').localeCompare(a.date||'');});}
function btnHTML(b){
  if(b.form){var f=FORMS[b.form],st=formState(f);
    if(st==='gone'||st==='draft') return '';
    if(st==='closed') return '<span class="btn off"><span class="bl">'+esc(b.label||'Fill in the form')+'<small>This form is closed</small></span>'+ICON.lock+'</span>';
    return '<a class="btn primary" href="'+ROOT+'form/?id='+encodeURIComponent(b.form)+'"><span class="bl">'+esc(b.label||'Fill in the form')+(f.closesAtMs?'<small>Closes '+esc(klWhen(f.closesAtMs))+'</small>':'')+'</span>'+ICON.right+'</a>';}
  if(b.url&&/^https?:\/\//i.test(b.url)) return '<a class="btn" href="'+esc(b.url)+'" target="_blank" rel="noopener"><span class="bl">'+esc(b.label||'Open link')+'</span>'+ICON.ext+'</a>';
  return '';
}
function cardHTML(n){
  var long=(n.body||'').length>260||(n.body||'').split('\n').length>5, bs=(n.buttons||[]).map(btnHTML).join('');
  var isNew=SEEN.indexOf(n.id)<0;
  return '<article class="card'+(n.pinned?' pinned':'')+(n.feature?' feature':'')+'" id="n-'+esc(n.id)+'">'+(n.image?'<button class="pic" type="button" data-zoom="'+esc(img(n.image))+'" aria-label="Enlarge picture for '+esc(n.title)+'"><img src="'+esc(img(n.image))+'" alt="" width="900" height="600" loading="lazy"></button>':'<div class="band" aria-hidden="true"><span>'+ntIcon(n.tag,28)+'</span><b>'+esc(n.tag||'Notice')+'</b></div>')+
    '<div class="body"><div class="meta">'+(isNew?'<span class="tag new">NEW</span>':'')+(n.pinned?'<span class="tag pin">'+ICON.pin+'Pinned</span>':'')+(n.tag?'<span class="tag">'+ntIcon(n.tag,13)+esc(n.tag)+'</span>':'')+(n.date?'<span>'+esc(niceDate(n.date))+'</span>':'')+'</div>'+
    '<h2>'+esc(n.title)+'</h2>'+(n.body?'<p class="txt'+(long?' clamp':'')+'">'+linkify(n.body)+'</p>'+(long?'<button class="more" type="button" data-more>Read more</button>':''):'')+
    (bs?'<div class="btns">'+bs+'</div>':'')+
    '<div class="foot"><span class="meta">'+(n.until?'Until '+esc(niceDate(n.until)):'')+'</span><button class="share" type="button" data-share="'+esc(n.id)+'">'+ICON.share+'Share</button></div></div></article>';
}
function paint(){
  var list=visible(), tags=['All'];
  list.forEach(function(n){if(n.tag&&tags.indexOf(n.tag)<0)tags.push(n.tag);});
  if(tags.indexOf(TAG)<0) TAG='All';
  $('#filters').hidden=tags.length<3;
  $('#filters').innerHTML=tags.map(function(t){var c=t==='All'?list.length:list.filter(function(n){return n.tag===t;}).length;return '<button type="button" data-tag="'+esc(t)+'" aria-pressed="'+(t===TAG)+'">'+esc(t)+'<i>'+c+'</i></button>';}).join('');
  var show=(TAG==='All'?list:list.filter(function(n){return n.tag===TAG;})).map(function(n,i){return Object.assign({},n,{feature:i===0&&n.pinned});});
  var nNew=list.filter(function(n){return SEEN.indexOf(n.id)<0;}).length;
  $('#list').innerHTML=(nNew&&FIRST&&SEEN.length?'<p class="newline"><b>'+nNew+' new</b> since your last visit</p>':'')+(show.length?'<div class="grid">'+show.map(cardHTML).join('')+'</div>':'<div class="empty">'+ICON.mega+'<b>No notices right now</b><span>Check back soon for camps, events and forms.</span></div>');
  if(list.length){var all=SEEN.concat(list.map(function(n){return n.id;}).filter(function(id){return SEEN.indexOf(id)<0;}));try{localStorage.setItem('bb-notices-seen',JSON.stringify(all.slice(-300)));}catch(e){}}
  if(location.hash.indexOf('#n-')===0){var el=document.getElementById(decodeURIComponent(location.hash.slice(1)));if(el){setTimeout(function(){el.scrollIntoView({behavior:'smooth',block:'start'});el.classList.add('flash');setTimeout(function(){el.classList.remove('flash');},2200);},120);}}
}
document.addEventListener('click',function(e){
  var t=e.target.closest('[data-tag]'); if(t){TAG=t.dataset.tag;FIRST=false;try{history.replaceState(null,'',location.pathname+(TAG==='All'?'':'?type='+encodeURIComponent(TAG))+location.hash);}catch(x){}paint();return;}
  var m=e.target.closest('[data-more]'); if(m){var p=m.previousElementSibling,open=p.classList.toggle('clamp');m.textContent=open?'Read more':'Show less';return;}
  var s=e.target.closest('[data-share]'); if(s){var n=NOTES.filter(function(x){return x.id===s.dataset.share;})[0],url=location.origin+location.pathname+'#n-'+s.dataset.share;
    if(navigator.share){navigator.share({title:n?n.title:'Notice',text:n?n.title:'',url:url}).catch(function(){});}
    else if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(url).then(function(){toast('Link copied');},function(){prompt('Copy this link:',url);});}
    else prompt('Copy this link:',url);return;}
  var z=e.target.closest('[data-zoom]'); if(z){var w=document.createElement('div');w.className='modal-wrap';w.setAttribute('role','dialog');w.setAttribute('aria-modal','true');w.setAttribute('aria-label','Picture');
    w.innerHTML='<button class="ibtn modal-x" type="button" aria-label="Close">'+ICON.x+'</button><img src="'+esc(z.dataset.zoom)+'" alt="Enlarged picture">';document.body.appendChild(w);document.body.classList.add('modal-open');
    var close=function(){w.remove();document.body.classList.remove('modal-open');document.removeEventListener('keydown',kd);z.focus();},kd=function(ev){if(ev.key==='Escape')close();};
    document.addEventListener('keydown',kd);w.addEventListener('click',function(ev){if(ev.target===w||ev.target.closest('.modal-x'))close();});$('.modal-x',w).focus();}
});

if(!LIVE){$('#demoFlag').hidden=false;NOTES=DEMO_N;FORMS=DEMO_F;setTimeout(paint,100);}
else{
  var fs=null; try{firebase.initializeApp(FBCFG);fs=firebase.firestore();if(FBCFG.emulatorHost)fs.useEmulator(FBCFG.emulatorHost,8080);}catch(e){}
  if(!fs){paint();}
  else fs.collection('notices').where('published','==',true).get().then(function(q){
    NOTES=q.docs.map(function(d){return Object.assign({},d.data(),{id:d.id});});
    var ids={}; NOTES.forEach(function(n){(n.buttons||[]).forEach(function(b){if(b&&b.form)ids[b.form]=1;});});
    return Promise.all(Object.keys(ids).map(function(id){return fs.doc('forms/'+id).get().then(function(d){if(d.exists)FORMS[id]=d.data();}).catch(function(){});}));
  }).then(paint,function(e){console.warn('notices',e&&e.code);$('#list').innerHTML='<div class="empty">'+ICON.mega+'<b>The notice board could not load</b><span>Check your internet connection and refresh the page.</span></div>';});
}
})();
</script>
</body></html>
