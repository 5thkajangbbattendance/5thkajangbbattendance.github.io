<title>Form · 5th Kajang BB</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="A form from The 5th Kajang Boys' Brigade Company.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:ital,wght@0,400;0,700;1,400&family=Lexend:wght@500;600;700&display=swap">
<style>
/* fixed stacking scale (baseline-ui): raised, lift, sticky, nav, header, float, strip, modal, toast */
:root{--z-raised:1;--z-lift:2;--z-sticky:10;--z-nav:20;--z-header:30;--z-float:40;--z-strip:50;--z-modal:60;--z-toast:70}

/* Layout: navy header with links back to the Notice board and website; a 720px column with the form card (cover, title, event chips, description), one card per question, and the send button. Navy is the fixed brand colour in light and dark. */
:root{
  --navy:#1E3F7A; --navy-2:#1E3F7A; --navy-deep:#142B57; --brass:#A16207; --gold:#A16207; --gold-on-dark:#E0B04A; --ring:var(--acc,#1E3F7A); --crest:#C62828;
  --bg:#F5F7FA; --surface:#ffffff; --surface-2:#EEF2F7; --ink:#172033; --ink-2:#2D3748; --muted:#4A5568; --line:#D6DDE8; --line-strong:#8A96A8;
  --accent:var(--navy-2); --accent-ink:#fff; --accent-text:var(--navy-2); --accent-soft:#E6EEFA;
  --ok:#1f7a4d; --ok-bg:#e8f4ec; --danger:#C62828; --danger-bg:#FBEAEA; --danger-bd:#F0BDBD;
  --shadow:0 1px 2px rgba(23,32,51,.06); --shadow-lg:0 18px 40px -16px rgba(18,28,51,.38);
  --f:"Atkinson Hyperlegible Next","Atkinson Hyperlegible",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --fd:"Lexend",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; --fn:"Atkinson Hyperlegible Next","Atkinson Hyperlegible",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1726; --surface:#172238; --surface-2:#1D2A44; --ink:#EEF2F8; --ink-2:#C9D2E0; --muted:#A3B0C6; --line:#2A3956; --line-strong:#5A6A88; --brass:#E0B04A; --gold:#E0B04A; --ring:var(--acc-td,#9DB8F0);
  --accent:#9DB8F0; --accent-ink:#0F1726; --accent-text:#9DB8F0; --accent-soft:#22345A; --ok:#75e0a7; --ok-bg:#0c2a1e; --danger:#fda29b; --danger-bg:#3a1512; --danger-bd:#7a271a;
  --shadow:0 1px 2px rgba(23,32,51,.06); --shadow-lg:0 24px 48px -16px rgba(0,0,0,.75); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0F1726; --surface:#172238; --surface-2:#1D2A44; --ink:#EEF2F8; --ink-2:#C9D2E0; --muted:#A3B0C6; --line:#2A3956; --line-strong:#5A6A88; --brass:#E0B04A; --gold:#E0B04A; --ring:var(--acc-td,#9DB8F0);
  --accent:#9DB8F0; --accent-ink:#0F1726; --accent-text:#9DB8F0; --accent-soft:#22345A; --ok:#75e0a7; --ok-bg:#0c2a1e; --danger:#fda29b; --danger-bg:#3a1512; --danger-bd:#7a271a;
  --shadow:0 1px 2px rgba(23,32,51,.06); --shadow-lg:0 24px 48px -16px rgba(0,0,0,.75); color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;min-height:100vh;min-height:100dvh}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:var(--z-strip);background:var(--navy-deep)}
h1,h2,h3{margin:0;line-height:1.2;text-wrap:balance}
p{margin:0}
a{color:var(--accent-text)}
img{max-width:100%;display:block}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid color-mix(in srgb,var(--accent-text) 50%,transparent);outline-offset:2px}
svg{flex:none}
.container{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.hdr{position:sticky;top:0;z-index:var(--z-header);background:var(--navy-deep);color:#fff;padding-top:env(safe-area-inset-top,0px);border-bottom:1px solid rgba(255,255,255,.08)}
.hdr-in{display:flex;align-items:center;gap:10px;min-height:68px;max-width:1100px}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:#fff;min-width:0;margin-right:auto}
.brand img{width:40px;height:40px;border-radius:4px;background:#fff;padding:3px;flex:none}
.brand b{display:block;font-size:1rem;white-space:nowrap}
.brand span{display:block;font-size:.76rem;color:rgba(255,255,255,.7);white-space:nowrap}
.ibtn{display:inline-grid;place-items:center;width:42px;height:42px;border-radius:50%;border:1px solid rgba(255,255,255,.3);background:transparent;cursor:pointer;color:#fff;padding:0}
.ibtn svg{width:20px;height:20px}
.back{display:inline-flex;align-items:center;gap:6px;min-height:42px;padding:0 14px;border-radius:999px;border:1px solid rgba(255,255,255,.3);color:#fff;text-decoration:none;font-weight:700;font-size:.88rem;white-space:nowrap}
.back svg{width:18px;height:18px}
@media (max-width:420px){.back span{display:none}.back{padding:0 11px}.brand span{display:none}}
.wrap{padding-top:24px;padding-bottom:64px;display:flex;flex-direction:column;gap:14px}
.demo-flag{background:#fff7e6;color:#7a4b00;font-size:.84rem;font-weight:600;text-align:center;padding:8px 16px}

/* form card */
.fhead{background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden;box-shadow:var(--shadow)}
.fhead .cover{width:100%;max-height:320px;object-fit:cover;background:var(--surface-2)}
.fband{height:10px;background:var(--navy-deep)}
.fhead-b{padding:24px 26px 26px;display:flex;flex-direction:column;gap:12px}
@media (max-width:520px){.fhead-b{padding:18px 18px 20px}.fhead{border-radius:8px}}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:.74rem;font-weight:700;text-transform:none;color:var(--accent-text)}
.eyebrow::before{content:"";width:18px;height:2px;background:currentColor}
.fhead h1{font-size:clamp(1.55rem,5vw,2.1rem);font-weight:800}
.desc{color:var(--ink-2);white-space:pre-line;overflow-wrap:anywhere}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:7px;padding:7px 12px;border-radius:999px;background:var(--accent-soft);color:var(--ink-2);font-size:.84rem;font-weight:600}
.chip svg{width:16px;height:16px;color:var(--accent-text)}
.chip.warn{background:#fff7e6;color:#7a4b00}.chip.warn svg{color:#b54708}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .chip.warn{background:#3a2a10;color:#fcd9a4}:root:not([data-theme="light"]) .chip.warn svg{color:#fcd9a4}}
:root[data-theme="dark"] .chip.warn{background:#3a2a10;color:#fcd9a4}:root[data-theme="dark"] .chip.warn svg{color:#fcd9a4}
.reqnote{font-size:.84rem;color:var(--muted)}.reqnote b,.req{color:var(--danger)}

/* questions */
.q{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:20px 22px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow);transition:border-color .15s}
@media (max-width:520px){.q{padding:16px 16px;border-radius:8px}}
.q.bad{border-color:var(--danger);box-shadow:0 0 0 1px var(--danger)}
.q-l{font-weight:700;font-size:1.02rem;line-height:1.4;overflow-wrap:anywhere}
.q-h{font-size:.88rem;color:var(--muted);margin-top:-6px;white-space:pre-line;overflow-wrap:anywhere}
.q-h b,.sec p b{color:var(--ink)}
.q-e{color:var(--danger);font-size:.86rem;font-weight:600;display:flex;align-items:center;gap:6px}
.q-e svg{width:16px;height:16px}
.sec{padding:6px 4px 0}
.sec h2{font-size:1.2rem;font-weight:800;display:flex;align-items:center;gap:10px}
.sec h2::before{content:"";width:6px;height:22px;border-radius:3px;background:var(--accent)}
.sec p{color:var(--muted);font-size:.92rem;margin-top:4px;white-space:pre-line}
.input{width:100%;min-height:50px;padding:10px 14px;border-radius:4px;border:1px solid var(--line-strong);background:var(--surface);font-size:1rem;color:var(--ink)}
.input:focus{border-color:var(--accent-text);outline:3px solid color-mix(in srgb,var(--accent-text) 18%,transparent);outline-offset:0}
select.input{appearance:auto}
textarea.input{min-height:110px;resize:vertical}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;align-items:center;gap:12px;min-height:52px;padding:10px 14px;border:1px solid var(--line-strong);border-radius:8px;cursor:pointer;background:var(--surface);transition:border-color .12s,background .12s}
.opt:hover{border-color:var(--accent-text)}
.opt input{width:22px;height:22px;margin:0;accent-color:var(--accent);flex:none}
.opt:has(input:checked){border-color:var(--accent-text);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent-text)}
.opt span{overflow-wrap:anywhere}
.opt-other{flex-wrap:wrap;cursor:default}
.opt-other label{display:flex;align-items:center;gap:12px;cursor:pointer;min-height:32px}
.opt-other .oth-in{flex:1 1 200px;min-width:0;min-height:40px}
.opt-other.on{border-color:var(--accent-text);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent-text)}
select+.oth-in{margin-top:8px}
.tblock h3,.fblock h3{font-size:1.05rem;font-weight:800}
.fblock{margin:0}
.fblock img{display:block;max-width:100%;height:auto;border-radius:6px}
.vwrap{position:relative;width:100%;aspect-ratio:16/9;max-width:100%;border-radius:6px;overflow:hidden;background:#000}
.vwrap iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.q-img{display:block;max-width:100%;max-height:360px;width:auto;height:auto;border-radius:6px}
.scale{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px}
.sc-l{font-size:.86rem;color:var(--muted);font-weight:600}
.sc-row{display:flex;flex-wrap:wrap;gap:6px}
.sc-c{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:44px;padding:6px 4px;border-radius:8px;cursor:pointer;border:1px solid transparent}
.sc-c span{font-weight:700;font-size:.9rem}
.sc-c input{width:22px;height:22px;margin:0;accent-color:var(--accent)}
.sc-c:has(input:checked){border-color:var(--accent-text);background:var(--accent-soft)}
.rating{display:flex;flex-wrap:wrap;gap:4px}
.rt-c{position:relative;display:grid;place-items:center;width:46px;height:46px;cursor:pointer;font-size:2rem;line-height:1;color:var(--line-strong);border-radius:8px}
.rt-c input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer}
.rt-c.on{color:#f5a524}.rt-heart .rt-c.on{color:#e5484d}
.rt-thumb .rt-c{filter:grayscale(1);opacity:.45}.rt-thumb .rt-c.on{filter:none;opacity:1}
.rt-c:has(input:focus-visible){outline:3px solid var(--accent-text);outline-offset:2px}
.gwrap{overflow-x:auto;max-width:100%}
.grid{border-collapse:collapse;min-width:100%}
.grid th,.grid td{padding:8px 10px;text-align:center;font-size:.9rem}
.grid thead th{font-weight:600;color:var(--muted)}
.grid tbody th{text-align:left;font-weight:600;min-width:110px}
.grid tbody tr:nth-child(odd){background:var(--surface-2)}
.g-c{display:grid;place-items:center;min-width:40px;min-height:40px;cursor:pointer}
.g-c input{width:22px;height:22px;margin:0;accent-color:var(--accent)}


.agree{align-items:flex-start;min-height:0;padding:14px}
.agree input{margin-top:1px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 24px;border-radius:4px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);font-weight:700;font-size:.98rem;text-decoration:none;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn svg{width:18px;height:18px}
.btn.wa{background:#128c4a;border-color:#128c4a;color:#fff}
.send{display:flex;flex-direction:column;gap:12px;padding:6px 0 0}
.send .btn{align-self:flex-start;min-width:200px}
@media (max-width:520px){.send .btn{align-self:stretch}}
.send small{color:var(--muted);font-size:.84rem}
.err{color:var(--danger);background:var(--danger-bg);border:1px solid var(--danger-bd);border-radius:4px;padding:12px 14px;font-weight:600;font-size:.92rem}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}

/* states */
.state{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:36px 26px;box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px}
.state .ic{width:68px;height:68px;border-radius:50%;background:var(--accent-soft);color:var(--accent-text);display:grid;place-items:center}
.state .ic svg{width:30px;height:30px}
.state h1{font-size:1.5rem}
.state p{color:var(--muted);max-width:480px;white-space:pre-line}
.state .row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:6px}
.ok-hero{display:flex;align-items:center;gap:18px;padding:24px 26px;border-radius:8px;background:var(--navy-deep);color:#fff;box-shadow:var(--shadow-lg)}
.ok-ic{width:58px;height:58px;border-radius:50%;background:#12b76a;color:#fff;display:grid;place-items:center;flex:none;box-shadow:0 0 0 7px rgba(18,183,106,.22)}
.ok-ic svg{width:30px;height:30px}
.ok-hero h1{color:#fff;font-size:1.55rem}.ok-hero h1:focus:not(:focus-visible){outline:none}
.ok-hero p{color:rgba(232,237,249,.86);margin-top:4px;white-space:pre-line}
@media (max-width:520px){.ok-hero{padding:20px 18px;gap:14px;border-radius:8px}.ok-ic{width:48px;height:48px}.ok-hero h1{font-size:1.3rem}}
.copy{background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);overflow:hidden}
.copy-h{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 20px;background:var(--surface-2);border-bottom:1px dashed var(--line-strong)}
.lbl{display:block;font-size:.7rem;font-weight:700;text-transform:none;color:var(--muted)}
.copy-h .ref{display:block;font-size:1.35rem;font-weight:800;}
.ans{display:flex;flex-direction:column;padding:6px 20px 14px}
.ans div{display:flex;flex-direction:column;gap:2px;padding:12px 0;border-bottom:1px solid var(--line)}
.ans div:last-child{border-bottom:0}
.ans span{font-size:.82rem;color:var(--muted)}
.ans b{font-weight:600;white-space:pre-wrap;overflow-wrap:anywhere}
.ans h3{font-size:.76rem;text-transform:none;color:var(--muted);padding-top:14px}
.acts{display:flex;flex-wrap:wrap;gap:10px}
@media (max-width:520px){.acts{flex-direction:column}.acts .btn{width:100%}}
.officers{display:grid;gap:10px;width:100%;max-width:520px;grid-template-columns:repeat(auto-fit,minmax(min(230px,100%),1fr));text-align:left;margin-top:4px}
.officer{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line-strong);border-radius:8px;background:var(--surface);color:var(--ink);text-decoration:none;min-height:60px}
.officer:hover{border-color:var(--accent-text);background:var(--accent-soft)}
.officer .av{width:38px;height:38px;border-radius:50%;background:var(--accent-soft);color:var(--accent-text);display:grid;place-items:center;font-weight:800;font-size:.82rem;flex:none}
.officer b{display:block;line-height:1.25}.officer small{color:var(--muted)}
.preview{background:var(--accent-soft);color:var(--ink-2);border:1px dashed var(--accent-text);border-radius:8px;padding:10px 14px;font-size:.88rem;font-weight:600;display:flex;gap:8px;align-items:center}
.preview svg{width:18px;height:18px;color:var(--accent-text)}
.skel{height:220px;border-radius:8px;background:var(--surface-2);background-size:200% 100%;;border:1px solid var(--line)}
@keyframes sk{to{background-position:-200% 0}}
.toast{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--navy-deep);color:#fff;padding:12px 18px;border-radius:4px;font-weight:600;z-index:var(--z-toast);box-shadow:var(--shadow-lg);max-width:calc(100vw - 32px)}
@media print{.hdr,.acts,.toast,.demo-flag{display:none!important}body{background:#fff;color:#000}body::before{display:none}.ok-hero{background:none;color:#000;box-shadow:none;border:1px solid #ccc}.ok-hero h1,.ok-hero p{color:#000}.copy{box-shadow:none}}

/* =====================================================================
   "Saturday" design system layer (design-system/5th-kajang-bb/MASTER.md
   and pages/website.md): Lexend headings, Atkinson Hyperlegible Next for
   body and every number, soft cards, Night Blue headers.
   ===================================================================== */
h1,h2{font-family:var(--fd);font-weight:700;line-height:1.15}
.brand b{font-family:var(--fd);font-size:1.125rem;font-weight:700;line-height:1.15}
.eyebrow{text-transform:none;}
.eyebrow::before{display:none}
:focus-visible{outline:3px solid var(--ring);outline-offset:2px}
.hdr :focus-visible{outline-color:#fff}
.btn{font-weight:700;transition:background-color .15s,border-color .15s,color .15s}
.btn:active{transform:translateY(1px)}
.input{border-color:var(--line-strong)}
.num,time,output,.qty,.price{font-variant-numeric:tabular-nums}
.hero,.intro,.ok-hero{box-shadow:none}
.hero h1::after,.intro h1::after,.fhead h1::after{display:none}
/* ---- polish ---- */
.brand span{font-size:.8125rem}

/* browser surfaces carry the palette too */
::selection{background:color-mix(in srgb,var(--accent) 24%,transparent);color:inherit}
:root{accent-color:var(--accent);caret-color:var(--accent-text,var(--accent))}
html{scrollbar-color:var(--line-strong) transparent}
a{text-underline-offset:3px}
h1,h2,h3{text-wrap:balance}
p,li,dd,.lead{text-wrap:pretty}
@media (pointer:coarse){.btn.sm,.ibtn,.chip,.filters button,.tabs button{min-height:44px}.ibtn{min-width:44px}}
.fband{box-shadow:none}
/* images: width/height attributes only reserve space; the CSS shape (e.g. 16:9 cards) decides the size */
:where(img){height:auto;max-width:100%}
/* web interface guidelines: skip link, colour scheme, touch handling, sheets keep their scroll */
.skip{position:absolute;left:12px;top:-80px;z-index:var(--z-toast);padding:10px 16px;border-radius:var(--r-sm);background:var(--accent);color:var(--accent-ink);font-weight:700;text-decoration:none}
.skip:focus{top:calc(12px + env(safe-area-inset-top,0px))}
:root{color-scheme:light}
:root[data-theme="dark"]{color-scheme:dark}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark}}
html{touch-action:manipulation;-webkit-tap-highlight-color:rgba(30,63,122,.14)}
.modal,.modal-b,.dialog,.dialog-body{overscroll-behavior:contain}
[id]{scroll-margin-top:84px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.fband{background:var(--navy-deep);box-shadow:inset 0 -3px 0 var(--gold)}
.fhead h1{font-size:clamp(1.75rem,4.5vw,2.375rem)}
.sec h2{font-size:1.25rem}
.ok-hero{background:var(--navy-deep)}
.ok-hero h1{font-size:1.5rem}
.chips{gap:4px 18px;font-variant-numeric:tabular-nums}
.chips > *{background:none!important;border:0!important;padding:0!important;border-radius:0!important}
</style>

<script>
(function(){
'use strict';
var FBCFG=window.BB_FIREBASE_CONFIG;
var LIVE=!!(FBCFG&&FBCFG.apiKey&&FBCFG.apiKey.indexOf('PASTE')<0&&window.firebase&&window.firebase.firestore);

    else if(vr.k==='url'&&!/^(https?:\/\/)?[^\s.]+\.[^\s]{2,}$/i.test(sv))bad='Enter a link, like www.example.com.';
    else if(vr.k==='regex'&&a){try{if(!new RegExp(a).test(sv))bad='Check the format of your answer.';}catch(e){}}
    else if(vr.k==='between'&&(isNaN(nv)||(a!=null&&nv<a)||(b!=null&&nv>b)))bad='Enter a number between '+a+' and '+b+'.';
    else if(vr.k==='gte'&&(isNaN(nv)||nv<a))bad='Enter '+a+' or more.';
    else if(vr.k==='lte'&&(isNaN(nv)||nv>a))bad='Enter '+a+' or less.';
    else if(vr.k==='int'&&!/^-?\d+$/.test(sv))bad='Enter a whole number.';
    else if(vr.k==='atleast'&&cnt<a)bad='Tick at least '+a+'.';
    else if(vr.k==='atmost'&&cnt>a)bad='Tick at most '+a+'.';
    else if(vr.k==='exactly'&&cnt!==a)bad='Tick exactly '+a+'.';
    if(bad) return vr.msg||bad;}
  if(empty) return q.required?(q.type==='agree'?'Please tick the box to continue.':'This question needs an answer.'):'';
  if(q.other&&(Array.isArray(v)?v.indexOf(OTH)>=0:v===OTH)&&!String(A[OTK+q.id]||'').trim()) return 'Type your answer next to “Other”.';
  var s=String(v).trim();
  if(q.type==='email'&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(s)) return 'Enter a valid email address.';
  if(q.type==='phone'&&s.replace(/\D/g,'').length<7) return 'Enter a phone number with at least 7 digits.';
  if(q.type==='number'&&isNaN(+s)) return 'Enter a number.';
  return '';
}
function check(q){var m=problem(q),box=$('[data-box="'+q.id+'"]'),e=$('#e_'+q.id);if(!box)return !m;box.classList.toggle('bad',!!m);e.hidden=!m;e.innerHTML=m?ICON.alert+esc(m):'';$$('[data-q="'+q.id+'"]',box).forEach(function(x){if(m)x.setAttribute('aria-invalid','true');else x.removeAttribute('aria-invalid');});return !m;}
function submit(){
  tried=true; var bad=answerable().filter(function(q){return !check(q);});
  if(bad.length){var b=$('[data-box="'+bad[0].id+'"]');b.scrollIntoView({behavior:'smooth',block:'center'});var inp=$('input:not([type=hidden]),select,textarea',b);if(inp)setTimeout(function(){inp.focus({preventScroll:true});},350);toast(bad.length===1?'One question needs your attention.':bad.length+' questions need your attention.');return;}
  var answers={}; answerable().forEach(function(q){var v=A[q.id];if(v==null)return;if(q.other)v=finalAns(q,v);if(Array.isArray(v)){if(v.length)answers[q.id]=v.map(function(x){return String(x).slice(0,200);});}else{var s=String(v).trim();if(s)answers[q.id]=s.slice(0,2000);}});
  var ref=newRef(), done=function(){DONE={ref:ref,answers:answers,at:Date.now()};ls(DKEY,null);paintDone();};
  if($('#fWebsite').value) return done();
  if(PREVIEW&&stateOf(F)!=='open'||!LIVE){var b0=$('#sendBtn');b0.disabled=true;setTimeout(done,400);return;}
  var btn=$('#sendBtn'); btn.disabled=true; btn.innerHTML=ICON.send+'Sending…';
  var save=fs.collection('formResponses').add({formId:FID,answers:answers,ref:ref,createdAt:firebase.firestore.FieldValue.serverTimestamp()}).then(function(){return true;},function(x){console.warn('send',x&&x.code);return false;});
  Promise.race([save,new Promise(function(r){setTimeout(function(){r(false);},12000);})]).then(function(ok){
    if(ok) return done();
    btn.disabled=false; btn.innerHTML=ICON.send+'Send';
    fs.doc('forms/'+FID).get().then(function(d){if(d.exists){F=d.data();if(stateOf(F)!=='open'){closedScreen('Your answers were not sent because the form closed before they arrived.');}}}).catch(function(){});
    var text=(F.title||'Form')+'\n'+answerable().map(function(q){var v=ansText(answers[q.id],q);return v?q.label+': '+v:'';}).filter(Boolean).join('\n');
    var e=$('#err'); e.innerHTML='Your answers could not be sent from this page. Check your internet and try again, or <a href="'+wa(SITE.phone)+'?text='+encodeURIComponent(text)+'" target="_blank" rel="noopener">send them on WhatsApp</a>.'; e.hidden=false; e.scrollIntoView({block:'center'});
  });
}
function paintDone(){
  var a=DONE.answers;
  $('#main').innerHTML='<section class="ok-hero"><span class="ok-ic">'+ICON.check+'</span><div><h1 tabindex="-1" id="okH">'+(PREVIEW&&stateOf(F)!=='open'?'Preview: not sent':'Response sent')+'</h1><p>'+esc(F.thanks||'Thank you! We have received your response.')+'</p></div></section>'+
    '<section class="copy"><div class="copy-h"><div><span class="lbl">Your reference</span><span class="ref">'+esc(DONE.ref)+'</span></div><div style="text-align:right"><span class="lbl">Form</span><b>'+esc(F.title||'Form')+'</b></div></div>'+
    '<div class="ans">'+qs().map(function(q){if(q.type==='image'||q.type==='video')return '';if(q.type==='section'||q.type==='text')return q.label?'<h3>'+esc(q.label)+'</h3>':'';var v=ansText(a[q.id],q);return '<div><span>'+esc(q.type==='agree'?'Agreement':q.label)+'</span><b>'+(v?esc(q.type==='agree'?'Agreed: '+q.label:v):'<i style="color:var(--muted);font-weight:500">No answer</i>')+'</b></div>';}).join('')+'</div></section>'+
    '<div class="acts"><button class="btn primary" type="button" id="againBtn">Fill in for another child</button><a class="btn" href="../notices/">Notice board</a><a class="btn" href="../">Back to Home</a></div>';
  $('#againBtn').addEventListener('click',function(){var keep={};answerable().forEach(function(q){if(/parent|guardian|whatsapp|phone|emergency|relationship|email/i.test(q.label)||q.type==='phone'||q.type==='email')keep[q.id]=A[q.id];});A=keep;DONE=null;tried=false;paintForm();window.scrollTo(0,0);toast('Parent details are kept. Fill in the rest for the next child.');});
  window.scrollTo(0,0); var h=$('#okH'); if(h) h.focus({preventScroll:true});
}
function closedScreen(extra){screen('lock','This form is closed',(F&&F.title?F.title+' is no longer taking responses.':'This form is no longer taking responses.')+(extra?'\n\n'+extra:'')+'\n\nIf you still need to reply, message an officer on WhatsApp.',officers()+backRow());}
function start(){
  if(!F) return screen('search','Form not found','This link may be wrong, or the form has been removed. Check the latest link on the notice board.',backRow());
  var st=stateOf(F);
  if(st==='draft'&&!PREVIEW) return screen('clock','This form is not open yet','Please check back later, or look at the notice board for updates.',backRow());
  if(st==='closed'&&!PREVIEW) return closedScreen();
  try{var d=JSON.parse(ls(DKEY)||'null');if(d&&typeof d==='object')A=d;}catch(e){}
  paintForm();
}

/* ---------- load ---------- */
if(!LIVE){$('#demoFlag').hidden=false;F=DEMO[FID]||(FID?null:DEMO['f-bbsunday']);if(!FID)FID='f-bbsunday';setTimeout(start,150);}
else{
  try{firebase.initializeApp(FBCFG);fs=firebase.firestore();if(FBCFG.emulatorHost)fs.useEmulator(FBCFG.emulatorHost,8080);}catch(e){fs=null;}
  if(!fs||!FID){start();}
  else Promise.all([
    fs.doc('forms/'+FID).get().then(function(d){return d.exists?d.data():null;}),
    fs.doc('config/site').get().then(function(d){return d.exists?d.data():null;}).catch(function(){return null;})
  ]).then(function(r){F=r[0];if(r[1])['phone','email','contacts'].forEach(function(k){if(r[1][k])SITE[k]=r[1][k];});start();},
    function(){screen('alert','The form could not load','Check your internet connection and refresh the page.','<div class="row"><button class="btn primary" type="button" onclick="location.reload()">Try again</button></div>');});
  setInterval(function(){if(F&&!DONE&&!PREVIEW&&stateOf(F)==='closed'&&$('#theForm'))closedScreen();},30000);
}
})();
