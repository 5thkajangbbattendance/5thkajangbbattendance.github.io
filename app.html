<title>5th Kajang Parade HQ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&display=swap">
<style>
/* Layout: navy "parade ground" sidebar with crest on wide screens, navy top bar + scrolling bottom tabs on phones; paper-coloured page with one centred column. */
:root{
  --acc:#9b2335; --acc-tl:#9b2335; --acc-td:#e8909d; --acc-sl:#f4e2e1; --acc-sd:#3a1820;
  --navy:#0b1220; --paper:#f3eee4;
  --bg:#f3eee4; --surface:#fbf8f2; --surface-2:#ece5d7; --ink:#161410; --muted:#6d675c; --line:#e2d9c8; --line-strong:#cdbfa6;
  --accent:var(--acc); --accent-ink:#f8f4ec; --accent-text:var(--acc-tl); --accent-soft:var(--acc-sl);
  --p:#1d6e43; --p-bg:#e1efe4; --l:#94590a; --l-bg:#f6ead2; --a:#b42318; --a-bg:#f9e2de; --e:#3949a8; --e-bg:#e5e7f7; --u:#6d675c; --u-bg:#ebe5da;
  --shadow:0 1px 2px rgba(22,20,16,.05),0 6px 18px rgba(22,20,16,.06);
  --f-display:"Cormorant Garamond",Georgia,"Times New Roman",serif;
  --f-body:"Barlow",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --grain:linear-gradient(#121a2b8c,#0b1220e6),radial-gradient(1200px 480px at 10% -10%,#9b233529,#0000 55%);
}
:root[data-accent="navy"]{--acc:#1f3563;--acc-tl:#1f3563;--acc-td:#a9bde6;--acc-sl:#e3e8f3;--acc-sd:#1a2742}
:root[data-accent="brass"]{--acc:#7c5a12;--acc-tl:#74540f;--acc-td:#e2c27a;--acc-sl:#f3ead4;--acc-sd:#33280f}
:root[data-accent="teal"]{--acc:#0d5c63;--acc-tl:#0b545a;--acc-td:#8fd6d9;--acc-sl:#e0f1f2;--acc-sd:#123a3e}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0b1220; --surface:#121a2b; --surface-2:#1a2336; --ink:#f3eee4; --muted:#a8a194; --line:#243049; --line-strong:#38466a;
  --accent-text:var(--acc-td); --accent-soft:var(--acc-sd);
  --p:#6fcf97; --p-bg:#14301f; --l:#f0b65a; --l-bg:#382a10; --a:#ff8a7e; --a-bg:#3d1a17; --e:#a9b4ff; --e-bg:#1f2550; --u:#a8a194; --u-bg:#22293a;
  --shadow:0 1px 2px rgba(0,0,0,.35); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0b1220; --surface:#121a2b; --surface-2:#1a2336; --ink:#f3eee4; --muted:#a8a194; --line:#243049; --line-strong:#38466a;
  --accent-text:var(--acc-td); --accent-soft:var(--acc-sd);
  --p:#6fcf97; --p-bg:#14301f; --l:#f0b65a; --l-bg:#382a10; --a:#ff8a7e; --a-bg:#3d1a17; --e:#a9b4ff; --e-bg:#1f2550; --u:#a8a194; --u-bg:#22293a;
  --shadow:0 1px 2px rgba(0,0,0,.35); color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;padding-bottom:calc(72px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--navy)}
body.modal-open{overflow:hidden}
h1,h2,h3{font-family:var(--f-display);font-weight:600;margin:0;line-height:1.1;text-wrap:balance}
h1{font-size:2.3rem} h2{font-size:1.5rem} h3{font-size:1.2rem}
p{margin:0}
a{color:var(--accent-text)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent-text);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.eyebrow{font-size:.7rem;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)} .small{font-size:.88rem} .grow{flex:1;min-width:0}

/* shell */
.demo-banner{background:#f6c445;color:#2b2100;font-size:.88rem;font-weight:600;text-align:center;padding-block:6px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.app{display:flex;min-height:100vh}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.crest{width:40px;height:40px;object-fit:contain;flex:none}
.side{display:none}
.mtop{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background-color:var(--navy);background-image:var(--grain);color:#f3eee4;display:flex;align-items:center;gap:10px;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.mtop .org{flex:1;min-width:0}
.mtop .org b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mtop .org span{display:block;font-size:.62rem;letter-spacing:.22em;text-transform:uppercase;color:rgba(243,238,228,.55)}
.icon-btn{display:inline-grid;place-items:center;width:44px;height:44px;border-radius:10px;border:1px solid var(--line-strong);background:var(--surface);cursor:pointer;flex:none;color:var(--ink)}
.icon-btn svg{width:20px;height:20px}
.icon-btn:disabled{opacity:.4;cursor:not-allowed}
.icon-btn.hdr{background:transparent;border-color:rgba(243,238,228,.3);color:#f3eee4}
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);display:flex;overflow-x:auto;scrollbar-width:none;padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.bnav::-webkit-scrollbar{display:none}
.bnav a{flex:1 0 66px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:62px;text-decoration:none;color:var(--muted);font-weight:600;font-size:.74rem}
.bnav a svg{width:22px;height:22px}
.bnav a[aria-current]{color:var(--accent-text)}
@media (min-width:1000px){
  body{padding-bottom:0}
  .mtop,.bnav{display:none}
  .side{display:flex;flex-direction:column;width:252px;flex:none;position:sticky;top:0;height:100vh;overflow-y:auto;background-color:var(--navy);background-image:var(--grain);color:#f3eee4;padding:22px 12px 16px}
  .side-brand{display:flex;gap:12px;align-items:center;padding:0 8px 22px}
  .side-brand .crest{width:46px;height:46px}
  .side-brand b{font-family:var(--f-display);font-size:1.15rem;font-weight:600;line-height:1.15;display:block}
  .side-brand span{font-size:.6rem;letter-spacing:.24em;text-transform:uppercase;color:rgba(243,238,228,.5)}
  .side nav{display:flex;flex-direction:column;gap:3px;flex:1}
  .side nav a{display:flex;align-items:center;gap:12px;min-height:44px;padding:0 12px;border-radius:10px;text-decoration:none;color:rgba(243,238,228,.7);font-size:.95rem}
  .side nav a:hover{background:rgba(255,255,255,.06);color:#f3eee4}
  .side nav a[aria-current]{background:var(--acc);color:#fff}
  .side nav svg{width:19px;height:19px;flex:none}
  .side-foot{border-top:1px solid rgba(243,238,228,.12);padding:14px 8px 0;display:flex;flex-direction:column;gap:6px}
  .side-foot .eyebrow{color:#e8909d}
  .side-foot .who{display:flex;align-items:center;gap:8px}
  .side-foot button{background:none;border:0;color:rgba(243,238,228,.65);cursor:pointer;padding:6px 0;text-align:left;font-size:.9rem}
  .side-foot button:hover{color:#fff}
}
.wrap{max-width:1000px;width:100%;margin:0 auto;padding-block:20px 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:20px}
.motto-foot{margin:0 0 10px;text-align:center;font-family:var(--f-display);font-style:italic;font-size:1.15rem;color:var(--muted)}

/* building blocks */
.ph{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.ph > div{min-width:0}
.datebar{display:flex;align-items:center;gap:4px;background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:4px}
.datebar .icon-btn{width:40px;height:40px;background:transparent;border-color:transparent}
.datebar input{border:0;background:transparent;min-height:40px;padding:0 6px;max-width:150px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:14px;min-width:0}
.card-h{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px}
.card-h > div{min-width:0}
.banner{background-color:var(--navy);background-image:var(--grain);color:#f3eee4;border:1px solid var(--line);border-radius:18px;padding:18px 20px;display:flex;flex-wrap:wrap;gap:14px;justify-content:space-between;align-items:center}
.banner .eyebrow{color:#e8909d}
.banner h2{font-size:1.7rem}
.banner .btn{background:#f3eee4;color:#161410;border-color:#f3eee4}
.banner .btn.ghost{background:transparent;color:#f3eee4;border-color:rgba(243,238,228,.35)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 16px;border-radius:12px;border:1.5px solid var(--line-strong);background:var(--surface);font-weight:600;font-size:.98rem;cursor:pointer;text-decoration:none;color:var(--ink);white-space:nowrap}
.btn:hover{border-color:var(--accent-text)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);box-shadow:0 6px 18px rgba(155,35,53,.22)}
.btn.primary:hover{filter:brightness(1.1)}
.btn.danger{color:var(--a);border-color:var(--a)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--accent-text)}
.btn.sm{min-height:38px;padding:0 12px;font-size:.88rem;border-radius:10px}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none;box-shadow:none}
.btn svg{width:18px;height:18px}
.row-btns{display:flex;flex-wrap:wrap;gap:8px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field > span{font-size:.7rem;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.field small{color:var(--muted);font-size:.84rem}
.input,select.input,textarea.input{width:100%;min-height:46px;padding:10px 12px;border-radius:12px;border:1.5px solid var(--line-strong);background:var(--surface);font-size:1rem}
textarea.input{min-height:84px}
.check{display:flex;align-items:center;gap:10px;min-height:40px;cursor:pointer}
.check input{width:20px;height:20px;accent-color:var(--acc)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(210px,100%),1fr));gap:14px}
.form{display:flex;flex-direction:column;gap:14px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{min-height:40px;padding:0 14px;border-radius:999px;border:1.5px solid var(--line-strong);background:var(--surface);font-weight:600;cursor:pointer;font-size:.9rem;color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.searchbox{position:relative}
.searchbox svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:19px;height:19px;color:var(--muted)}
.searchbox .input{padding-left:40px}
.empty{border:1.5px dashed var(--line-strong);border-radius:14px;padding:18px;text-align:center;color:var(--muted)}
.notice{background:var(--accent-soft);color:var(--ink);border-radius:12px;padding:10px 14px;font-weight:500}
.tag{display:inline-block;padding:1px 8px;border-radius:6px;background:var(--accent-soft);color:var(--accent-text);font-size:.68rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;vertical-align:2px;margin-left:6px}
.tag.grey{background:var(--u-bg);color:var(--u)}

/* status */
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-weight:700;font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.c-P{color:var(--p);background:var(--p-bg)} .c-L{color:var(--l);background:var(--l-bg)} .c-A{color:var(--a);background:var(--a-bg)} .c-E{color:var(--e);background:var(--e-bg)} .c-U{color:var(--u);background:var(--u-bg)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(120px,46%),1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;border-top:4px solid var(--sc,var(--accent-text))}
.tile .k{font-size:.7rem;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--sc,var(--accent-text))}
.tile .v{font-size:1.9rem;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.15}
.s-P{--sc:var(--p)} .s-L{--sc:var(--l)} .s-A{--sc:var(--a)} .s-E{--sc:var(--e)} .s-U{--sc:var(--u)}

/* command */
.rings{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(210px,100%),1fr));gap:12px}
.ring-card{display:flex;align-items:center;gap:14px;flex-direction:row}
.ring{width:72px;height:72px;flex:none}
.ring-bg{fill:none;stroke:var(--surface-2);stroke-width:7}
.ring-fg{fill:none;stroke:var(--accent-text);stroke-width:7;stroke-linecap:round}
.ring text{fill:var(--ink);font:600 19px var(--f-body)}
.big{font-family:var(--f-display);font-size:1.9rem;font-weight:600;line-height:1}
.squads{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(170px,100%),1fr));gap:10px}
.sq{background:var(--surface-2);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px}
.bar{height:8px;border-radius:999px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent-text);border-radius:999px}
.rank-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.rank-list li{background:var(--surface-2);border-radius:12px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.rank-list li:first-child{box-shadow:inset 4px 0 0 var(--accent-text)}

/* marking */
.roster{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.row{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--sc,var(--u));border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.row .who{display:flex;align-items:center;gap:10px}
.av{width:38px;height:38px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;font-weight:700;font-size:.85rem;flex:none}
.row .nm{font-weight:700}
.row .sub{color:var(--muted);font-size:.85rem}
.marks{display:grid;grid-template-columns:repeat(4,minmax(0,1fr)) 42px;gap:6px}
.mk{min-height:46px;border-radius:10px;border:1.5px solid var(--line-strong);background:var(--surface);font-weight:700;font-size:.9rem;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:5px;padding:0 4px;color:var(--ink)}
.mk::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--mc);flex:none}
.mk[data-s="P"]{--mc:var(--p);--mbg:var(--p-bg)} .mk[data-s="L"]{--mc:var(--l);--mbg:var(--l-bg)} .mk[data-s="A"]{--mc:var(--a);--mbg:var(--a-bg)} .mk[data-s="E"]{--mc:var(--e);--mbg:var(--e-bg)}
.mk.clr::before{display:none}
.mk.clr svg{width:18px;height:18px}
.mk[aria-pressed="true"]{background:var(--mbg);border-color:var(--mc);color:var(--mc);box-shadow:inset 0 0 0 1.5px var(--mc)}
.mk[aria-pressed="true"]::before{content:"✓";width:auto;height:auto;background:none}
.mk:disabled{opacity:.4;cursor:not-allowed}
@media (max-width:440px){.card{padding:14px}.row{padding:9px 10px}.mk{font-size:.84rem;padding:0 2px}.mk::before{display:none}.mk[aria-pressed="true"]::before{display:inline}.marks{gap:5px;grid-template-columns:repeat(4,minmax(0,1fr)) 38px}}

/* lists, pickers, tables */
.list{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.list > li + li{border-top:1px solid var(--line)}
.li{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;padding:10px 14px;background:none;border:0;text-align:left;color:inherit}
button.li{cursor:pointer} button.li:hover{background:var(--accent-soft)}
.li .nm{font-weight:700}
.li .sub{color:var(--muted);font-size:.86rem}
.li .idx{font-variant-numeric:tabular-nums;color:var(--muted);font-weight:600;width:28px;flex:none}
.li > svg{width:18px;height:18px;flex:none;color:var(--muted)}
.pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(230px,100%),1fr));gap:6px;max-height:420px;overflow:auto;padding:2px}
.pick button{display:flex;align-items:center;gap:10px;text-align:left;padding:8px 10px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;color:var(--ink);min-height:50px}
.pick button::before{content:"";width:18px;height:18px;border-radius:5px;border:2px solid var(--line-strong);flex:none}
.pick button[aria-pressed="true"]{border-color:var(--accent-text);background:var(--accent-soft)}
.pick button[aria-pressed="true"]::before{background:var(--accent-text);border-color:var(--accent-text);box-shadow:inset 0 0 0 3px var(--surface)}
.pick small{display:block;color:var(--muted);font-size:.8rem}
.datechips{display:flex;flex-wrap:wrap;gap:6px}
.datechips span{display:inline-flex;align-items:center;gap:6px;padding:4px 6px 4px 12px;border-radius:999px;background:var(--surface-2);font-weight:600;font-size:.9rem}
.datechips button{border:0;background:none;color:var(--accent-text);cursor:pointer;font-weight:600;min-height:30px}
.hscroll{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.hscroll button{flex:none}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:.68rem;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);background:var(--surface-2)}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tr.total td{font-weight:700;border-top:2px solid var(--line-strong)}
tr.sub td:first-child{padding-left:22px;color:var(--muted)}
tr:last-child td{border-bottom:0}
.report-head{text-align:center;display:flex;flex-direction:column;gap:4px;padding-block:6px}
.report-head h2{font-size:1.9rem}
.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(180px,100%),1fr));gap:10px}
.meta div{background:var(--surface-2);border-radius:12px;padding:10px 12px}
.meta b{display:block;font-weight:600}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .dow{font-size:.68rem;font-weight:600;letter-spacing:.14em;text-align:center;color:var(--muted);padding:4px 0}
.cal button{min-height:52px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-weight:600;color:var(--ink);padding:2px;min-width:0}
.cal button i{font-style:normal;font-size:.66rem;font-weight:700;letter-spacing:.02em}
.cal button.has{background:var(--p-bg);border-color:var(--p)}
.cal button.has i{color:var(--p)}
.cal button.off{background:var(--u-bg)}
.cal button.off i{color:var(--u)}
.cal button.today{box-shadow:inset 0 0 0 2px var(--accent-text)}
.cal button.sel{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.cal button.sel i{color:var(--bg)}
.chg{display:flex;flex-direction:column;align-items:flex-start;gap:4px}
.chg .arrow{display:flex;align-items:center;gap:6px;flex-wrap:wrap}

/* modal, toast, login */
.modal-wrap{position:fixed;inset:0;z-index:50;background:rgba(8,14,28,.55);display:flex;align-items:flex-end;justify-content:center}
.modal{background:var(--surface);color:var(--ink);width:100%;max-width:600px;max-height:92vh;display:flex;flex-direction:column;border-radius:18px 18px 0 0;padding-bottom:env(safe-area-inset-bottom,0px)}
@media (min-width:640px){.modal-wrap{align-items:center;padding:16px}.modal{border-radius:18px}}

/* ---------- storage: one interface, two backends ---------- */
var DEL={__del:1};
function isDel(v){return v===DEL||(v&&typeof v==='object'&&v.__del===1);}
function strip(o){if(o&&typeof o==='object'&&!Array.isArray(o)){Object.keys(o).forEach(function(k){if(isDel(o[k]))delete o[k];else strip(o[k]);});}return o;}
function deepMerge(a,b){
  Object.keys(b).forEach(function(k){var v=b[k];
    if(isDel(v)) delete a[k];
    else if(v&&typeof v==='object'&&!Array.isArray(v)&&a[k]&&typeof a[k]==='object'&&!Array.isArray(a[k])) deepMerge(a[k],v);
    else a[k]=strip(clone(v));
  });
  return a;
}
var LS_KEY='bb5kj-parade-demo-v2';
var Local={
  db:null, subs:[], persisted:true,
  init:function(){var raw=ls(LS_KEY);if(raw){try{this.db=JSON.parse(raw);}catch(e){}}if(!this.db){this.db=bbSeed(today());this.save();}},
  save:function(){try{localStorage.setItem(LS_KEY,JSON.stringify(this.db));this.persisted=true;}catch(e){this.persisted=false;}},
  reset:function(){ls(LS_KEY,null);this.db=bbSeed(today());this.save();var self=this;this.subs.forEach(function(s){self.emit(s);});},
  read:function(s){
    var db=this.db; if(s.doc) return clone(db[s.doc])||null;
    var out={}; Object.keys(db).forEach(function(k){var i=k.indexOf('/');if(k.slice(0,i)===s.coll)out[k.slice(i+1)]=clone(db[k]);});
    return out;
  },
  emit:function(s){var v=this.read(s);setTimeout(function(){if(!s.dead)s.cb(v);},0);},
  sub:function(coll,cb){var s={coll:coll,cb:cb};this.subs.push(s);this.emit(s);return function(){s.dead=true;};},
  subDoc:function(path,cb){var s={doc:path,cb:cb};this.subs.push(s);this.emit(s);return function(){s.dead=true;};},
  get:function(path){return Promise.resolve(clone(this.db[path])||null);},
  commit:function(ops){
    var db=this.db, touched={}, self=this;
    ops.forEach(function(o){
      if(o.del) delete db[o.path]; else if(o.merge) db[o.path]=deepMerge(db[o.path]||{},o.data); else db[o.path]=strip(clone(o.data));
      touched[o.path]=1; touched[o.path.split('/')[0]]=1;
    });
    this.save(); this.subs.forEach(function(s){if(!s.dead&&(s.doc?touched[s.doc]:touched[s.coll]))self.emit(s);});
    return Promise.resolve();
  }
};
function friendly(e){
  var c=(e&&e.code)||'', m;
  if(/invalid-credential|wrong-password|user-not-found|invalid-login|invalid-email/.test(c)) m='Username or password is incorrect.';
  else if(/email-already-in-use/.test(c)) m='That username is already taken. Choose another.';
  else if(/weak-password/.test(c)) m='Use a password of at least 8 characters.';
  else if(/too-many-requests/.test(c)) m='Too many tries. Wait a few minutes, then try again.';
  else if(/operation-not-allowed/.test(c)) m='Username sign-in is not switched on yet. In Firebase, open Authentication, Sign-in method, and enable Email/Password.';
  else if(/network-request-failed|unavailable/.test(c)) m='No internet connection. Check your signal and try again.';
  else if(/permission-denied/.test(c)) m='Your duty does not allow this change.';
  else if(/requires-recent-login/.test(c)) m='Sign out and sign in again, then retry.';
  else m=(e&&e.message)||String(e);
  var x=new Error(m); x.code=c; return x;
}
var Fire={
  fs:null, auth:null,
  init:function(){firebase.initializeApp(FBCFG);this.auth=firebase.auth();this.fs=firebase.firestore();if(FBCFG.emulatorHost){this.auth.useEmulator('http://'+FBCFG.emulatorHost+':9099',{disableWarnings:true});this.fs.useEmulator(FBCFG.emulatorHost,8080);}},
  conv:function(v){var self=this;if(isDel(v))return firebase.firestore.FieldValue.delete();if(v&&typeof v==='object'&&!Array.isArray(v)){var o={};Object.keys(v).forEach(function(k){o[k]=self.conv(v[k]);});return o;}return v;},
  sub:function(coll,cb,opts){
    var q=this.fs.collection(coll); if(opts&&opts.order) q=q.orderBy(opts.order,'desc'); if(opts&&opts.limit) q=q.limit(opts.limit);
    return q.onSnapshot(function(snap){var m={};snap.forEach(function(d){m[d.id]=d.data();});cb(m);},function(e){console.warn('read '+coll,e.code);});
  },
  subDoc:function(path,cb){return this.fs.doc(path).onSnapshot(function(d){cb(d.exists?d.data():null);},function(e){console.warn('read '+path,e.code);cb(null);});},
  get:function(path){return this.fs.doc(path).get().then(function(d){return d.exists?d.data():null;}).catch(function(e){throw friendly(e);});},
  commit:function(ops){
    var self=this, chunks=[]; for(var i=0;i<ops.length;i+=450) chunks.push(ops.slice(i,i+450));
    return chunks.reduce(function(p,ch){return p.then(function(){
      var b=self.fs.batch();
      ch.forEach(function(o){var ref=self.fs.doc(o.path);if(o.del)b.delete(ref);else if(o.merge)b.set(ref,self.conv(o.data),{merge:true});else b.set(ref,strip(clone(o.data)));});
      return b.commit();
    });},Promise.resolve()).catch(function(e){throw friendly(e);});
  }
};

var SECTION_ORDER={officers:0,primers:1,helper:2,members:3};
function groupOf(p){return p.section==='members'?'sq'+(p.squad||1):p.section;}
function rankIdx(r){var i=RANK_ORDER.indexOf(r);return i<0?99:i;}
function bySeniority(a,b){return SECTION_ORDER[a.section]-SECTION_ORDER[b.section]||(a.section==='members'?(a.squad||0)-(b.squad||0):0)||rankIdx(a.rank)-rankIdx(b.rank)||a.name.localeCompare(b.name);}
function byRoll(a,b){var g=SECTION_ORDER[a.section]-SECTION_ORDER[b.section]||(a.section==='members'?(a.squad||0)-(b.squad||0):0);if(g)return g;var oa=a.order==null?1e9:a.order, ob=b.order==null?1e9:b.order;return oa-ob||bySeniority(a,b);}
function roll(all){return Object.keys(ST.people).map(function(id){return Object.assign({id:id},ST.people[id]);}).filter(function(p){return all||p.active!==false;}).sort(byRoll);}
function inGroup(g){return roll().filter(function(p){return groupOf(p)===g;});}
function dispName(p){return (ABBR[p.rank]?ABBR[p.rank]+' ':'')+String(p.name).toUpperCase();}
function markRec(date,pid){var pd=ST.parades[date];return (pd&&pd.marks&&pd.marks[pid])||null;}
function markOf(date,pid){var m=markRec(date,pid);return (m&&m.s)||'U';}
function paradeStatus(date){var pd=ST.parades[date];return pd?(pd.status||'open'):null;}
function countsOn(date,list){var c=zero();list.forEach(function(p){c[markOf(date,p.id)]++;});return c;}
function paradeDates(){return Object.keys(ST.parades).filter(function(d){return ST.parades[d].status!=='off';}).sort();}
function canMark(p,date){
  var st=paradeStatus(date); if(st==='off') return false; if(isAdmin()) return true; if(st==='dismissed') return false;
  var g=groupOf(p); if(ME.duty==='commander') return g==='officers'||g==='primers'||g==='helper'; if(ME.duty==='leader') return g==='sq'+ME.squad; return false;
}
function writeMarks(entries){
  var ops=[], byDate={}, now=new Date().toISOString(), n=0;
  entries.forEach(function(e){
    var prev=markOf(e.date,e.pid); if(prev===e.s) return;
    var p=ST.people[e.pid]||{name:''};
    if(!byDate[e.date]){byDate[e.date]={marks:{}};if(!ST.parades[e.date])byDate[e.date].status='open';}
    byDate[e.date].marks[e.pid]={s:e.s,at:now,by:ME.uid,byName:ME.name};
    ops.push({path:'changes/'+uid()+n,data:{date:e.date,pid:e.pid,name:p.name,group:p.section?GROUP_LABEL[groupOf(p)]:'',from:prev,to:e.s,at:now,by:ME.uid,byName:ME.name}});
    n++;
  });
  if(!n) return Promise.resolve(0);
  Object.keys(byDate).forEach(function(d){ops.unshift({path:'parades/'+d,merge:true,data:byDate[d]});});
  return Store.commit(ops).then(function(){return n;});
}
function buildIndex(np){
  var idx={officers:[],primers:[],helper:[],sq1:[],sq2:[],sq3:[],sq4:[]};
  Object.keys(np).forEach(function(id){var p=np[id];if(p.active===false)return;var g=p.section==='members'?'sq'+(p.squad||1):p.section;if(idx[g])idx[g].push(id);});
  return idx;
}
function savePeople(upd){
  var np=clone(ST.people)||{}, ops=[];
  Object.keys(upd).forEach(function(id){
    if(upd[id]===null){delete np[id];ops.push({path:'people/'+id,del:true});}
    else{np[id]=Object.assign({},np[id]||{},upd[id]);ops.push({path:'people/'+id,data:np[id]});}
  });
  ops.push({path:'config/rosterIndex',data:buildIndex(np)});
  return Store.commit(ops);
}
function hoursOf(pid){
  var h=0;
  Object.keys(ST.services).forEach(function(k){var a=(ST.services[k].att||{})[pid];if(a&&a.ok)h+=Number(a.h)||0;});
  var x=ST.cshours[pid]; if(x&&x.entries) Object.keys(x.entries).forEach(function(k){h+=Number(x.entries[k].h)||0;});
  return Math.round(h*10)/10;
}

function openModal(o){
  return new Promise(function(resolve){
    var wrap=document.createElement('div'); wrap.className='modal-wrap';
    wrap.innerHTML='<div class="modal" role="dialog" aria-modal="true" aria-labelledby="mdl-t"><div class="modal-h"><h2 id="mdl-t">'+esc(o.title)+'</h2><button type="button" class="icon-btn" data-m="__close" aria-label="Close">'+ICON.x+'</button></div><div class="modal-b">'+o.html+'<div class="err" data-err hidden></div></div><div class="modal-f">'+

    document.addEventListener('keydown',kd);

    });

  });

  var st=paradeStatus(D);

  return [1,2,3,4].map(function(n){
    var mem=inGroup('sq'+n),P=0,L=0,E=0,T=0;
    dates.forEach(function(d){mem.forEach(function(p){var s=markOf(d,p.id);T++;if(s==='P')P++;else if(s==='L')L++;else if(s==='E')E++;});});
    var den=T-E; return {n:n,score:den?(P+0.5*L)/den*100:0,dates:dates.length};
  }).sort(function(a,b){return b.score-a.score||a.n-b.n;});
}

function parseCSV(text){
  var rows=[],row=[],f='',q=false;
  for(var i=0;i<text.length;i++){var ch=text[i];
    if(q){if(ch==='"'){if(text[i+1]==='"'){f+='"';i++;}else q=false;}else f+=ch;}
    else if(ch==='"')q=true; else if(ch===','){row.push(f);f='';} else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&text[i+1]==='\n')i++;row.push(f);rows.push(row);row=[];f='';} else f+=ch;}
  if(f||row.length){row.push(f);rows.push(row);}
  return rows.filter(function(r){return r.some(function(c){return c.trim();});});
}
function csvToPeople(text){
  var rows=parseCSV(text), out=[], bad=[];
  if(rows.length&&/name/i.test(rows[0][0])) rows.shift();
  rows.forEach(function(r,i){
    var name=(r[0]||'').trim().replace(/\s+/g,' '), sec=(r[1]||'').trim().toLowerCase(), rank=(r[2]||'').trim(), sq=parseInt(r[3],10), lead=/^(y|yes|true|1)$/i.test((r[4]||'').trim());
    var m=sec.match(/squad\s*(\d)/); if(m){sq=+m[1];sec='members';}
    if(/^officer/.test(sec))sec='officers'; else if(/^primer/.test(sec))sec='primers'; else if(/^helper/.test(sec))sec='helper'; else if(/^member/.test(sec))sec='members';
    if(!name||SECTIONS.indexOf(sec)<0||(sec==='members'&&!(sq>=1&&sq<=4))){bad.push(i+1);return;}
    var rk=RANKS[sec].filter(function(x){return x.toLowerCase()===rank.toLowerCase();})[0]||(sec==='members'?'Private':RANKS[sec][0]);
    out.push({name:name,section:sec,rank:rk,squad:sec==='members'?sq:null,squadLeader:sec==='members'&&lead,active:true});
  });
  return {people:out,bad:bad};
}

    onAction:function(v,w){

      var have={}; roll(true).forEach(function(p){have[p.name.toLowerCase()]=1;});

    .then(function(){toast('Account created for '+name+'. Username: '+u);},function(e){toast(e.message);b.disabled=false;});
};
ACT.stKey=function(){
  var a=$('#rkA').value,c=$('#rkB').value; if(a.length<8){toast('Use a recovery key of at least 8 characters.');return;} if(a!==c){toast('The two keys do not match.');return;}
  Store.commit([{path:'config/recovery',data:{key:a,setAt:new Date().toISOString()}}]).then(function(){toast('Recovery key saved');$('#rkA').value='';$('#rkB').value='';},function(e){toast(e.message);});
};
ACT.stSave=function(b){
  var box=$('[data-staff="'+b.dataset.u+'"]'), name=$('[data-f=name]',box).value.trim(), duty=$('[data-f=duty]',box).value;
  if(!name){toast('Enter a name.');return;}
  Store.commit([{path:'staff/'+b.dataset.u,merge:true,data:{name:name,duty:duty,squad:duty==='leader'?+$('[data-f=squad]',box).value:null}}]).then(function(){toast('Saved');},function(e){toast(e.message);});
};
ACT.stActive=function(b){
  var on=b.dataset.v==='1', s=ST.staff[b.dataset.u];
  var go=on?Promise.resolve(true):confirmBox('Revoke '+s.name+'?','<p>They will be signed out and cannot sign in again until reinstated. Their past marks stay.</p>','Revoke','danger');
  go.then(function(ok){if(ok)Store.commit([{path:'staff/'+b.dataset.u,merge:true,data:{active:on}}]).then(function(){toast(on?'Reinstated':'Revoked');},function(e){toast(e.message);});});
};

/* ---------- settings ---------- */
function openSettings(){
  var t=ls('bb-theme')||'system', a=ls('bb-accent')||'crimson', org=ST.org||{};
  var accents=[['crimson','Crimson','#9b2335'],['navy','Navy','#1f3563'],['brass','Brass','#7c5a12'],['teal','Teal','#0d5c63']];
  var html='<div class="field"><span>Theme</span><div class="seg">'+[['system','Match device'],['light','Light'],['dark','Dark']].map(function(o){return '<button type="button" data-theme-opt="'+o[0]+'" aria-pressed="'+(t===o[0])+'">'+o[1]+'</button>';}).join('')+'</div></div>'+
    '<div class="field"><span>Colour</span><div class="swatches">'+accents.map(function(o){return '<button type="button" class="swatch" data-accent-opt="'+o[0]+'" aria-pressed="'+(a===o[0])+'" style="--sw:'+o[2]+'"><i></i>'+o[1]+'</button>';}).join('')+'</div><small>Theme and colour are saved on this device only.</small></div>'+
    '<p class="small">Signed in as <b>'+esc(ME.name)+'</b> · '+esc(DUTY_LABEL[ME.duty]+(ME.duty==='leader'?' (Squad '+ME.squad+')':''))+'</p>';
  if(isOwner()) html+='<form class="form"><label class="field"><span>Organisation name</span><input class="input" id="soName" value="'+esc(org.orgName||'')+'" maxlength="120"></label><div class="grid2"><label class="field"><span>Short code</span><input class="input" id="soCode" value="'+esc(org.code||'5THKJBB')+'" maxlength="20"></label><label class="field"><span>Established</span><input class="input" id="soEst" value="'+esc(org.est||'2020')+'" maxlength="4" inputmode="numeric"></label></div></form>';
  if(MODE==='firebase') html+='<details><summary class="btn sm ghost">Change my password</summary><div class="form" style="margin-top:10px"><label class="field"><span>Current password</span><input class="input" type="password" id="pwCur" autocomplete="current-password"></label><label class="field"><span>New password</span><input class="input" type="password" id="pwNew" autocomplete="new-password"></label><button type="button" class="btn" data-pw="1">Change password</button></div></details>';
  if(MODE==='demo') html+='<div class="field"><span>Preview as (demo only)</span><select class="input" id="viewAs">'+Object.keys(ST.staff).map(function(k){var s=ST.staff[k];return opt(k,s.name+' · '+DUTY_LABEL[s.duty],ME.uid);}).join('')+'</select><small>See what each duty can do. Nothing is saved.</small></div><p class="small muted">This demo keeps its data in this browser only. Connect Firebase to share records between staff.</p>';
  openModal({title:'Settings',html:html,
    actions:(MODE==='firebase'?[{label:'Sign out',value:'out',kind:'danger'}]:[{label:'Reset demo data',value:'reset',kind:'danger'}]).concat([{label:'Close',value:'close'}]).concat(isOwner()?[{label:'Save organisation',value:'save',kind:'primary'}]:[]),
    onClick:function(e,w){
      var b=e.target.closest('[data-theme-opt],[data-accent-opt]');
      if(b){if(b.dataset.themeOpt){ls('bb-theme',b.dataset.themeOpt);$$('[data-theme-opt]',w).forEach(function(x){x.setAttribute('aria-pressed',String(x===b));});}else{ls('bb-accent',b.dataset.accentOpt);$$('[data-accent-opt]',w).forEach(function(x){x.setAttribute('aria-pressed',String(x===b));});}applyAppearance();}
      if(e.target.closest('[data-pw]')){var cur=$('#pwCur',w).value,nw=$('#pwNew',w).value;if(nw.length<8){toast('Use a new password of at least 8 characters.');return;}Auth.changePassword(cur,nw).then(function(){toast('Password changed');$('#pwCur',w).value='';$('#pwNew',w).value='';},function(er){toast(er.message);});}
    },
    onChange:function(e){if(e.target.id==='viewAs'){var s=ST.staff[e.target.value];ME={uid:e.target.value,name:s.name,duty:s.duty,squad:s.squad||null};buildNav();route();toast('Previewing as '+s.name);}},
    onAction:function(v,w){
      if(v==='close') return;
      if(v==='out') return Auth.signOut().then(function(){location.reload();});
      if(v==='reset') return confirmBox('Reset demo data?','<p>This replaces everything in this browser with fresh sample data.</p>','Reset','danger').then(function(ok){if(!ok)return false;Local.reset();toast('Demo data reset');});
      if(v==='save'){var n=$('#soName',w).value.trim();if(!n)throw new Error('Enter the organisation name.');return Store.commit([{path:'config/org',merge:true,data:{orgName:n,code:$('#soCode',w).value.trim()||'5THKJBB',est:$('#soEst',w).value.trim()}}]).then(function(){toast('Saved');});}
    }});
}

/* ---------- sign-in, first-time setup, recovery ---------- */
var busyAuth=false;
function loginShell(panel){
  document.body.classList.add('login-mode');
  view.innerHTML='<div class="login"><section class="login-brand"><div class="login-org"><img class="crest" src="bb-crest.png" alt="" onerror="this.remove()"><div><b>The 5th Kajang Boys’ Brigade Company</b><span>In Malaysia</span></div></div>'+
    '<div><h1 class="login-title">The 5th Kajang<em>Attendance</em></h1><p style="color:rgba(243,238,228,.7);margin-top:14px">Welcome back!</p></div>'+
    '<div class="login-motto"><i>Sure &amp; Stedfast</i><span>The 5th Kajang BB Company</span></div></section><section class="login-panel">'+panel+'</section></div>';
}
function viewLogin(msg){
  loginShell('<form id="lgForm"><div><h2>Log in here</h2></div><label class="field"><span>Username</span><input class="input" id="lgUser" autocomplete="username" autocapitalize="none" required></label><label class="field"><span>Password</span><input class="input" id="lgPass" type="password" autocomplete="current-password" required></label>'+
    '<div class="err" id="lgErr"'+(msg?'':' hidden')+'>'+esc(msg||'')+'</div><button class="btn primary block" type="submit">Enter</button><button class="btn ghost" type="button" id="lgForgot">Forgot Owner password?</button></form>');
  $('#lgUser').focus();
  $('#lgForm').addEventListener('submit',function(e){e.preventDefault();var err=$('#lgErr'),btn=$('#lgForm .btn.primary');err.hidden=true;btn.disabled=true;btn.textContent='Please wait…';
    Auth.signIn($('#lgUser').value,$('#lgPass').value).catch(function(ex){err.textContent=ex.message;err.hidden=false;btn.disabled=false;btn.textContent='Enter';});});
  $('#lgForgot').addEventListener('click',viewRecover);
}
function viewSetup(){
  loginShell('<form id="suForm"><div><h2>First-time setup</h2><p class="muted small">No Owner account exists yet. Create it now. The Owner can then issue posts to officers and squad leaders.</p></div>'+
    '<label class="field"><span>Display name</span><input class="input" id="suName" value="Owner" maxlength="40"></label><label class="field"><span>Username</span><input class="input" id="suUser" value="owner" autocapitalize="none" maxlength="30"></label>'+
    '<label class="field"><span>Password</span><input class="input" id="suPass" type="password" autocomplete="new-password"></label><label class="field"><span>Confirm password</span><input class="input" id="suPass2" type="password" autocomplete="new-password"></label>'+
    '<div class="err" id="suErr" hidden></div><button class="btn primary block" type="submit">Create Owner account</button></form>');
  $('#suForm').addEventListener('submit',function(e){
    e.preventDefault(); var err=$('#suErr'); err.hidden=true;
    var name=$('#suName').value.trim()||'Owner', u=cleanUser($('#suUser').value), p=$('#suPass').value;
    var fail=function(m){err.textContent=m;err.hidden=false;busyAuth=false;};
    if(!validUser(u)) return fail('Usernames need 3 to 30 letters, numbers, dots or dashes.');
    if(p.length<8) return fail('Use a password of at least 8 characters.');
    if(p!==$('#suPass2').value) return fail('The two passwords do not match.');
    busyAuth=true;
    Auth.createSelf(u,p).then(function(id){
      return Fire.commit([{path:'staff/'+id,data:{username:u,name:name,duty:'owner',active:true,createdAt:new Date().toISOString()}},{path:'config/owner',data:{uid:id}}])
        .then(function(){return Fire.commit([{path:'config/org',data:{orgName:"The 5th Kajang Boys' Brigade Company",code:'5THKJBB',est:'2020'}},{path:'config/rosterIndex',data:buildIndex({})}]);});
    }).then(function(){location.reload();},function(ex){fail(ex.message);});
  });
}
function viewRecover(){
  loginShell('<form id="rcForm"><div><h2>Recover Owner access</h2><p class="muted small">Enter the Owner recovery key that was set on the Staff page. You get a new Owner login, and the old Owner login is revoked.</p></div>'+
    '<label class="field"><span>Recovery key</span><input class="input" id="rcKey" type="password"></label><label class="field"><span>New Owner username</span><input class="input" id="rcUser" autocapitalize="none" maxlength="30"><small>Must be different from the old username.</small></label>'+
    '<label class="field"><span>New password</span><input class="input" id="rcPass" type="password" autocomplete="new-password"></label>'+
    '<div class="err" id="rcErr" hidden></div><button class="btn primary block" type="submit">Recover access</button><button class="btn ghost" type="button" id="rcBack">Back to log in</button></form>');
  $('#rcBack').addEventListener('click',function(){viewLogin();});
  $('#rcForm').addEventListener('submit',function(e){
    e.preventDefault(); var err=$('#rcErr'); err.hidden=true;
    var key=$('#rcKey').value, u=cleanUser($('#rcUser').value), p=$('#rcPass').value, oldUid=null;
    var fail=function(m){err.textContent=m;err.hidden=false;busyAuth=false;};
    if(!key) return fail('Enter the recovery key.'); if(!validUser(u)) return fail('Usernames need 3 to 30 letters, numbers, dots or dashes.'); if(p.length<8) return fail('Use a password of at least 8 characters.');
    busyAuth=true;
    Fire.get('config/owner').then(function(o){oldUid=o&&o.uid;return Auth.createSelf(u,p);}).then(function(id){
      return Fire.commit([{path:'staff/'+id,data:{username:u,name:'Owner',duty:'owner',active:true,recoveryKey:key,createdAt:new Date().toISOString()}},{path:'config/owner',data:{uid:id}}]).then(function(){
        var ops=[{path:'staff/'+id,merge:true,data:{recoveryKey:DEL}}]; if(oldUid&&oldUid!==id) ops.push({path:'staff/'+oldUid,merge:true,data:{active:false}});
        return Fire.commit(ops);
      },function(ex){
        var cu=Fire.auth.currentUser, gone=cu?cu.delete().catch(function(){}):Promise.resolve();
        return gone.then(function(){throw new Error(/duty|permission/i.test(ex.message)?'That recovery key does not match.':ex.message);});
      });
    }).then(function(){location.reload();},function(ex){Fire.auth.signOut().catch(function(){});fail(ex.message);});
  });
}
function viewNotPosted(){
  loginShell('<form><div><h2>No post yet</h2><p class="muted">This login is not posted, or the post was revoked. Ask the Owner to issue you a post on the Staff page.</p></div><button class="btn block" type="button" id="npOut">Use a different login</button></form>');
  $('#npOut').addEventListener('click',function(){Auth.signOut().then(function(){location.reload();});});
}

/* ---------- boot ---------- */
function start(){document.body.classList.remove('login-mode');startSubs();}
function boot(){
  if(MODE==='demo'){
    Local.init(); $('#demoBanner').hidden=false;
    if(!Local.persisted) $('#demoBanner').textContent='Single-device demo: this browser blocks storage, so changes are lost on refresh.';
    var s=Local.db['staff/demo-owner']||{name:'Owner'}; ME={uid:'demo-owner',name:s.name,duty:'owner',squad:null};
    start(); return;
  }
  try{Fire.init();}catch(e){view.innerHTML='<div class="empty">Firebase could not start: '+esc(e.message)+'. Check firebase-config.js.</div>';return;}
  Fire.auth.onAuthStateChanged(function(user){
    if(busyAuth) return;
    if(!user){Fire.get('config/owner').then(function(o){if(o)viewLogin();else viewSetup();},function(){viewLogin();});return;}
    Fire.get('staff/'+user.uid).then(function(s){
      if(!s||s.active===false) return viewNotPosted();
      ME={uid:user.uid,name:s.name,duty:s.duty,squad:s.squad||null,username:s.username}; start();
    },function(e){if(e.code==='permission-denied')return viewNotPosted();view.innerHTML='<div class="empty"><p>Could not load your post: '+esc(e.message)+'</p><button class="btn" onclick="location.reload()">Try again</button></div>';});
  });
}
boot();
})();
</script>
