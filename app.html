        var a=old?old[k]:undefined, b=nd[k];
        if(o.merge&&b&&typeof b==='object'&&!Array.isArray(b)&&!isDel(b)&&!isTS(b)&&a&&typeof a==='object'&&!Array.isArray(a)) b=strip(deepMerge(clone(a),b));
        if(kind==='add'&&(b===undefined||b===''||b===null)) return;
        var fa=kind==='add'?'':actVal(k,a,names), fb=actVal(k,b,names);
        if(fa!==fb) diffs.push({f:actField(k),from:fa,to:fb});
      });
    }
    if(coll==='register') diffs=kind==='add'?[]:diffs.map(function(d){return {f:d.f,from:'',to:'updated'};}); /* personal details stay out of the log */
    if(kind==='edit'&&!diffs.length&&o.path!=='config/recovery') return;
    var what=doc?doc[1]:actWhat(coll,id,o.del?old:Object.assign({},old||{},o.data||{}));
    items.push({area:area,what:what,kind:kind,diffs:kind==='add'?diffs.slice(0,6):diffs.slice(0,12)}); areas[area]=1;
  });
  if(!items.length) return null;
  return {by:ME.uid,byName:ME.name,at:new Date().toISOString(),ts:MODE==='firebase'?TS:new Date().toISOString(),areas:Object.keys(areas),n:items.length,items:items.slice(0,20)};
}
function withLog(ops){var e=actEntry(ops);return e?[{path:'activity/'+Date.now().toString(36)+uid(),data:e}].concat(ops):ops;}
/* The Inventory page saves through its own connection; it asks for an entry here (see shareWithInventory). */
function invLogEntry(items){
  if(!ME||!logOn()||!items||!items.length) return null;
  if(MODE!=='firebase') return null;
  /* rebuilt here so every object belongs to this page (the database code only accepts its own plain objects) */
  items=JSON.parse(JSON.stringify(items)).slice(0,20);
  return {by:ME.uid,byName:ME.name,at:new Date().toISOString(),ts:firebase.firestore.FieldValue.serverTimestamp(),areas:['inv'],n:items.length,items:items};
}

/* ---------- Activity page ---------- */
var ACTV={area:'',who:'',q:''};
function actList(){return Object.keys(ST.activity||{}).map(function(k){var e=ST.activity[k];return Object.assign({id:k,when:tsISO(e.ts)||e.at||''},e);}).sort(function(a,b){return b.when.localeCompare(a.when);});}
function actText(e){return [e.byName].concat((e.items||[]).map(function(it){return it.what+' '+(it.diffs||[]).map(function(d){return d.f+' '+d.from+' '+d.to;}).join(' ');})).join(' ').toLowerCase();}
var ACT_VERB={add:'Added',edit:'Changed',delete:'Deleted'};
function actShow(t){
  t=String(t==null?'':t);
  if(/^\d{4}-\d{2}-\d{2}$/.test(t)) return fmtDate(t);
  if(t.indexOf(', ')>=0||ST.people[t]) return t.split(', ').map(function(x){return ST.people[x]?ST.people[x].name:x;}).join(', ');
  return t;
}
function actItem(it){
  return '<div class="act-it"><div class="act-what"><span class="act-area a-'+esc(it.area)+'">'+esc(ACT_AREA_LABEL[it.area]||it.area)+'</span><span><b>'+(ACT_VERB[it.kind]||'Changed')+'</b> '+esc(it.what)+'</span></div>'+
    ((it.diffs||[]).length?'<ul class="act-diffs">'+it.diffs.map(function(d){return '<li><span class="df">'+esc(d.f)+'</span>'+(it.kind==='add'?'<b>'+esc(actShow(d.to))+'</b>':'<s>'+esc(actShow(d.from))+'</s><span aria-hidden="true">→</span><span class="sr">changed to</span><b>'+esc(actShow(d.to))+'</b>')+'</li>';}).join('')+'</ul>':'')+'</div>';
}
VIEWS.activity=function(){
  var all=actList(), q=ACTV.q.trim().toLowerCase();
  var people={}; all.forEach(function(e){people[e.by]=e.byName;});
  var list=all.filter(function(e){return (!ACTV.area||(e.areas||[]).indexOf(ACTV.area)>=0)&&(!ACTV.who||e.by===ACTV.who)&&(!q||actText(e).indexOf(q)>=0);});
  var html=head('Activity','Every change made in Parade HQ: who made it, when, and what changed. Attendance marks are under Changes.');
  if(!logOn()){
    view.innerHTML=html+'<section class="card deep"><div><h2>Turn on the activity log</h2><p class="card-s">'+(isOwner()?'First publish the latest firestore.rules in the Firebase console (Firestore Database → Rules), then turn it on. From then on, every change is recorded. Changes made before that were not recorded.':'The Owner has not turned on the activity log yet.')+'</p></div>'+(isOwner()?'<div><button class="btn primary" data-act="actOn">Turn on activity log</button></div>':'')+'</section>';
    return;
  }
  html+='<section class="card"><div class="act-filters"><label class="field"><span>Area</span><select class="input" id="actA" data-on="actA">'+opt('','All areas',ACTV.area)+Object.keys(ACT_AREA_LABEL).map(function(a){return opt(a,ACT_AREA_LABEL[a],ACTV.area);}).join('')+'</select></label>'+
    '<label class="field"><span>Person</span><select class="input" id="actP" data-on="actP">'+opt('','Everyone',ACTV.who)+Object.keys(people).sort(function(a,b){return people[a].localeCompare(people[b]);}).map(function(u){return opt(u,people[u],ACTV.who);}).join('')+'</select></label>'+
    '<label class="field"><span>Search</span><span class="searchbox">'+ICON.search+'<input class="input" type="search" id="actQ" data-input="actQ" value="'+esc(ACTV.q)+'" placeholder="Order number, name, field…"></span></label></div>'+
    '<p class="small muted act-count" id="actCount">'+(list.length===all.length?plural(all.length,'change'):list.length+' of '+plural(all.length,'change'))+(all.length>=500?' · showing the latest 500':'')+'</p></section>'+
    '<div id="actListBox">'+actGroups(list)+'</div>';
  view.innerHTML=html;
};
function actGroups(list){
  if(!list.length) return '<section class="card"><p class="empty">'+(Object.keys(ST.activity||{}).length?'No changes match these filters.':'No changes recorded yet. Every change made from now on appears here.')+'</p></section>';
  var days={}, order=[];
  list.forEach(function(e){var d=e.when?klNow(new Date(e.when)).date:'';if(!days[d]){days[d]=[];order.push(d);}days[d].push(e);});
  return order.map(function(d){
    return '<section class="card act-day"><h2 class="act-dh">'+(d===today()?'Today':d?fmtLong(d):'Unknown date')+'</h2><ol class="act-list">'+days[d].map(function(e){
      var t=e.when?klNow(new Date(e.when)).time:'';
      return '<li class="act-row">'+avatar(e.byName)+'<div class="act-main"><p class="act-who"><b>'+esc(e.byName)+'</b>'+(e.sample?'<span class="tag">Example</span>':'')+'<time datetime="'+esc(e.when)+'">'+(t?fmtTime(t):'')+'</time></p>'+(e.items||[]).map(actItem).join('')+
        (e.n>(e.items||[]).length?'<p class="small muted">and '+plural(e.n-e.items.length,'more change')+' in the same save</p>':'')+'</div></li>';
    }).join('')+'</ol></section>';
  }).join('');
}
ON.actA=function(t){ACTV.area=t.value;render();};
ON.actP=function(t){ACTV.who=t.value;render();};
ON.actQ=function(t){ACTV.q=t.value;var all=actList(),q=t.value.trim().toLowerCase(),list=all.filter(function(e){return (!ACTV.area||(e.areas||[]).indexOf(ACTV.area)>=0)&&(!ACTV.who||e.by===ACTV.who)&&(!q||actText(e).indexOf(q)>=0);});
  $('#actListBox').innerHTML=actGroups(list);$('#actCount').textContent=(list.length===all.length?plural(all.length,'change'):list.length+' of '+plural(all.length,'change'));};
ACT.actOn=function(b){
  b.disabled=true;
  Store.commit([{path:'config/activity',data:{on:true,since:new Date().toISOString(),by:ME.name}}]).then(function(){toast('Activity log is on. Every change from now on is recorded.');},
    function(e){b.disabled=false;toast(/permission|allow/i.test(e.message)?'The database turned this away. Publish the latest firestore.rules first, then try again.':e.message);});
};

/* ---------- settings ---------- */
function openSettings(){
  var t=themeMode(), a=ls('bb-accent')||'navy', org=ST.org||{};
  var html='<div class="field"><span>Theme</span><div class="seg">'+[['system','Match device'],['light','Light'],['dark','Dark']].map(function(o){return '<button type="button" data-theme-opt="'+o[0]+'" aria-pressed="'+(t===o[0])+'">'+o[1]+'</button>';}).join('')+'</div></div>'+
    (isOwner()?'<div class="field"><span>Colour (Owner only)</span><div class="swatches">'+ACCENTS.map(function(o){return '<button type="button" class="swatch" data-accent-opt="'+o[0]+'" aria-pressed="'+(a===o[0])+'" style="--sw:'+o[2]+'"><i></i>'+o[1]+'</button>';}).join('')+'</div><small>Everyone else always sees navy. Theme and colour are saved on this device only.</small></div>':'<p class="small muted">Theme is saved on this device only.</p>')+
    '<p class="small">Signed in as <b>'+esc(ME.name)+'</b> · '+esc(dutyLine())+'</p>';
  if(isOwner()) html+='<form class="form"><label class="field"><span>Organisation name</span><input class="input" id="soName" value="'+esc(org.orgName||'')+'" maxlength="120"></label><div class="grid2"><label class="field"><span>Short code</span><input class="input" id="soCode" value="'+esc(org.code||'5THKJBB')+'" maxlength="20"></label><label class="field"><span>Established</span><input class="input" id="soEst" value="'+esc(org.est||'2020')+'" maxlength="4" inputmode="numeric"></label></div></form>';
  if(MODE==='firebase'&&isOwner()) html+='<details><summary class="btn sm ghost">Change my password</summary><div class="form" style="margin-top:10px"><label class="field"><span>Current password</span><input class="input" type="password" id="pwCur" autocomplete="current-password"></label><label class="field"><span>New password</span><input class="input" type="password" id="pwNew" autocomplete="new-password"></label><button type="button" class="btn" data-pw="1">Change password</button></div></details>';
  if(MODE==='demo') html+='<div class="field"><span>Preview as (demo only)</span><select class="input" id="viewAs" aria-label="Preview as">'+Object.keys(ST.staff).map(function(k){var s=ST.staff[k];return opt(k,s.name+' · '+roleLine(s),ME.uid);}).join('')+'</select><small>See what each duty can do. Nothing is saved.</small></div><p class="small muted">This demo keeps its data in this browser only. Connect Firebase to share records between staff.</p>';
  openModal({title:'Settings',html:html,
    actions:(MODE==='firebase'?[{label:'Sign out',value:'out',kind:'danger'}]:[{label:'Reset demo data',value:'reset',kind:'danger'}]).concat([{label:'Close',value:'close'}]).concat(isOwner()?[{label:'Save organisation',value:'save',kind:'primary'}]:[]),
    onClick:function(e,w){
      var b=e.target.closest('[data-theme-opt],[data-accent-opt]');
      if(b){if(b.dataset.themeOpt){ls('bb-theme',b.dataset.themeOpt);$$('[data-theme-opt]',w).forEach(function(x){x.setAttribute('aria-pressed',String(x===b));});}else{ls('bb-accent',b.dataset.accentOpt);$$('[data-accent-opt]',w).forEach(function(x){x.setAttribute('aria-pressed',String(x===b));});}applyAppearance();}
      if(e.target.closest('[data-pw]')){var cur=$('#pwCur',w).value,nw=$('#pwNew',w).value;if(nw.length<8){toast('Use a new password of at least 8 characters.');return;}Auth.changePassword(cur,nw).then(function(){toast('Password changed');$('#pwCur',w).value='';$('#pwNew',w).value='';},function(er){toast(er.message);});}
    },
    onChange:function(e){if(e.target.id==='viewAs'){var s=ST.staff[e.target.value];ME={uid:e.target.value,name:s.name,duty:s.duty,squad:s.squad||null,access:s.access||null,roles:s.roles||null};buildNav();route();toast('Previewing as '+s.name);}},
    onAction:function(v,w){
      if(v==='close') return;
      if(v==='out') return Auth.signOut().then(function(){location.reload();});
      if(v==='reset') return confirmBox('Reset demo data?','<p>This replaces everything in this browser with fresh sample data.</p>','Reset','danger').then(function(ok){if(!ok)return false;Local.reset();toast('Demo data reset');});
      if(v==='save'){var n=$('#soName',w).value.trim();if(!n)throw new Error('Enter the organisation name.');return Store.commit([{path:'config/org',merge:true,data:{orgName:n,code:$('#soCode',w).value.trim()||'5THKJBB',est:$('#soEst',w).value.trim()}}]).then(function(){toast('Saved');});}
    }});
}

/* ---------- sign-in, first-time setup, recovery ---------- */
var busyAuth=false;
function loginShell(panel){
  document.body.classList.add('login-mode');
  view.innerHTML='<div class="login"><section class="login-brand"><div class="lb-top"><img class="crest" src="'+ROOT+'bb-crest.png" alt="" width="44" height="44" onerror="this.remove()"><div><b translate="no">Parade HQ</b><span>The 5th Kajang Boys’ Brigade Company</span></div></div>'+
    '<div class="lb-mid"><h1>Staff sign-in</h1><p>For officers and squad leaders of the 5th Kajang Company. Take the roll, check reports and keep member records.</p>'+
    '</div>'+
    '<p class="lb-motto">Sure &amp; Stedfast</p></section><section class="login-panel">'+panel+'</section></div>';
}
function viewLogin(msg){
  loginShell('<form id="lgForm"><div><h2>Sign in</h2><p class="muted" style="margin-top:6px">Use the username and password the Owner gave you.</p></div><label class="field"><span>Username</span><input class="input" id="lgUser" autocomplete="username" autocapitalize="none" required></label><label class="field"><span>Password</span><input class="input" id="lgPass" type="password" autocomplete="current-password" required></label>'+
    '<div class="err" id="lgErr"'+(msg?'':' hidden')+'>'+esc(msg||'')+'</div><button class="btn primary block" type="submit">Sign in</button><button class="btn ghost" type="button" id="lgForgot">Forgot Owner password?</button></form>');
  if(window.matchMedia&&matchMedia('(pointer:fine)').matches)$('#lgUser').focus();
  $('#lgForm').addEventListener('submit',function(e){e.preventDefault();var err=$('#lgErr'),btn=$('#lgForm .btn.primary');err.hidden=true;btn.disabled=true;btn.textContent='Please wait…';
    Auth.signIn($('#lgUser').value,$('#lgPass').value).catch(function(ex){err.textContent=ex.message;err.hidden=false;btn.disabled=false;btn.textContent='Sign in';});});
  $('#lgForgot').addEventListener('click',viewRecover);
}
function viewSetup(){
  loginShell('<form id="suForm"><div><h2>First-time setup</h2><p class="muted small">No Owner account exists yet. Create it now. The Owner can then issue posts to officers and squad leaders.</p></div>'+
    '<label class="field"><span>Display name</span><input class="input" id="suName" value="Owner" maxlength="40"></label><label class="field"><span>Username</span><input class="input" id="suUser" value="owner" autocapitalize="none" maxlength="30"></label>'+
    '<label class="field"><span>Password</span><input class="input" id="suPass" type="password" autocomplete="new-password"></label><label class="field"><span>Confirm password</span><input class="input" id="suPass2" type="password" autocomplete="new-password"></label>'+
    '<div class="err" id="suErr" hidden></div><button class="btn primary block" type="submit">Create Owner account</button></form>');
  $('#suForm').addEventListener('submit',function(e){
    e.preventDefault(); var err=$('#suErr'); err.hidden=true;
    var name=$('#suName').value.trim()||'Owner', u=cleanUser($('#suUser').value), p=$('#suPass').value;
    var fail=function(m){err.textContent=m;err.hidden=false;busyAuth=false;};
    if(!validUser(u)) return fail('Usernames need 3 to 30 letters, numbers, dots or dashes.');
    if(p.length<8) return fail('Use a password of at least 8 characters.');
    if(p!==$('#suPass2').value) return fail('The two passwords do not match.');
    busyAuth=true;
    Auth.createSelf(u,p).then(function(id){
      return Fire.commit([{path:'staff/'+id,data:{username:u,name:name,duty:'owner',active:true,createdAt:new Date().toISOString()}},{path:'config/owner',data:{uid:id}}])
        .then(function(){return Fire.commit([{path:'config/org',data:{orgName:"The 5th Kajang Boys' Brigade Company",code:'5THKJBB',est:'2020'}},{path:'config/rosterIndex',data:buildIndex({})}]);});
    }).then(function(){location.reload();},function(ex){fail(ex.message);});
  });
}
function viewRecover(){
  loginShell('<form id="rcForm"><div><h2>Recover Owner access</h2><p class="muted small">Enter the Owner recovery key that was set on the Staff page. You get a new Owner login, and the old Owner login is revoked.</p></div>'+
    '<label class="field"><span>Recovery key</span><input class="input" id="rcKey" type="password"></label><label class="field"><span>New Owner username</span><input class="input" id="rcUser" autocapitalize="none" maxlength="30"><small>Must be different from the old username.</small></label>'+
    '<label class="field"><span>New password</span><input class="input" id="rcPass" type="password" autocomplete="new-password"></label>'+
    '<div class="err" id="rcErr" hidden></div><button class="btn primary block" type="submit">Recover access</button><button class="btn ghost" type="button" id="rcBack">Back to log in</button></form>');
  $('#rcBack').addEventListener('click',function(){viewLogin();});
  $('#rcForm').addEventListener('submit',function(e){
    e.preventDefault(); var err=$('#rcErr'); err.hidden=true;
    var key=$('#rcKey').value, u=cleanUser($('#rcUser').value), p=$('#rcPass').value, oldUid=null;
    var fail=function(m){err.textContent=m;err.hidden=false;busyAuth=false;};
    if(!key) return fail('Enter the recovery key.'); if(!validUser(u)) return fail('Usernames need 3 to 30 letters, numbers, dots or dashes.'); if(p.length<8) return fail('Use a password of at least 8 characters.');
    busyAuth=true;
    Fire.get('config/owner').then(function(o){oldUid=o&&o.uid;return Auth.createSelf(u,p);}).then(function(id){
      return Fire.commit([{path:'staff/'+id,data:{username:u,name:'Owner',duty:'owner',active:true,recoveryKey:key,createdAt:new Date().toISOString()}},{path:'config/owner',data:{uid:id}}]).then(function(){
        var ops=[{path:'staff/'+id,merge:true,data:{recoveryKey:DEL}}]; if(oldUid&&oldUid!==id) ops.push({path:'staff/'+oldUid,merge:true,data:{active:false}});
        return Fire.commit(ops);
      },function(ex){
        var cu=Fire.auth.currentUser, gone=cu?cu.delete().catch(function(){}):Promise.resolve();
        return gone.then(function(){throw new Error(/duty|permission/i.test(ex.message)?'That recovery key does not match.':ex.message);});
      });
    }).then(function(){location.reload();},function(ex){Fire.auth.signOut().catch(function(){});fail(ex.message);});
  });
}
function viewNotPosted(){
  loginShell('<form><div><h2>No post yet</h2><p class="muted">This login is not posted, or the post was revoked. Ask the Owner to issue you a post on the Staff page.</p></div><button class="btn block" type="button" id="npOut">Use a different login</button></form>');
  $('#npOut').addEventListener('click',function(){Auth.signOut().then(function(){location.reload();});});
}

/* ---------- boot ---------- */
/* The Inventory page (shown inside Parade HQ) uses this signed-in database connection, so it needs no login of its own. */
function shareWithInventory(){
  var fb=MODE==='firebase'&&Fire.fs&&Fire.auth&&Fire.auth.currentUser;
  window.BB_INV={mode:fb?'firebase':'demo',db:fb?Fire.fs:null,FieldValue:fb?firebase.firestore.FieldValue:null,Object:Object,
    me:{uid:fb?Fire.auth.currentUser.uid:(ME&&ME.uid),name:ME?ME.name:'',duty:ME?ME.duty:'',read:ME?myAccess().read:[],write:ME?myAccess().write:[]},log:invLogEntry};
}
function start(){document.body.classList.remove('login-mode');shareWithInventory();startSubs();}
function boot(){
  if(MODE==='demo'){
    Local.init(); $('#demoBanner').hidden=false;
    if(!Local.persisted) $('#demoText').textContent='This browser blocks storage, so changes in this demo are lost on refresh.';
    var s=Local.db['staff/demo-owner']||{name:'Owner'}; ME={uid:'demo-owner',name:s.name,duty:'owner',squad:null};
    start(); return;
  }
  try{Fire.init();}catch(e){view.innerHTML='<div class="empty">Firebase could not start: '+esc(e.message)+'. Check firebase-config.js.</div>';return;}
  Fire.auth.onAuthStateChanged(function(user){
    if(busyAuth) return;
    if(!user){Fire.get('config/owner').then(function(o){if(o)viewLogin();else viewSetup();},function(){viewLogin();});return;}
    Fire.get('staff/'+user.uid).then(function(s){
      if(!s||s.active===false) return viewNotPosted();
      ME={uid:user.uid,name:s.name,duty:s.duty,squad:s.squad||null,username:s.username,access:s.access||null,roles:s.roles||null}; start();
    },function(e){if(e.code==='permission-denied')return viewNotPosted();view.innerHTML='<div class="empty"><p>Could not load your post: '+esc(e.message)+'</p><button class="btn" onclick="location.reload()">Try again</button></div>';});
  });
}
boot();
})();
</script>
