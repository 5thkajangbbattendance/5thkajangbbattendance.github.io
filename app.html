<title>5th Kajang Parade HQ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:ital,wght@0,400;0,700;1,400&family=Lexend:wght@500;600;700&display=swap">
<style>
/* fixed stacking scale (baseline-ui): raised, lift, sticky, nav, header, float, strip, modal, toast */
:root{--z-raised:1;--z-lift:2;--z-sticky:10;--z-nav:20;--z-header:30;--z-float:40;--z-strip:50;--z-modal:60;--z-toast:70}

/* Layout: white grouped sidebar + top bar on desktop; compact top bar + 5-tab bottom bar on phones. Soft navy-tinted canvas, white 16px cards, deep teal brand, mint highlight. */
:root{
  /* "Saturday" design system (design-system/5th-kajang-bb/MASTER.md): Brigade Blue #1E3F7A, Night Blue #142B57, Badge Gold #A16207, Crest Red #C62828, Hall Grey #F5F7FA, Ink #172033, Slate #4A5568 */
  --acc:#1E3F7A; --acc-tl:#1E3F7A; --acc-td:#9DB8F0; --acc-sl:#E6EEFA; --acc-sd:#22345A; --mint-l:#C9D6EE; --mint-d:#2a3a5e; --deep:#142B57;
  --brass:#A16207; --gold:#A16207; --gold-on-dark:#E0B04A; --ring:var(--acc,#1E3F7A); --brass-ink:#8A5A06; --crest:#C62828;
  --bg:#F5F7FA; --surface:#ffffff; --surface-2:#EEF2F7; --surface-3:#E6EBF2; --ink:#172033; --ink-2:#2D3748; --muted:#4A5568; --line:#D6DDE8; --line-strong:#8A96A8;
  --accent:var(--acc); --accent-ink:#ffffff; --accent-text:var(--acc-tl); --accent-soft:var(--acc-sl); --mint:var(--mint-l); --mint-ink:#0d2a25;
  --p:#1f7a4d; --p-bg:#e8f4ec; --p-bd:#b9dcc7; --l:#B45309; --l-bg:#FEF3E2; --l-bd:#F2CF9A; --a:#C62828; --a-bg:#FBEAEA; --a-bd:#F0BDBD; --e:#2B5FB3; --e-bg:#EAF0FB; --e-bd:#bfd1ef; --u:#4A5568; --u-bg:#eef0f3; --u-bd:#d2d7de;
  --av0:#fde9cc; --av0i:#8a4b08; --av1:#d3f1e8; --av1i:#0f6e5f; --av2:#e7e2fb; --av2i:#4b3aa8; --av3:#dbeafe; --av3i:#1d4ed8; --av4:#fde2e6; --av4i:#a3243b; --av5:#0b1736; --av5i:#e8eefc;
  --shadow:0 1px 2px rgba(23,32,51,.06);
  --shadow-lg:0 18px 40px -16px rgba(18,28,51,.38);
  --f:"Atkinson Hyperlegible Next","Atkinson Hyperlegible",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --fd:"Lexend",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; --fn:"Atkinson Hyperlegible Next","Atkinson Hyperlegible",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:12px; --r-sm:10px;
}
:root[data-accent="royal"]{--acc:#2556d9;--acc-tl:#1f4cc4;--acc-td:#9fbcff;--acc-sl:#e8efff;--acc-sd:#17295e;--mint-l:#d0ddff;--mint-d:#1c2d66;--deep:#0d1a45}
:root[data-accent="teal"]{--acc:#0f6e5f;--acc-tl:#0f6e5f;--acc-td:#5fd3bd;--acc-sl:#e3f4ef;--acc-sd:#14352f;--mint-l:#b5e9dd;--mint-d:#1b4740;--deep:#0f2e29}
:root[data-accent="emerald"]{--acc:#047857;--acc-tl:#047857;--acc-td:#6ee7b7;--acc-sl:#e6f6ef;--acc-sd:#0f3326;--mint-l:#bdeed6;--mint-d:#164534;--deep:#0b2a1f}
:root[data-accent="crimson"]{--acc:#9b2335;--acc-tl:#9b2335;--acc-td:#f2a0ac;--acc-sl:#fbeaec;--acc-sd:#3d1820;--mint-l:#f7d0d6;--mint-d:#4b1d26;--deep:#2b0f15}
:root[data-accent="violet"]{--acc:#5b3fd1;--acc-tl:#5236c4;--acc-td:#c0b1fa;--acc-sl:#efebfd;--acc-sd:#251c4f;--mint-l:#dcd3fb;--mint-d:#2e2560;--deep:#1a1338}
:root[data-accent="amber"]{--acc:#b45309;--acc-tl:#a14a07;--acc-td:#fcc77a;--acc-sl:#fdf3e6;--acc-sd:#3d2410;--mint-l:#f9dcb3;--mint-d:#4a2c12;--deep:#2b1808}
:root[data-accent="slate"]{--acc:#334155;--acc-tl:#334155;--acc-td:#c2cbd9;--acc-sl:#edf0f5;--acc-sd:#232c3b;--mint-l:#d5dce6;--mint-d:#2c3646;--deep:#141b26}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1726; --surface:#172238; --surface-2:#1D2A44; --surface-3:#24324F; --ink:#EEF2F8; --ink-2:#C9D2E0; --muted:#A3B0C6; --line:#2A3956; --line-strong:#5A6A88; --brass:#E0B04A; --gold:#E0B04A; --ring:var(--acc-td,#9DB8F0); --brass-ink:#E0B04A; --crest:#F28B82;
  --accent:var(--acc-td); --accent-ink:#0F1726;
  --accent-text:var(--acc-td); --accent-soft:var(--acc-sd); --mint:var(--mint-d); --mint-ink:#e8efed;
  --p:#75e0a7; --p-bg:#0b2d1d; --p-bd:#13573a; --l:#fdc54b; --l-bg:#3a2006; --l-bd:#7a3d0c; --a:#fda29b; --a-bg:#3d120d; --a-bd:#7a1f16; --e:#84caff; --e-bg:#0b2545; --e-bd:#1849a9; --u:#cfd5dd; --u-bg:#1d2733; --u-bd:#344054;
  --av0:#3a2a12; --av0i:#fcd9a4; --av1:#123a32; --av1i:#9ae6d2; --av2:#29224d; --av2i:#cbbffb; --av3:#132c55; --av3i:#a9c8fb; --av4:#40161f; --av4i:#f7b3c0; --av5:#e8eefc; --av5i:#0b1736;
  --shadow:0 1px 2px rgba(23,32,51,.06); --shadow-lg:0 20px 40px -12px rgba(0,0,0,.6); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0F1726; --surface:#172238; --surface-2:#1D2A44; --surface-3:#24324F; --ink:#EEF2F8; --ink-2:#C9D2E0; --muted:#A3B0C6; --line:#2A3956; --line-strong:#5A6A88; --brass:#E0B04A; --gold:#E0B04A; --ring:var(--acc-td,#9DB8F0); --brass-ink:#E0B04A; --crest:#F28B82;
  --accent:var(--acc-td); --accent-ink:#0F1726;
  --accent-text:var(--acc-td); --accent-soft:var(--acc-sd); --mint:var(--mint-d); --mint-ink:#e8efed;
  --p:#75e0a7; --p-bg:#0b2d1d; --p-bd:#13573a; --l:#fdc54b; --l-bg:#3a2006; --l-bd:#7a3d0c; --a:#fda29b; --a-bg:#3d120d; --a-bd:#7a1f16; --e:#84caff; --e-bg:#0b2545; --e-bd:#1849a9; --u:#cfd5dd; --u-bg:#1d2733; --u-bd:#344054;
  --av0:#3a2a12; --av0i:#fcd9a4; --av1:#123a32; --av1i:#9ae6d2; --av2:#29224d; --av2i:#cbbffb; --av3:#132c55; --av3i:#a9c8fb; --av4:#40161f; --av4i:#f7b3c0; --av5:#e8eefc; --av5i:#0b1736;
  --shadow:0 1px 2px rgba(23,32,51,.06); --shadow-lg:0 20px 40px -12px rgba(0,0,0,.6); color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);font-size:15px;line-height:1.5;padding-bottom:calc(70px + env(safe-area-inset-bottom,0px));-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:var(--z-strip);background:var(--surface)}
body.modal-open{overflow:hidden}
h1,h2,h3{font-family:var(--f);margin:0;line-height:1.2;text-wrap:balance;color:var(--ink)}
h1{font-size:1.9rem;font-weight:700;}
h2{font-size:1.05rem;font-weight:700;}
h3{font-size:.95rem;font-weight:700}
p{margin:0}
a{color:var(--accent-text)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid color-mix(in srgb,var(--accent-text) 45%,transparent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.eyebrow{font-size:.72rem;font-weight:600;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)} .small{font-size:.86rem} .grow{flex:1;min-width:0}
svg{flex:none}

/* ---- shell ---- */
.app{display:flex;min-height:100vh;min-height:100dvh}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.crest{width:36px;height:36px;object-fit:contain;flex:none}
.side{display:none}
.topbar{display:none}
.mtop{position:sticky;top:env(safe-area-inset-top,0px);z-index:var(--z-nav);background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.mtop .ttl{flex:1;min-width:0}
.mtop .ttl b{display:block;font-weight:700;font-size:1.02rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mtop .ttl span{display:block;font-size:.74rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:var(--z-nav);background:var(--surface);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.bnav a,.bnav button{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:60px;text-decoration:none;color:var(--muted);font-weight:600;font-size:.72rem;background:none;border:0;cursor:pointer;position:relative}
.bnav svg{width:22px;height:22px}
.bnav [aria-current]{color:var(--accent-text)}
.bnav [aria-current]::before{content:"";position:absolute;top:0;left:30%;right:30%;height:3px;border-radius:0 0 3px 3px;background:var(--accent)}
.nbadge{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:#d92d20;color:#fff;font-size:.7rem;font-weight:700;line-height:1}
.bnav .nbadge{position:absolute;top:6px;left:calc(50% + 6px)}
.avbtn{width:40px;height:40px;border-radius:50%;border:0;background:var(--deep);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--line-strong) 70%,transparent);color:#fff;font-weight:700;font-size:.85rem;cursor:pointer;display:grid;place-items:center;flex:none}
@media (min-width:1000px){
  body{padding-bottom:0}
  body::before{display:none}
  .mtop,.bnav{display:none}
  .side{display:flex;flex-direction:column;width:264px;flex:none;position:sticky;top:0;height:100vh;height:100dvh;overflow-y:auto;background:var(--surface);border-right:1px solid var(--line);padding:20px 16px 16px}
  .brandbox{display:flex;align-items:center;gap:10px;border:1px solid var(--line-strong);border-radius:12px;padding:8px 10px;margin-bottom:18px}
  .brandbox b{display:block;font-size:1rem;font-weight:700;line-height:1.2}
  .brandbox span{display:block;font-size:.74rem;color:var(--muted);line-height:1.3}
  .side nav{display:flex;flex-direction:column;gap:2px;flex:1}
  .nav-label{font-size:.7rem;font-weight:600;text-transform:uppercase;color:var(--muted);padding:14px 12px 6px}
  .nav-label:first-child{padding-top:2px}
  .side nav a{display:flex;align-items:center;gap:12px;min-height:44px;padding:0 12px;border-radius:12px;text-decoration:none;color:var(--ink-2);font-weight:500;font-size:.93rem}
  .side nav a:hover{background:var(--surface-2);color:var(--ink)}
  .side nav a[aria-current]{background:var(--accent);color:var(--accent-ink);font-weight:600}
  .side nav svg{width:19px;height:19px}
  .side nav a .nbadge{margin-left:auto}
  .side-user{display:flex;align-items:center;gap:10px;border-top:1px solid var(--line);padding:14px 4px 0;margin-top:12px}
  .side-user .grow b{display:block;font-size:.9rem;line-height:1.2}
  .side-user .grow span{display:block;font-size:.76rem;color:var(--muted)}
  .topbar{display:flex;justify-content:flex-end;align-items:center;gap:10px;padding:18px max(32px,env(safe-area-inset-right,0px)) 0 32px;position:relative;z-index:var(--z-sticky)}
}
.wrap{max-width:1240px;width:100%;margin:0 auto;padding-block:18px 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:20px}
@media (min-width:1000px){.wrap{padding:22px 32px 36px}}
.demo-note{max-width:1240px;width:100%;margin:12px auto 0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@media (min-width:1000px){.demo-note{padding:0 32px;margin-top:16px}}
.inv-frame{display:block;width:100%;border:0;background:var(--bg);color-scheme:normal}
body.pg-inventory .motto-foot{display:none}
body.pg-inventory #view{padding-bottom:0}
@media (max-width:999px){body.pg-inventory #view>.ph{display:none}}
.motto-foot{margin:0 0 14px;text-align:center;font-size:.8rem;text-transform:uppercase;color:var(--muted)}

/* global search */
.gsearch{position:relative;width:240px}
.gsearch svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:17px;height:17px;color:var(--muted)}
.gsearch input{width:100%;height:42px;border-radius:999px;border:1px solid var(--line-strong);background:var(--surface);padding:0 14px 0 36px;font-size:.9rem}
.gres{position:absolute;top:48px;right:0;width:320px;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow-lg);padding:6px;max-height:380px;overflow:auto}
.gres button{display:flex;align-items:center;gap:10px;width:100%;padding:8px;border:0;background:none;border-radius:10px;text-align:left;cursor:pointer;color:var(--ink)}
.gres button:hover,.gres button:focus-visible{background:var(--surface-2)}
.gres small{display:block;color:var(--muted);font-size:.78rem}

/* ---- page header ---- */
.ph{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px}
.ph > div{min-width:0}
.ph .sub{color:var(--muted);margin-top:6px}
.ph-actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.datebar{display:flex;align-items:center;gap:2px;background:var(--surface);border:1px solid var(--line-strong);border-radius:12px;padding:3px;height:44px}
.datebar .ibtn{width:36px;height:36px;border:0}
.datebar input{border:0;background:transparent;height:36px;padding:0 4px;max-width:142px;font-weight:600;font-size:.9rem}
.datebar b{font-size:.92rem}

/* ---- cards ---- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:16px;min-width:0}
.card-h{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-start;gap:10px}
.card-h > div{min-width:0}
.card-s{color:var(--muted);font-size:.86rem;margin-top:2px}
.card.deep{background:var(--deep);border-color:var(--deep);color:#e8f3ef}
.card.deep h2{color:#fff}
.card.deep .card-s,.card.deep .muted{color:rgba(232,243,239,.72)}
.card.deep .input{background:#fff;color:#0f1f1c;border-color:#fff}
.card.deep .btn.primary{background:var(--mint-l);border-color:var(--mint-l);color:#0d2a25}
.card.deep .btn.sec{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.2);color:#fff}
.g-3{display:grid;gap:20px;grid-template-columns:1fr}
.g-2{display:grid;gap:20px;grid-template-columns:1fr}
@media (min-width:900px){.g-2{grid-template-columns:1.4fr 1fr}.g-3{grid-template-columns:1fr 1fr}}
@media (min-width:1280px){.g-3{grid-template-columns:1.35fr 1.1fr 1fr}}

/* ---- buttons ---- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--line-strong);background:var(--surface);font-weight:600;font-size:.92rem;cursor:pointer;text-decoration:none;color:var(--ink);white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08);background:var(--accent)}
.btn.danger{color:var(--a);border-color:var(--a-bd);background:var(--surface)}
.btn.danger:hover{background:var(--a-bg)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--accent-text)}
.btn.ghost:hover{background:var(--accent-soft)}
.btn.sm{min-height:36px;padding:0 12px;font-size:.85rem;border-radius:10px}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.btn svg{width:17px;height:17px}
.ibtn{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:50%;border:1px solid var(--line-strong);background:var(--surface);cursor:pointer;flex:none;color:var(--ink);padding:0}
.ibtn:hover{background:var(--surface-2)}
.ibtn svg{width:18px;height:18px}
.ibtn:disabled{opacity:.35;cursor:not-allowed}
.ibtn.sm{width:34px;height:34px}
.ibtn.sm svg{width:16px;height:16px}
.icon-btn{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:50%;border:1px solid var(--line-strong);background:var(--surface);cursor:pointer;color:var(--ink);padding:0}
.icon-btn svg{width:18px;height:18px}
.icon-btn:disabled{opacity:.35;cursor:not-allowed}
.row-btns{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

/* ---- forms ---- */
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field > span{font-size:.84rem;font-weight:600;color:var(--ink-2)}
.field small{color:var(--muted);font-size:.8rem}
.input,select.input,textarea.input{width:100%;min-height:44px;padding:9px 12px;border-radius:10px;border:1px solid var(--line-strong);background:var(--surface);font-size:.94rem;color:var(--ink)}
.input:focus{border-color:var(--accent-text);outline:3px solid color-mix(in srgb,var(--accent-text) 18%,transparent);outline-offset:0}
textarea.input{min-height:84px}
.check{display:flex;align-items:center;gap:10px;min-height:40px;cursor:pointer;font-size:.92rem}
.check input{width:18px;height:18px;accent-color:var(--acc)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(210px,100%),1fr));gap:14px}
.form{display:flex;flex-direction:column;gap:14px}
.searchbox{position:relative}
.od-status{gap:12px}
.od-status-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.od-seg{align-self:stretch;max-width:none;display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr))}
.od-grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(320px,100%),1fr))}
.od-list{display:flex;flex-direction:column}
.od-kv{display:flex;justify-content:space-between;gap:16px;padding:11px 0;border-top:1px solid var(--line)}
.od-kv:first-child{border-top:0}
.od-kv span{color:var(--muted);font-size:.88rem}
.od-kv b{font-weight:600;text-align:right;overflow-wrap:anywhere}
.od-lines{display:flex;flex-direction:column}
.od-line{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;padding:12px 0;border-top:1px solid var(--line)}
.od-line:first-child{border-top:0}
.od-part{display:flex;flex-direction:column;gap:2px;min-width:0}
.od-part span{color:var(--muted);font-size:.86rem}
.od-amt{display:flex;flex-direction:column;align-items:flex-end;gap:2px;text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.od-amt span{color:var(--muted);font-size:.86rem}
.od-total{border-top:2px solid var(--line-strong);font-size:1.05rem}
.od-notes{white-space:pre-line}
.od-danger{display:flex;flex-direction:row;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.ordering{gap:12px}
.ordering-h{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-start;gap:12px}
.ordering-h h2{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ordering-msg{border-left:4px solid var(--accent-text);background:var(--surface-2);border-radius:10px;padding:10px 14px}
.ordering-msg span{display:block;font-size:.76rem;font-weight:700;text-transform:uppercase;color:var(--muted)}
.ordering-msg p{white-space:pre-line}
.round-pick .field{max-width:360px}
.rounds{display:flex;flex-direction:column;gap:12px}
.round{border:1px solid var(--line);border-radius:14px;padding:14px}
.round-h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}

/* solid, calmer notices */

/* small finishing touches */
.card{transition:border-color .15s}
.kpi .kpi-v{}
.seg button{white-space:nowrap}

.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.input.sm{min-height:38px;padding:6px 10px;font-size:.88rem;width:auto;max-width:100%}
.btn.wa{background:#128c4a;border-color:#128c4a;color:#fff}.btn.wa:hover{filter:brightness(1.08);background:#128c4a}

.fm-cv{width:100%;aspect-ratio:16/7;object-fit:cover;display:block;background:var(--surface-2)}

.fm-ed{display:flex;flex-direction:column;gap:16px}
.fm-cover{display:flex;flex-direction:column;gap:10px}
.fm-cover img{width:100%;max-height:260px;object-fit:cover;border-radius:14px;border:1px solid var(--line)}

.fm-q.sec{border-left-color:var(--navy,#14275e);background:color-mix(in srgb,var(--accent-soft) 40%,var(--surface))}
.fm-q-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap}

.fm-qn svg{width:15px;height:15px}
.fm-req{min-height:36px;font-size:.86rem;font-weight:600}
.fm-opts{display:flex;flex-direction:column;gap:8px}

.fm-bar-b{height:8px;border-radius:999px;background:var(--line);overflow:hidden;margin-top:4px}

.fm-bar details{margin-top:4px;font-size:.82rem}.fm-bar summary{cursor:pointer;color:var(--accent-text);font-weight:600}

.fm-ans{display:flex;flex-direction:column;gap:12px}

.fm-ans div{display:flex;flex-direction:column;gap:2px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.fm-ans span{font-size:.82rem;color:var(--muted)}.fm-ans b{font-weight:600;white-space:pre-wrap;overflow-wrap:anywhere}
.fm-link{display:flex;gap:8px;flex-wrap:wrap}.fm-link .input{flex:1 1 260px}
.fm-qr{display:flex;flex-direction:column;align-items:flex-start;gap:12px}
.fm-qr img{width:240px;height:240px;border-radius:12px;background:#fff;padding:8px;border:1px solid var(--line);image-rendering:pixelated}
.nb-list{display:flex;flex-direction:column}
.nb-row{display:flex;align-items:center;gap:14px;padding:12px 0;border-top:1px solid var(--line);flex-wrap:wrap}

.nb-th.ph{display:grid;place-items:center;color:var(--accent-text);background:var(--accent-soft)}.nb-th.ph svg{width:22px;height:22px}
.nb-b{flex:1 1 200px;min-width:0;display:flex;flex-direction:column;gap:2px}
.nb-t b{margin-right:2px}.nb-t .tag:first-of-type{margin-left:4px}
.nb-img{display:flex;flex-direction:column;gap:8px;align-items:flex-start}.nb-img img{width:100%;max-height:220px;object-fit:cover;border-radius:12px;border:1px solid var(--line)}
.nb-btn{display:flex;flex-direction:column;gap:10px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--surface-2);margin-bottom:10px}
.nb-btn > .btn{align-self:flex-start}
.tag.new{background:#d92d20;color:#fff}
.fm-new td{background:color-mix(in srgb,var(--accent-soft) 55%,transparent)}

/* =====================================================================
   "Saturday" design system layer (design-system/5th-kajang-bb/MASTER.md
   and pages/parade-hq.md). Last in the sheet on purpose.
   Lexend for headings; Atkinson Hyperlegible Next for body and for every
   number, stat, date and small label (tabular figures).
   ===================================================================== */
h1,h2{font-family:var(--fd);text-wrap:balance}
h1{font-size:1.75rem;font-weight:700;line-height:1.2}
h2{font-size:1.125rem;font-weight:600;line-height:1.3}
h3{font-family:var(--f);font-size:1rem;font-weight:700}
.ph .sub{margin-top:6px;max-width:72ch;color:var(--muted)}
.num,.kpi-v,.tile .v,.big,.mini b,.rank-list b.num,.cal button,.hscroll button,.datechips span,.bv,td,.pill,.nbadge{font-variant-numeric:tabular-nums}
.eyebrow,.nav-label,.attn-h,.motto-foot,.lb-motto{text-transform:none;}
.eyebrow{font-size:.875rem;font-weight:700;color:var(--muted)}
.motto-foot{font-family:var(--fd);font-size:.95rem;font-weight:500;color:var(--muted)}
.lb-motto{font-family:var(--fd);font-size:1rem;font-weight:500;color:rgba(255,255,255,.7)}
.attn-h{font-size:.875rem;font-weight:700}
:focus-visible{outline:3px solid var(--ring);outline-offset:2px}
/* soft cards: 12px corners, one faint shadow; controls 10px; badges round */
.card,.tile,.kpi,.attn{border-radius:var(--r);box-shadow:var(--shadow)}
.card{gap:16px}
.btn,.input,select.input,textarea.input,.seg,.ibtn,.icon-btn,.gsearch input,.datebar,.pick button,.mk,.swatch,.attn-i,.cal button,.empty,.notice,.toast,.mini,.rank-list li,.datechips span{border-radius:var(--r-sm)}
.seg button{border-radius:8px}
.btn{font-weight:700;transition:background-color .15s,border-color .15s,color .15s}
.btn:active{transform:translateY(1px)}
.btn.primary:hover{filter:none;background:color-mix(in srgb,var(--accent) 86%,#000)}
.input{border-color:var(--line-strong)}
.input:focus{border-color:var(--accent-text);box-shadow:0 0 0 3px color-mix(in srgb,var(--ring) 25%,transparent);outline:none}
.modal{border-radius:16px 16px 0 0}
@media (min-width:640px){.modal{border-radius:var(--r)}}
.gres{border-radius:var(--r)}
.empty{border-style:dashed}
/* the menu: Night Blue, a gold bar on the current page */
@media (min-width:1000px){
  .side .brandbox{border-radius:var(--r)}
  .side .brandbox b{font-family:var(--fd);font-size:1.125rem;font-weight:700;line-height:1.15}
  .side .nav-label{font-size:.8125rem;font-weight:700;padding-top:16px}
  .side nav a{border-radius:var(--r-sm);position:relative}
  .side nav a[aria-current]{background:rgba(255,255,255,.12);box-shadow:none}
  .side nav a[aria-current]::before{content:"";position:absolute;left:0;top:9px;bottom:9px;width:4px;border-radius:0 3px 3px 0;background:var(--gold-on-dark)}
}
.mtop .ttl b{font-family:var(--fd);font-size:1.0625rem;font-weight:700;line-height:1.2}
.bnav [aria-current]::before{background:var(--accent);height:3px;left:30%;right:30%;border-radius:0 0 3px 3px}
.bnav [aria-current]{color:var(--accent-text)}
/* stat cards: label, number, note; numbers in Atkinson 700 */
.kpi-h{font-size:.875rem;font-weight:700;color:var(--ink-2)}
.kpi-i{display:none!important}
.kpi-v,.kpi .kpi-v{font-family:var(--fn);font-size:2.25rem;font-weight:700;line-height:1.05}
.kpi-v small{font-family:var(--fn);font-size:1rem;font-weight:400;color:var(--muted)}
.kpi-n{font-size:.875rem}
.kpi.feature{background:var(--deep);border-color:var(--deep);color:#fff}
.kpi.feature .kpi-h,.kpi.feature .kpi-n{color:rgba(255,255,255,.82);opacity:1}
.kpi.feature .kpi-v{color:var(--gold-on-dark)}
:root[data-theme="dark"] .kpi.feature{background:#0B1220;border-color:var(--line)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .kpi.feature{background:#0B1220;border-color:var(--line)}}
.tile .v,.big,.mini b{font-family:var(--fn);}
.tile .v{font-size:1.875rem;font-weight:700;line-height:1.1}
.tile .k{font-weight:700}
.big{font-size:2.25rem;font-weight:700}
.big small{font-family:var(--fn);font-size:.875rem;font-weight:400;color:var(--muted)}
.mini b{font-size:1.25rem;font-weight:700}
.report-head h2{font-family:var(--fd);font-size:1.5rem;font-weight:700;}
/* charts: Brigade Blue bars, the latest parade in Badge Gold, dashed grid */
.chart rect{rx:3px;ry:3px}
.chart .b-on{fill:var(--acc);opacity:.85}
.chart .b-hi,.chart .b-tip{fill:var(--gold)}
.chart .b-tipt{fill:#fff;font:700 11px var(--fn)}
.chart .b-0{fill:var(--surface-3)}
.chart .b-lbl{fill:var(--muted);font:400 11px var(--fn)}
.chart .b-grid{stroke:var(--line);stroke-dasharray:4 4}
:root[data-theme="dark"] .chart .b-on{fill:var(--acc-td)}
:root[data-theme="dark"] .chart .b-tipt{fill:#0F1726}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .chart .b-on{fill:var(--acc-td)}:root:not([data-theme="light"]) .chart .b-tipt{fill:#0F1726}}
.bar{height:10px;border-radius:999px}
.bar i{border-radius:999px}
.comp{gap:3px}
.cseg{border-radius:3px}
.dot{border-radius:3px}
.rank-list li:first-child{background:var(--deep);color:#fff}
.rank-list li:first-child .muted,.rank-list li:first-child .small{color:rgba(255,255,255,.8);opacity:1}
.rank-list li:first-child .rk{background:var(--gold-on-dark);color:#172033}
.rank-list b.num{font-family:var(--fn);font-size:1.125rem;font-weight:700}
/* tables: Mist header row, tabular numbers */
th{font-size:.875rem;font-weight:700;color:var(--ink-2);background:var(--surface-2);border-bottom:1px solid var(--line)}
tbody tr + tr td{border-top:1px solid var(--line)}
.tag{border-radius:6px;font-size:.8125rem}
/* parade dates: clear tiles with Atkinson numbers */
.cal{gap:6px}
.cal button{min-height:56px;font-family:var(--fn);font-size:1.0625rem;font-weight:700}
.cal button i{font-family:var(--fn);font-size:.75rem;font-weight:400}
.cal button.has{background:var(--surface);border:2px solid var(--accent)}
.cal button.today{box-shadow:inset 0 -4px 0 var(--gold)}
.cal button.sel{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);box-shadow:none}
.cal .dow{font-weight:700;font-size:.8125rem}
.hscroll button{min-width:62px;font-family:var(--fn)}
.hscroll .btn.primary,.datechips span{box-shadow:none}
/* roll-call marks and status badges keep their words */
.pill{font-weight:700}
.seg button[aria-pressed="true"]{box-shadow:none}
.attn-i em{font-style:normal;text-decoration:underline;text-underline-offset:3px}
/* sign-in */
.lb-mid h1{font-family:var(--fd);font-size:clamp(2rem,5vw,2.75rem);font-weight:700;line-height:1.15}
.lb-mid h1 em{color:inherit;font-style:normal}
.login-panel h2{font-family:var(--fd);font-size:1.75rem;font-weight:700;}
.login-panel h2 + p{margin-top:6px}
.lb-top b{font-family:var(--fd);font-size:1.125rem;font-weight:700}
.fm-cv.ph{background:var(--surface-2)}
.login-brand::after{display:none}
/* ---- type roles (impeccable typeset): one scale, nothing under 13px ----
   xs 13 badges, tags, chart and avatar labels; sm 14 meta, labels, small buttons;
   base 16 body and buttons; lg 18 card titles; 2xl 28 page title; 3xl 36 key numbers */
:root{--text-xs:.8125rem;--text-sm:.875rem;--text-base:1rem;--text-lg:1.125rem;--text-xl:1.375rem;--text-2xl:1.75rem;--text-3xl:2.25rem}
body{font-size:var(--text-base)}
p,li,dd{text-wrap:pretty}
.nbadge,.bnav a,.bnav button,.ttl span,.grow span,.cseg,.pill,.mini span,.rk,.comp-l,.av,.tag,.cal .dow,.cal button i,#sideOrg,#topOrg{font-size:var(--text-xs)}
.small,.card-s,.sub,.bv,.btn.sm,.seg button,.kpi-h,.kpi-n,.attn-h,.attn-i,.eyebrow,th,.motto-foot,.nav-label,.field > span{font-size:var(--text-sm)}
.btn,.input,select.input,textarea.input,td{font-size:var(--text-base)}
.btn.sm{font-size:var(--text-sm)}
td .small,td .sub,td small{font-size:var(--text-sm)}
h1{font-size:var(--text-2xl)}
h2{font-size:var(--text-lg)}
.kpi-v,.kpi .kpi-v{font-size:var(--text-3xl)}
.kpi-v small{font-size:var(--text-base)}
/* the trend headline supports the four stat cards instead of competing with them */
.big{font-size:var(--text-2xl);line-height:1.1}
.big small{font-size:var(--text-sm)}
.mini b{font-size:var(--text-xl)}
.rank-list b.num{font-size:var(--text-lg)}
.rank-list li b{font-size:var(--text-base)}
.chart .b-lbl{font-size:13px}
.chart .b-tipt{font-size:13px}
@media (max-width:640px){.kpi-v,.kpi .kpi-v{font-size:1.875rem}.big{font-size:1.5rem}}
.side-user .grow span,.rank-list .rk{font-size:var(--text-xs)}
.bars .bv,.avbtn{font-size:var(--text-sm)}
.side-user .grow b,.bars .bl,.mtop .ttl b{font-size:var(--text-base)}
.side nav a{font-size:var(--text-base)}
.attn-i span,.attn-i b,.attn-i em{font-size:inherit}
/* ---- polish ---- */
/* browser surfaces carry the palette too */
::selection{background:color-mix(in srgb,var(--accent) 24%,transparent);color:inherit}
:root{accent-color:var(--accent);caret-color:var(--accent-text,var(--accent))}
html{scrollbar-color:var(--line-strong) transparent}
a{text-underline-offset:3px}
h1,h2,h3{text-wrap:balance}
p,li,dd,.lead{text-wrap:pretty}
/* one-sided stripes on rounded boxes become a full border and a tint */
.notice{border:1px solid color-mix(in srgb,var(--accent-text) 30%,var(--line));font-size:var(--text-sm)}
.ordering-msg{border:1px solid color-mix(in srgb,var(--accent-text) 30%,var(--line))}
.fm-q{border-left:1px solid color-mix(in srgb,var(--accent-text) 35%,var(--line))}
/* a round summary inside a card is an inset area, not a second card */
.round{border-color:transparent;background:var(--surface-2);border-radius:var(--r-sm)}

function dropEl(el){if(el&&el.parentNode)el.parentNode.removeChild(el);}
function lockView(root,inModal){

function parseCSV(text){
  var rows=[],row=[],f='',q=false;
  for(var i=0;i<text.length;i++){var ch=text[i];
    if(q){if(ch==='"'){if(text[i+1]==='"'){f+='"';i++;}else q=false;}else f+=ch;}
    else if(ch==='"')q=true; else if(ch===','){row.push(f);f='';} else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&text[i+1]==='\n')i++;row.push(f);rows.push(row);row=[];f='';} else f+=ch;}
  if(f||row.length){row.push(f);rows.push(row);}
  return rows.filter(function(r){return r.some(function(c){return c.trim();});});
}

    if(!name||SECTIONS.indexOf(sec)<0||(sec==='members'&&!(sq>=1&&sq<=4))){bad.push(i+1);return;}
    var rk=RANKS[sec].filter(function(x){return x.toLowerCase()===rank.toLowerCase();})[0]||(sec==='members'?'Private':RANKS[sec][0]);
    out.push({name:name,section:sec,rank:rk,squad:sec==='members'?sq:null,squadLeader:sec==='members'&&lead,division:sec==='members'?dk:'',active:true});
  });
  return {people:out,bad:bad};
}

/* ---------- Members Data: import the members workbook (one sheet per section, plus badge sheets) or a CSV ---------- */
/* Header text → field. Checked in this order; each field is used once. Works with the bilingual headings (英文名 Name(EN) …). */
var IMP_COLS=[
  ['emergencyEmail',/紧急联系人电子邮件|emergency\s*e-?mail/i],['emergencyContact',/紧急联系人名称|emergency\s*contact/i],['relationship',/紧急联系人关系|relationship/i],
  ['englishName',/英文名|name\s*\(\s*en\s*\)|english\s*name/i],['chineseName',/中文名|name\s*\(\s*chi|chinese\s*name/i],['rank',/阶级|\brank\b/i],
  ['age',/年龄|\bages?\b/i],['gender',/性别|gender/i],['race',/种族|\brace\b/i],['religion',/宗教|religion/i],['dob',/出生|date\s*of\s*birth|\bdob\b/i],
  ['parentPhone',/父母|监护人|parent|guardian/i],['phone',/个人电话|personal\s*no|phone/i],['email',/电子邮件|e-?mail/i],['school',/学校|school/i],
  ['address',/地址|address/i],['section',/^\s*(section|组别)\s*$/i]
];
function impSection(s){s=String(s||'').trim();return /pre.?junior|^pj\b/i.test(s)?'Pre-Junior':/^junior|^j\b/i.test(s)?'Junior':/^senior|^s\b/i.test(s)?'Senior':/^primer/i.test(s)?'Primer':/^officer/i.test(s)?'Officer':'';}
function impClean(v){var s=String(v==null?'':v).replace(/\s+/g,' ').trim();return /^[-–—_.\s]+$/.test(s)?'':s;}
function impEN(s){return impClean(String(s||'').replace(/[⺀-鿿　-〿＀-￯（）]/g,' '));}
function impKey(n){return impClean(n).toLowerCase();}
/* "24/06/2011", "10.12.2014", "6/6/2008" (day first) → 2011-06-24 */
function impDate(v){
  var s=impClean(v); if(!s) return {v:''};
  if(/^\d{4}-\d{2}-\d{2}/.test(s)) return {v:s.slice(0,10)};
  var m=s.match(/^(\d{1,2})\s*[\/.\-]\s*(\d{1,2})\s*[\/.\-]\s*(\d{2,4})$/); if(!m) return {v:'',bad:s};
  var d=+m[1], mo=+m[2], y=+m[3]; if(y<100) y+=y>40?1900:2000;
  if(mo<1||mo>12||d<1||d>31||y<1900||y>2100) return {v:'',bad:s};
  return {v:y+'-'+(mo<10?'0':'')+mo+'-'+(d<10?'0':'')+d};
}
/* Malaysian mobiles that lost their leading 0 in Excel (e.g. 198557919) get it back. */
function impPhone(v){var s=impClean(v);return /^1\d{7,9}$/.test(s)?'0'+s:s;}
function impTruthy(v){var s=impClean(v);return !!s&&!/^(no|n|x|0|false)$/i.test(s);}
/* Reads a workbook (from SheetJS) into records: {section, fields…, no, awards, customAwards}. */
function impWorkbook(X,wb){
  var recs=[], problems=[], bySec={}, badges=[];
  wb.SheetNames.forEach(function(sn){
    var rows=X.utils.sheet_to_json(wb.Sheets[sn],{header:1,raw:false,defval:''});
    if(/badge|award|章/i.test(sn)){badges.push({sheet:sn,section:impSection(sn.replace(/badge|award/ig,'').trim()),rows:rows});return;}
    var hi=-1; for(var i=0;i<Math.min(rows.length,10);i++) if(rows[i].some(function(c){return IMP_COLS[3][1].test(String(c));})){hi=i;break;}
    if(hi<0) return;
    var map={}, used={};
    rows[hi].forEach(function(h,c){h=String(h||'');if(!h.trim())return;for(var k=0;k<IMP_COLS.length;k++){var f=IMP_COLS[k];if(!used[f[0]]&&f[1].test(h)){map[c]=f[0];used[f[0]]=1;break;}}});
    var noCol=rows[hi].findIndex(function(h){return /^\s*no\.?\s*$/i.test(String(h));});
    var sheetSec=impSection(sn);
    rows.slice(hi+1).forEach(function(r,j){
      var o={awards:{},customAwards:[]}; Object.keys(map).forEach(function(c){o[map[c]]=r[c];});
      o.englishName=impClean(o.englishName); if(!o.englishName) return;
      o.section=impSection(o.section)||sheetSec;
      if(!o.section){problems.push(sn+' row '+(hi+j+2)+': no section for '+o.englishName);return;}
      ['chineseName','rank','race','religion','school','address','emergencyContact','relationship','email','emergencyEmail'].forEach(function(k){o[k]=impClean(o[k]);});
      if(o.email) o.email=o.email.replace(/\s/g,''); if(o.emergencyEmail) o.emergencyEmail=o.emergencyEmail.replace(/\s/g,'');
      o.gender=/^\s*m/i.test(o.gender||'')?'Male':/^\s*f/i.test(o.gender||'')?'Female':'';
      o.phone=impPhone(o.phone); o.parentPhone=impPhone(o.parentPhone);
      var dd=impDate(o.dob); o.dob=dd.v; if(dd.bad) problems.push(o.englishName+': date of birth “'+dd.bad+'” could not be read, left empty');
      o.age=/^\d{1,2}$/.test(impClean(o.age))?impClean(o.age):'';
      o.no=noCol>=0?impClean(r[noCol]):''; o.sheet=sn;
      recs.push(o); (bySec[o.section]=bySec[o.section]||[]).push(o);
    });
  });
  /* badge sheets: a tick under a badge gives that badge; Junior awards go to the award boxes, the rest are listed by name */
  badges.forEach(function(bs){
    var rows=bs.rows, first=rows.findIndex(function(r){return /^\d+$/.test(impClean(r[0]))&&impClean(r[1]);});
    if(first<0) return; var H=rows.slice(0,first), nameCol=1, labels={};
    var width=Math.max.apply(null,rows.map(function(r){return r.length;}));
    for(var c=2;c<width;c++){
      var label='';
      if(H.length<=1) label=impEN((H[0]||[])[c]);
      else { var nm='',ns=c; for(var k=c;k>=2;k--){if(impClean(H[1][k])){nm=H[1][k];ns=k;break;}}
        var sub=''; if(H[2]) for(var k2=c;k2>=ns;k2--){if(impClean(H[2][k2])){sub=H[2][k2];break;}}
        var lv=H[3]?impClean(H[3][c]):'';
        label=impEN(nm)+(sub&&impEN(sub)?' – '+impEN(sub):'')+(lv?' ('+impEN(lv)+')':''); }
      if(label) labels[c]=label;
    }
    var pool=bySec[bs.section]||[];
    rows.slice(first).forEach(function(r){
      var no=impClean(r[0]), nm=impClean(r[nameCol]); if(!nm) return;
      var w=impKey(nm).split(' ');
      var hit=pool.filter(function(o){return o.no===no&&impKey(o.englishName).split(' ')[0]===w[0];})[0]||pool.filter(function(o){var x=impKey(o.englishName);return x.indexOf(impKey(nm))===0||impKey(nm).indexOf(x)===0;})[0];
      if(!hit){problems.push(bs.sheet+': no member called “'+nm+'” in the '+(bs.section||'?')+' sheet, so their badges were skipped');return;}
      Object.keys(labels).forEach(function(c){if(!impTruthy(r[c]))return;var L=labels[c],a=AWARDS.filter(function(x){return x.toLowerCase()===L.toLowerCase();})[0];
        if(a) hit.awards[a]=true; else if(hit.customAwards.indexOf(L)<0) hit.customAwards.push(L);});
    });
  });
  return {recs:recs,problems:problems};
}
/* Compare with what is already in Members Data (matched by English name). */
function impPlan(recs){
  var have={}; Object.keys(ST.register).forEach(function(k){have[impKey(ST.register[k].englishName)]=k;});
  var seen={}, plan=[];
  recs.forEach(function(o){
    var key=impKey(o.englishName); if(seen[key]){plan.push({o:o,kind:'dup'});return;} seen[key]=1;
    var id=have[key], d={};
    var fields=['section'].concat(REG_FIELDS.map(function(f){return f[0];}));
    if(!id){fields.forEach(function(f){if(o[f])d[f]=o[f];});d.awards=o.awards;d.customAwards=o.customAwards;plan.push({o:o,kind:'new',data:d});return;}
    var r=ST.register[id];
    fields.forEach(function(f){if(o[f]&&String(o[f])!==String(r[f]||''))d[f]=o[f];});
    var aw={}; Object.keys(o.awards).forEach(function(a){if(!(r.awards||{})[a])aw[a]=true;}); if(Object.keys(aw).length) d.awards=aw;
    var ca=(r.customAwards||[]).slice(), more=o.customAwards.filter(function(x){return ca.indexOf(x)<0;}); if(more.length) d.customAwards=ca.concat(more);
    plan.push({o:o,kind:Object.keys(d).length?'update':'same',id:id,data:d});
  });
  return plan;
}

      }).catch(function(er){out.innerHTML='<p class="notice">That file could not be read: '+esc(er.message||String(er))+'</p>';});

/* ---------- find a person by typing (sign-in sheets and groups) ---------- */
var PP_EX={}, PP_FOCUS='';
/* id: the search box id; act: what picking a name does; data: extra data-* for that action; exclude(p): true for people already added. */
function personPicker(id,act,data,exclude,label){
  PP_EX[id]={act:act,data:data||{},exclude:exclude||function(){return false;}};
  return '<div class="ppick"><label class="sr" for="'+id+'">'+esc(label||'Find a person to add')+'</label><div class="searchbox">'+ICON.search+
    '<input class="input" type="search" id="'+id+'" data-input="ppQ" data-pp="'+id+'" placeholder="Type a name to add…" autocomplete="off" role="combobox" aria-expanded="false" aria-autocomplete="list" aria-controls="'+id+'-list"></div>'+
    '<ul class="pp-list" id="'+id+'-list" role="listbox" hidden></ul></div>';
}
function ppMatches(id,q){
  var cfg=PP_EX[id], words=q.toLowerCase().split(/\s+/).filter(Boolean);
  if(!cfg||!words.length) return [];
  return roll().filter(function(p){if(cfg.exclude(p))return false;var hay=(p.name+' '+dispName(p)+' '+GROUP_LABEL[groupOf(p)]).toLowerCase();return words.every(function(w){return hay.indexOf(w)>=0;});}).slice(0,8);
}
ON.ppQ=function(t){
  var id=t.dataset.pp, cfg=PP_EX[id], ul=$('#'+id+'-list'); if(!cfg||!ul) return;
  var q=t.value.trim(), list=ppMatches(id,q), extra=Object.keys(cfg.data).map(function(k){return ' data-'+k+'="'+esc(cfg.data[k])+'"';}).join('');
  ul.innerHTML=!q?'':list.length?list.map(function(p,i){return '<li role="option"'+(i?'':' aria-selected="true"')+'><button type="button" class="pp-opt" data-act="'+cfg.act+'" data-p="'+esc(p.id)+'" data-pp="'+id+'"'+extra+'>'+avatar(p.name)+'<span><b>'+esc(dispName(p))+'</b><small>'+GROUP_LABEL[groupOf(p)]+'</small></span></button></li>';}).join('')
    :'<li class="pp-none">No one on the roll matches “'+esc(q)+'”, or they are already added.</li>';
  ul.hidden=!q; t.setAttribute('aria-expanded',String(!!q));
};
/* Enter adds the first match; Escape clears. */
document.addEventListener('keydown',function(e){
  var t=e.target; if(!t.dataset||!t.dataset.pp||t.tagName!=='INPUT') return;
  if(e.key==='Enter'){e.preventDefault();var first=$('#'+t.dataset.pp+'-list .pp-opt');if(first){t.blur();first.click();}}
  else if(e.key==='Escape'){t.value='';ON.ppQ(t);}
});

function badgeList(){
  var q=CS.q.toLowerCase(), hrs=allHours(), sr=CS.badge==='seniors';
  var list=roll().filter(function(p){
    var h=hrs[p.id],bd=badgeOf(p.id,h);
    if(CS.badge==='basics'&&bd!=='basics')return false; if(CS.badge==='advanced'&&bd!=='advanced')return false;
    if(sr){
      if(divOf(p)!=='sr') return false;
      if(CS.fh==='0'&&h>0||CS.fh==='lt15'&&!(h>0&&h<BASICS)||CS.fh==='15to25'&&!(h>=BASICS&&h<ADVANCED)||CS.fh==='25'&&h<ADVANCED) return false;
      if(CS.fb==='none'&&bd||CS.fb&&CS.fb!=='none'&&bd!==CS.fb) return false;
      if(CS.fs&&groupOf(p)!==CS.fs) return false;
    } else if(!CS.badge&&!q) return false;
    return !q||(p.name+' '+dispName(p)).toLowerCase().indexOf(q)>=0;
  });
  if(sr) list.sort(function(a,b){return CS.sort==='az'?a.name.localeCompare(b.name):CS.sort==='least'?hrs[a.id]-hrs[b.id]||a.name.localeCompare(b.name):hrs[b.id]-hrs[a.id]||a.name.localeCompare(b.name);});
  return {hrs:hrs,list:list};
}

function badgeItems(){
  var b=badgeList();
  if(!b.list.length){
    if(CS.badge==='seniors'&&!roll().some(function(p){return divOf(p)==='sr';})) return '<li class="empty">No one is marked as Senior yet. Set each member’s BB section on the Roster'+(canEdit('roster')?' <button type="button" class="btn sm" data-act="rsDiv">Set BB sections</button>':' (ask the Owner)')+'.</li>';
    return '<li class="empty">'+(CS.q||CS.badge?'No one matches.':'Type a name to find someone.')+'</li>';
  }
  return b.list.map(function(p){
    var h=b.hrs[p.id], bd=badgeOf(p.id,h), before=!!(ST.cshours[p.id]||{}).basicsBefore, pct=Math.min(100,Math.round(h/ADVANCED*100));
    var tag=bd==='advanced'?'<span class="pill c-E">Advanced</span>':bd==='basics'?'<span class="pill c-P">Basics'+(h<BASICS?' (before)':'')+'</span>':'<span class="small muted">'+(Math.round((BASICS-h)*100)/100)+' h to Basics</span>';

      '<div class="bd-bar" role="img" aria-label="'+h+' of '+ADVANCED+' hours"><span style="width:'+pct+'%"></span><i style="left:'+(BASICS/ADVANCED*100)+'%" title="Basics"></i></div>'+
      '<div class="bd-acts"><button class="btn sm" data-act="csMember" data-p="'+esc(p.id)+'">'+ICON.report+'Report</button>'+
      (canCS()?(h<BASICS?'<button class="btn sm'+(before?' primary':'')+'" data-act="csBefore" data-p="'+esc(p.id)+'" aria-pressed="'+before+'">'+(before?ICON.check:'')+'Already has Basics</button>':'')+
        '<span class="bd-add"><input class="input" type="number" min="0.25" max="100" step="0.25" data-f="h" placeholder="Hours" aria-label="Hours to add for '+esc(p.name)+'"><input class="input" data-f="note" maxlength="100" placeholder="What for (optional)" aria-label="What the hours were for"><button class="btn sm" data-act="csAddH" data-p="'+esc(p.id)+'">Add hours</button></span>':'')+
      '</div>'+bdEntries(p)+'</li>';
  }).join('');
}

      sel('csFb','Badge',CS.fb,[['','Any badge'],['none','No badge yet'],['basics','Basics'],['advanced','Advanced']])+

function payMethods(){return (Array.isArray((ST.site||{}).payMethods)?ST.site.payMethods:PAY_DEFAULT).map(function(m){return Object.assign({},m);});}
function savePay(list,msg){return Store.commit([{path:'config/site',merge:true,data:{payMethods:list,updatedAt:new Date().toISOString(),updatedBy:ME.name}}]).then(function(){toast(msg);},function(e){toast(e.message);});}
function proofNames(m){var l=(Array.isArray(m.proofTo)?m.proofTo:[]);if(!l.length&&m.proofPhone)l=[{name:m.proofName,phone:m.proofPhone}];return l.map(function(x){return x.name||x.phone;}).join(', ');}
function proofPicker(m){
  var cur=(Array.isArray(m.proofTo)?m.proofTo:[]).slice(); if(!cur.length&&m.proofPhone) cur=[{name:m.proofName||'',phone:m.proofPhone}];
  var digits=function(p){return String(p||'').replace(/\D/g,'').replace(/^0/,'60');};
  var offs=((ST.site||{}).contacts||[]).filter(function(c){return c&&c.phone;});
  var picked=function(c){return cur.some(function(x){return digits(x.phone)===digits(c.phone);});};
  var other=cur.filter(function(x){return !offs.some(function(c){return digits(c.phone)===digits(x.phone);});})[0]||{};
  return '<div class="field"><span>Who receives the payment proof?</span><small>Parents get a green <b>Send payment proof</b> button for each person you tick, with the order number and amount filled in. Leave all unticked to use the first WhatsApp officer.</small>'+
    (offs.length?'<div class="proof-pick">'+offs.map(function(c,i){return '<label class="check"><input type="checkbox" data-proof="'+i+'"'+(picked(c)?' checked':'')+'> <span><b>'+esc(c.name)+'</b>'+(c.role?' · '+esc(c.role):'')+' <span class="muted">'+esc(c.phone)+'</span></span></label>';}).join('')+'</div>'
      :'<p class="small muted">'+(canEdit('web')?'Add officers under <b>Site details → WhatsApp officers</b> to tick them here.':'No WhatsApp officers yet. Ask the Owner, Admin or Website login to add them under Site details.')+'</p>')+

function readProof(w){
  var offs=((ST.site||{}).contacts||[]).filter(function(c){return c&&c.phone;}), list=[];
  $$('[data-proof]',w).forEach(function(cb){if(cb.checked){var c=offs[+cb.dataset.proof];if(c)list.push({name:c.name||'',phone:c.phone});}});
  var on=$('#pmPN',w).value.trim(), op=$('#pmPP',w).value.trim();
  if(op||on){if(op.replace(/\D/g,'').length<7)throw new Error('Check the WhatsApp number for payment proof.');list.push({name:on,phone:op});}

function qrImage(file){
  return new Promise(function(res,rej){
    if(!/^image\//.test(file.type)) return rej(new Error('Choose an image file.'));
    var r=new FileReader(); r.onerror=function(){rej(new Error('Could not read the image.'));};
    r.onload=function(){var im=new Image();im.onerror=function(){rej(new Error('Could not open the image.'));};im.onload=function(){
      var k=Math.min(1,720/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);
      var x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.imageSmoothingEnabled=false;x.drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/png'));};im.src=r.result;};
    r.readAsDataURL(file);
  });
}

      '<div class="field"><span>QR code <i>(optional)</i></span><div id="pmPrev">'+prev()+'</div><div class="row-btns"><input class="input" type="file" id="pmF" accept="image/*" style="flex:1"><button type="button" class="btn sm ghost" data-pmrm="1">Remove QR</button></div><small>Upload a clear screenshot of the QR. Crop out anything you do not want parents to see.</small></div>'+

function shrinkImage(file,max,quality){
  return new Promise(function(res,rej){
    var url=URL.createObjectURL(file), img=new Image();
    img.onload=function(){
      var r=Math.min(1,max/Math.max(img.width,img.height)), c=document.createElement('canvas');
      c.width=Math.round(img.width*r); c.height=Math.round(img.height*r);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(url);
      var q=quality, out=c.toDataURL('image/jpeg',q); while(out.length>850000&&q>0.4){q-=0.1;out=c.toDataURL('image/jpeg',q);}
      res(out);
    };
    img.onerror=function(){URL.revokeObjectURL(url);rej(new Error('That file could not be read as a photo. Use a JPG or PNG.'));};
    img.src=url;
  });
}

function paintQR(url){loadQR().then(function(Q){var box=$('#fmQR');if(!box)return;var q=Q(0,'M');q.addData(url);q.make();var src=q.createDataURL(8,16);box.innerHTML='<img src="'+src+'" alt="QR code for the form" width="240" height="240"><a class="btn" href="'+src+'" download="'+esc(String(FM.fe.title||'form').replace(/[\\\/:*?"<>|]/g,''))+' QR.gif">'+ICON.dl+'Download QR code</a>';},function(){var box=$('#fmQR');if(box)box.innerHTML='<p class="small muted">The QR code could not load. Check your internet connection.</p>';});}

ACT.fmDup=function(){var f=clone(ST.forms[FM.id]),id='f'+uid(),now=new Date().toISOString();f.title=(f.title||'Form')+' (copy)';f.status='draft';f.closesAtMs=0;f.createdAt=now;f.updatedAt=now;f.createdBy=ME.name;f.updatedBy=ME.name;
  Store.commit([{path:'forms/'+id,data:f}]).then(function(){FM.tab='questions';location.hash='forms/'+id;toast('Copy made. It starts as a draft.');},function(e){toast(e.message);});};

  Store.commit([{path:'forms/'+id,del:true}].concat(rs.map(function(r){return {path:'formResponses/'+r.id,del:true};}))).then(function(){FM.dirty=false;FM.fe=null;FM.id='';location.hash='forms';toast('Form deleted');},function(e){toast(e.message);});});};

/* ---------- Notice board ---------- */
var NB_TAGS=['Announcement','Event','Camp','Form','Reminder'];
function noticeList(){return Object.keys(ST.notices||{}).map(function(k){return Object.assign({id:k},ST.notices[k]);}).sort(function(a,b){return (b.pinned?1:0)-(a.pinned?1:0)||(b.date||'').localeCompare(a.date||'')||(b.updatedAt||'').localeCompare(a.updatedAt||'');});}
function noticeState(n){if(!n.published)return 'draft';if(n.until&&n.until<today())return 'expired';return 'live';}
var NB_LABEL={live:'Showing',draft:'Hidden',expired:'Expired'}, NB_CLS={live:'c-P',draft:'c-U',expired:'c-L'};
function nbImg(src){return !src?'':(/^(data:|https?:)/.test(src)?src:ROOT+src);}
VIEWS.notices=function(){
  var list=noticeList(), live=list.filter(function(n){return noticeState(n)==='live';});
  var html=head('Notice board','Announcements, camps and forms for parents and members. They have their own page, so the main website stays tidy.',(ROOT?'<a class="btn" href="'+ROOT+'notices/" target="_blank" rel="noopener">'+ICON.arrowur+'View notice board</a>':'')+'<button class="btn primary" data-act="nbNew">'+ICON.plus+'New notice</button>')+
    '<div class="kpis">'+kpi('notices','Showing',String(live.length),'On the notice board now',live.length>0)+kpi('edit','Hidden',String(list.filter(function(n){return !n.published;}).length),'Drafts only staff can see')+kpi('pin','Pinned',String(list.filter(function(n){return n.pinned&&noticeState(n)==='live';}).length),'Stay at the top')+'</div>'+
    '<section class="card"><div class="card-h"><div><h2>Notices</h2><p class="card-s">Pinned first, then newest. A notice disappears by itself after its “Show until” date.</p></div><a class="btn sm" href="#forms">'+ICON.forms+'Forms</a></div>'+
    (list.length?'<div class="nb-list">'+list.map(function(n){var st=noticeState(n),bs=(n.buttons||[]).filter(function(x){return x&&(x.form||x.url);});
      return '<div class="nb-row">'+(n.image?'<img class="nb-th" src="'+esc(nbImg(n.image))+'" alt="" width="72" height="54">':'<span class="nb-th ph">'+ICON.notices+'</span>')+
        '<div class="nb-b"><div class="nb-t"><b>'+esc(n.title)+'</b>'+(n.pinned?'<span class="tag">Pinned</span>':'')+(n.tag?'<span class="tag grey">'+esc(n.tag)+'</span>':'')+'</div>'+
        '<span class="small muted">'+esc([n.date?fmtDate(n.date):'',n.until?'until '+fmtDate(n.until):'',bs.length?plural(bs.length,'button'):''].filter(Boolean).join(' · '))+'</span></div>'+
        '<span class="pill '+NB_CLS[st]+'">'+NB_LABEL[st]+'</span><div class="acts"><button class="ibtn sm" data-act="nbPin" data-id="'+esc(n.id)+'" aria-label="'+(n.pinned?'Unpin ':'Pin ')+esc(n.title)+'" aria-pressed="'+!!n.pinned+'">'+ICON.pin+'</button><button class="ibtn sm" data-act="nbEdit" data-id="'+esc(n.id)+'" aria-label="Edit '+esc(n.title)+'">'+ICON.edit+'</button><button class="ibtn sm" data-act="nbDel" data-id="'+esc(n.id)+'" aria-label="Delete '+esc(n.title)+'">'+ICON.x+'</button></div></div>';}).join('')+'</div>'
      :'<p class="empty">No notices yet. Add one for your next camp or event, with a picture and a button to its form.</p>')+'</section>';
  view.innerHTML=html;
};
function nbBtnRow(b,i){var forms=formList();b=b||{label:'',form:'',url:''};var kind=b.url&&!b.form?'link':'form';
  return '<div class="nb-btn" data-bi="'+i+'"><div class="grid2"><label class="field"><span>Button text</span><input class="input" data-b="label" value="'+esc(b.label||'')+'" maxlength="40" placeholder="'+(kind==='form'?'Fill in the form':'Open link')+'"></label>'+
    '<label class="field"><span>Opens</span><select class="input" data-b="kind">'+opt('form','One of your forms',kind)+opt('link','A web link',kind)+'</select></label></div>'+
    '<label class="field" data-show="form"'+(kind==='form'?'':' hidden')+'><span>Form</span><select class="input" data-b="form"><option value="">Choose a form…</option>'+forms.map(function(f){return opt(f.id,(f.title||'Untitled form')+' ('+FS_LABEL[formState(f)]+')',b.form);}).join('')+'</select></label>'+
    '<label class="field" data-show="link"'+(kind==='link'?'':' hidden')+'><span>Link</span><input class="input" data-b="url" type="url" value="'+esc(b.url||'')+'" placeholder="https://…"></label>'+
    '<button class="btn sm" type="button" data-nb="rmBtn">Remove button</button></div>';}
function noticeModal(id,pre){
  var n=id?clone(ST.notices[id]):Object.assign({title:'',body:'',tag:'Announcement',image:'',date:today(),until:'',pinned:false,published:true,buttons:[]},pre||{});
  var img=n.image||'';
  var paintImg=function(w){$('#nbImgBox',w).innerHTML=img?'<img src="'+esc(nbImg(img))+'" alt="Notice picture"><button class="btn sm" type="button" data-nb="rmImg">Remove picture</button>':'<p class="small muted">No picture. Posters and event photos work well.</p>';};
  openModal({title:id?'Edit notice':'New notice',
    html:'<form class="form">'+
      '<label class="field"><span>Title</span><input class="input" id="nbT" value="'+esc(n.title)+'" maxlength="120" placeholder="Annual Camp 2027: registration open"></label>'+
      '<div class="grid2"><label class="field"><span>Type</span><select class="input" id="nbTag">'+NB_TAGS.map(function(t){return opt(t,t,n.tag);}).join('')+'</select></label>'+
      '<label class="field"><span>Posted on</span><input class="input" type="date" id="nbD" value="'+esc(n.date||today())+'"></label></div>'+
      '<label class="field"><span>Message</span><textarea class="input" id="nbB" rows="6" maxlength="3000" placeholder="Dates, place, what to bring, fees and who to contact.">'+esc(n.body||'')+'</textarea><small>Web links in the message become clickable.</small></label>'+
      '<div class="field"><span>Picture <i>(optional)</i></span><div class="nb-img" id="nbImgBox"></div><label class="btn sm" style="align-self:flex-start">'+ICON.image+'Choose picture<input type="file" accept="image/*" id="nbImg" hidden></label></div>'+
      '<div class="field"><span>Buttons <i>(optional, up to 3)</i></span><div id="nbBtns">'+(n.buttons||[]).map(nbBtnRow).join('')+'</div><button class="btn sm" type="button" data-nb="addBtn" style="align-self:flex-start">'+ICON.plus+'Add a button</button></div>'+
      '<label class="field"><span>Show until <i>(optional)</i></span><input class="input" type="date" id="nbU" value="'+esc(n.until||'')+'"><small>After this date the notice hides by itself. Leave empty to keep it up.</small></label>'+
      '<label class="check"><input type="checkbox" id="nbP"'+(n.pinned?' checked':'')+'> Pin to the top</label>'+
      '<label class="check"><input type="checkbox" id="nbPub"'+(n.published!==false?' checked':'')+'> Show on the notice board</label></form>',
    actions:[{label:'Cancel',value:'no'},{label:id?'Save notice':'Post notice',value:'go',kind:'primary'}],
    onOpen:function(w){paintImg(w);},
    onClick:function(e,w){var b=e.target.closest('[data-nb]');if(!b)return;var a=b.dataset.nb;
      if(a==='rmImg'){img='';paintImg(w);}
      else if(a==='addBtn'){var box=$('#nbBtns',w);if($$('.nb-btn',box).length>=3)return toast('Up to 3 buttons.');box.insertAdjacentHTML('beforeend',nbBtnRow(null,$$('.nb-btn',box).length));}
      else if(a==='rmBtn'){b.closest('.nb-btn').remove();}},
    onChange:function(e,w){var t=e.target;
      if(t.id==='nbImg'&&t.files&&t.files[0]){shrinkImage(t.files[0],1200,0.8).then(function(u){img=u;paintImg(w);},function(x){toast(x.message);});}
      if(t.dataset.b==='kind'){var row=t.closest('.nb-btn');$$('[data-show]',row).forEach(function(x){x.hidden=x.dataset.show!==t.value;});$('[data-b=label]',row).placeholder=t.value==='form'?'Fill in the form':'Open link';}},
    onAction:function(v,w){
      if(v!=='go') return;
      var title=$('#nbT',w).value.trim(); if(!title) throw new Error('Give the notice a title.');
      var buttons=$$('.nb-btn',w).map(function(r){var k=$('[data-b=kind]',r).value,lab=$('[data-b=label]',r).value.trim();
        if(k==='form'){var f=$('[data-b=form]',r).value;if(!f)throw new Error('Choose which form each button opens.');return {label:lab||'Fill in the form',form:f,url:''};}
        var u=$('[data-b=url]',r).value.trim();if(!/^https?:\/\/\S+$/i.test(u))throw new Error('Each link must start with https://');return {label:lab||'Open link',form:'',url:u};});
      var until=$('#nbU',w).value, now=new Date().toISOString();
      var d={title:title,tag:$('#nbTag',w).value,body:$('#nbB',w).value.trim(),image:img,date:$('#nbD',w).value||today(),until:until,pinned:$('#nbP',w).checked,published:$('#nbPub',w).checked,buttons:buttons,updatedAt:now,updatedBy:ME.name,createdAt:(id&&ST.notices[id].createdAt)||now};
      var nid=id||('n'+uid());
      return Store.commit([{path:'notices/'+nid,data:d}]).then(function(){toast(id?'Notice saved':(d.published?'Notice posted on the notice board':'Notice saved as hidden'));if(!id&&currentPage!=='notices')location.hash='notices';});
    }});
}

/* ---------- Website: Uniform items ---------- */
var USEC={pj:'Pre-Junior',jr:'Junior',sr:'Senior'};
function rm(n){return 'MYR '+new Intl.NumberFormat('en-MY',{minimumFractionDigits:2,maximumFractionDigits:2}).format(Math.round((+n||0)*100)/100);}
function uniList(){return Object.keys(ST.uniformItems).map(function(k){return Object.assign({id:k},ST.uniformItems[k]);}).sort(function(a,b){return (a.order||0)-(b.order||0)||String(a.name).localeCompare(b.name);});}
var UI={sec:'all',q:''};
function uiVisible(list){return list.filter(function(t){return UI.sec==='all'||(t.sections||[]).indexOf(UI.sec)>=0;});}
function uiMatch(t,q){return !q||(t.name+' '+(t.sizes||'')+' '+(t.ask||'')+' '+(t.note||'')).toLowerCase().indexOf(q)>=0;}
function uniPanel(){
  var all=uniList(), list=uiVisible(all), q=UI.q.trim().toLowerCase();
  return '<section class="card"><div class="card-h"><div><h2>Uniform items</h2><p class="card-s">The parts parents can order on the Uniform page of the website: prices, sizes, size charts, photos and stock.</p></div><div class="row-btns">'+(ROOT?'<a class="btn" href="'+ROOT+'uniform/" target="_blank" rel="noopener">'+ICON.arrowur+'Open the order page</a>':'')+
    (list.length?'<button class="btn primary" data-act="uiAdd">'+ICON.plus+'Add part</button>':'<button class="btn primary" data-act="uiImport">Load the current price list ('+UNI_DEFAULT.length+' parts)</button>')+'</div></div>'+
    (all.length?'<div class="toolbar">'+segHTML('uiSec',[['all','All'],['pj','Pre-Junior'],['jr','Junior'],['sr','Senior']],UI.sec)+'<div class="searchbox">'+ICON.search+'<input class="input" type="search" id="uiQ" data-input="uiQ" value="'+esc(UI.q)+'" placeholder="Search parts, sizes…" aria-label="Search parts" autocomplete="off"></div></div>'+
      '<div class="tbl-wrap"><table><thead><tr><th>Part</th><th>Price</th><th class="hide-sm">Sizes / details asked</th><th>Stock</th><th></th></tr></thead><tbody>'+list.map(function(t,i){
      return '<tr data-uirow="'+esc((t.name+' '+(t.sizes||'')+' '+(t.ask||'')+' '+(t.note||'')).toLowerCase())+'"'+(uiMatch(t,q)?'':' hidden')+'><td><div><b>'+esc(t.name)+'</b><div class="small muted">'+(t.group==='custom'?'Customised':'General')+' · '+esc((t.sections||[]).map(function(s){return USEC[s];}).join(', ')||'No section')+(t.chart?' · size chart':'')+'</div></div></td><td class="num">'+rm(t.price)+'</td>'+
        '<td class="hide-sm" style="white-space:normal">'+esc([t.sizes,t.ask?('asks: '+t.ask):''].filter(Boolean).join(' · ')||'—')+'</td><td>'+(t.hidden?'<span class="pill c-U">Hidden</span>':t.available===false?'<span class="pill c-A">Out of stock</span>':'<span class="pill c-P">Available</span>')+'</td>'+
        '<td><div class="acts"><button class="ibtn sm" data-act="uiMove" data-id="'+esc(t.id)+'" data-v="-1" aria-label="Move '+esc(t.name)+' up"'+(i?'':' disabled')+'>'+ICON.up+'</button><button class="ibtn sm" data-act="uiMove" data-id="'+esc(t.id)+'" data-v="1" aria-label="Move '+esc(t.name)+' down"'+(i<list.length-1?'':' disabled')+'>'+ICON.down+'</button>'+
        '<button class="ibtn sm" data-act="uiEdit" data-id="'+esc(t.id)+'" aria-label="Edit '+esc(t.name)+'">'+ICON.edit+'</button><button class="ibtn sm" data-act="uiDel" data-id="'+esc(t.id)+'" aria-label="Remove '+esc(t.name)+'">'+ICON.x+'</button></div></td></tr>';}).join('')+'</tbody></table></div><p class="empty" id="uiNone"'+(list.some(function(t){return uiMatch(t,q);})?' hidden':'')+'>No parts match. Try another word or section.</p>'
    :'<p class="empty">Nothing saved here yet, so the website shows the built-in price list ('+UNI_DEFAULT.length+' parts for Pre-Junior, Junior and Senior). Load it to change prices, sizes, size charts or stock.</p>')+'</section>';
}
ACT.uiImport=function(){
  Store.commit(UNI_DEFAULT.map(function(t){var d=clone(t);delete d.id;return {path:'uniformItems/'+t.id,data:d};})).then(function(){toast('Loaded '+UNI_DEFAULT.length+' parts');},function(e){toast(e.message);});
};
ACT.uiSec=function(b){UI.sec=b.dataset.v;render();};
ON.uiQ=function(t){UI.q=t.value;var q=t.value.trim().toLowerCase(),any=false;$$('[data-uirow]').forEach(function(r){var ok=!q||r.dataset.uirow.indexOf(q)>=0;r.hidden=!ok;if(ok)any=true;});var n=$('#uiNone');if(n)n.hidden=any;};
ACT.uiMove=function(b){
  var list=uniList(), vis=uiVisible(list), i=-1; vis.forEach(function(t,k){if(t.id===b.dataset.id)i=k;}); var j=i+ +b.dataset.v;
  if(i<0||j<0||j>=vis.length) return; var a=list.indexOf(vis[i]), c=list.indexOf(vis[j]), x=list[a];list[a]=list[c];list[c]=x;
  Store.commit(list.map(function(t,k){return {path:'uniformItems/'+t.id,merge:true,data:{order:k}};})).catch(function(e){toast(e.message);});
};
ACT.uiDel=function(b){
  var t=ST.uniformItems[b.dataset.id];

    if(ok) Store.commit([{path:'uniformItems/'+b.dataset.id,del:true}]).then(function(){toast('Removed '+t.name);},function(e){toast(e.message);});
  });
};
function uniModal(id){
  var t=id?clone(ST.uniformItems[id]):{group:'general',sections:[],available:true}, chart=t.chart||'';

  function prev(){var src=postImg(chart);return src?'<img src="'+esc(src)+'" alt="" style="max-width:220px;border-radius:10px;border:1px solid var(--line);background:#fff">':'<p class="small muted">No size chart.</p>';}

/* ---------- Uniform orders ---------- */

var autoClosing=false, autoClosedKey='';
function uniAutoClose(){

function photoMode(){return MODE==='demo'?'demo':(ST.drive&&ST.drive.url?'drive':'off');}
function photoList(o,kind){return (o&&o[PH_FIELD[kind]])||[];}
function pickedMap(o){var m={};((o&&o.picked)||[]).forEach(function(p){if(p&&p.i!=null)m[p.i]=p;});return m;}
/* Every request carries the officer's sign-in token. The script reads the order with it, so the database rules decide who may continue. */
function driveCall(body,url){
  url=url||(ST.drive&&ST.drive.url);
  if(!url) return Promise.reject(new Error('Google Drive is not connected yet. The Owner or Admin can connect it under Photo storage on the Uniform orders page.'));
  var u=Fire.auth&&Fire.auth.currentUser; if(!u) return Promise.reject(new Error('Sign in again, then retry.'));
  return u.getIdToken().then(function(t){
    body.token=t;
    return fetch(url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body)}).catch(function(){throw new Error('Could not reach Google Drive. Check the internet connection and try again. If it keeps failing, check the web app is shared with “Anyone”.');});
  }).then(function(r){
    return r.text().then(function(tx){
      var j=null; try{j=JSON.parse(tx);}catch(e){}
      if(!j) throw new Error(r.ok?'That link did not answer like the photo script. Use the web app link that ends in /exec.':'Google Drive did not answer ('+r.status+'). Try again in a minute.');
      if(!j.ok) throw new Error(j.error||'Google Drive could not do that.');
      return j;
    });
  });
}
/* Photos are shrunk on the phone before upload (long side 2000px, JPEG), so receipts stay readable and uploads stay quick. */
function photoPrep(file){
  return new Promise(function(res,rej){
    var nm=file.name||'photo';
    if(file.type==='application/pdf'){
      if(file.size>8*1024*1024) return rej(new Error(nm+' is over 8 MB. Take a screenshot of it instead.'));
      var fr=new FileReader(); fr.onerror=function(){rej(new Error('Could not read '+nm+'.'));};
      fr.onload=function(){res({mime:'application/pdf',data:String(fr.result).split(',')[1]||'',thumb:'',name:nm});}; fr.readAsDataURL(file); return;
    }
    if(file.type&&!/^image\//.test(file.type)) return rej(new Error(nm+' is not a photo or PDF.'));
    var url=URL.createObjectURL(file), img=new Image();
    img.onload=function(){
      function draw(max,q){var k=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.naturalWidth*k));c.height=Math.max(1,Math.round(img.naturalHeight*k));var x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);return c.toDataURL('image/jpeg',q);}
      var full=draw(2000,.82), thumb=draw(240,.6); URL.revokeObjectURL(url);
      res({mime:'image/jpeg',data:full.split(',')[1],thumb:thumb,name:nm});
    };
    img.onerror=function(){URL.revokeObjectURL(url);rej(new Error('Could not open '+nm+' as a picture. Choose a JPG or PNG, or take a screenshot of it.'));};
    img.src=url;
  });
}
function b64Url(mime,b64){var bin=atob(b64),a=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return URL.createObjectURL(new Blob([a],{type:mime}));}
function photoSave(oid,kind,p){
  var rec={id:'',name:p.name,mime:p.mime,thumb:p.thumb,at:new Date().toISOString(),by:ME.name};
  if(MODE==='demo'){
    rec.id='demo-'+uid();
    try{localStorage.setItem('bb5kj-photo:'+rec.id,p.mime+'|'+p.data);}catch(e){return Promise.reject(new Error('This browser has no room left for demo photos. Remove a few first.'));}
    return Promise.resolve(rec);
  }
  return driveCall({action:'upload',order:oid,kind:kind,mime:p.mime,data:p.data,by:ME.name}).then(function(j){rec.id=j.id;rec.url=j.url||'';rec.name=j.name||rec.name;return rec;});
}
function photoGet(oid,rec){
  if(PH_CACHE[rec.id]) return Promise.resolve(PH_CACHE[rec.id]);
  if(MODE==='demo'){
    var d=ls('bb5kj-photo:'+rec.id); if(!d) return Promise.reject(new Error('This demo photo is no longer saved in this browser.'));
    var i=d.indexOf('|'); return Promise.resolve(PH_CACHE[rec.id]=b64Url(d.slice(0,i),d.slice(i+1)));
  }
  return driveCall({action:'get',order:oid,file:rec.id}).then(function(j){return PH_CACHE[rec.id]=b64Url(j.mime,j.data);});
}
function photoAdd(oid,kind,files){
  files=[].slice.call(files||[]); if(!files.length) return Promise.resolve();
  if(photoMode()==='off'){toast(canEdit('drive')?'Connect Google Drive first, under Photo storage on the Uniform orders page.':'Photo storage is not connected yet. Ask the Owner or Admin to connect Google Drive.');return Promise.resolve();}
  var o=ST.orders[oid]; if(!o) return Promise.resolve();
  var key=oid+'|'+kind, room=PH_MAX-photoList(o,kind).length-(PH_BUSY[key]||0);
  if(files.length>room){toast(room>0?'Only '+room+' more can be added here (up to '+PH_MAX+' per order).':'This order already has '+PH_MAX+' here. Remove one first.');files=files.slice(0,Math.max(0,room));}
  if(!files.length) return Promise.resolve();
  var ok=0, fails=[];
  PH_BUSY[key]=(PH_BUSY[key]||0)+files.length; render();
  return files.reduce(function(p,f){return p.then(function(){
    return photoPrep(f).then(function(pp){return photoSave(oid,kind,pp);}).then(function(rec){
      var cur=ST.orders[oid]; if(!cur) throw new Error('This order was deleted.');
      var list=photoList(cur,kind).filter(function(r){return r.id!==rec.id;}).concat([rec]), data={}; data[PH_FIELD[kind]]=list;
      return Store.commit([{path:'orders/'+oid,merge:true,data:data}]).then(function(){cur[PH_FIELD[kind]]=list;ok++;});
    }).catch(function(e){fails.push(e.message||String(e));}).then(function(){PH_BUSY[key]=Math.max(0,(PH_BUSY[key]||1)-1);render();});
  });},Promise.resolve()).then(function(){
    var what=kind==='pay'?['Payment proof','payment proof']:['Handover photo','handover photo'];
    if(fails.length) toast((ok?plural(ok,'file')+' saved. ':'')+fails[0]);
    else toast(ok===1?what[0]+' saved':plural(ok,what[1])+' saved');
  });
}
function photoRemove(oid,kind,rec){
  var o=ST.orders[oid]||{};
  confirmBox('Remove this '+PH_NAME[kind].toLowerCase()+'?','<p>It is taken off order '+esc(o.ref||'')+(photoMode()==='drive'?' and moved to the Google Drive bin, which keeps it for 30 days.':'.')+'</p>','Remove','danger').then(function(ok){
    if(!ok) return;
    var p=MODE==='demo'?Promise.resolve(ls('bb5kj-photo:'+rec.id,null)):driveCall({action:'delete',order:oid,file:rec.id});
    p.then(function(){
      var cur=ST.orders[oid]; if(!cur) return;
      var list=photoList(cur,kind).filter(function(r){return r.id!==rec.id;}), data={}; data[PH_FIELD[kind]]=list;
      if(kind==='pay'&&!list.length) data.payChecked='';
      return Store.commit([{path:'orders/'+oid,merge:true,data:data}]).then(function(){cur[PH_FIELD[kind]]=list;delete PH_CACHE[rec.id];render();toast(PH_NAME[kind]+' removed');});
    }).catch(function(e){toast(e.message);});
  });
}

function orHint(o){

}

ON.phPick=function(t){var f=[].slice.call(t.files||[]);t.value='';PH_ZONE=t.dataset.kind;photoAdd(t.dataset.id,t.dataset.kind,f);};
ACT.phOpen=function(b){

  var rec=photoList(o,kind).filter(function(r){return r.id===b.dataset.p;})[0]; if(!rec) return;

function pkSave(id,list,msg,focusSel){
  Store.commit([{path:'orders/'+id,merge:true,data:{picked:list}}]).then(function(){
    var o=ST.orders[id]; if(o) o.picked=list; render();

    if(msg) toast(msg);
  },function(e){toast(e.message);render();});
}
ON.pkTick=function(t){
  var id=t.dataset.id, o=ST.orders[id]; if(!o) return;
  var i=+t.dataset.i, l=(o.items||[])[i]||{}, list=(o.picked||[]).filter(function(p){return p.i!==i;});
  if(t.checked) list.push({i:i,name:l.name||'',at:new Date().toISOString(),by:ME.name});
  list.sort(function(a,b){return a.i-b.i;});
  var all=list.length===(o.items||[]).length;

ACT.pkAll=function(b){
