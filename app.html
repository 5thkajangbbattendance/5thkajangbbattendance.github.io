<title>5th Kajang BB Attendance</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Source+Sans+3:wght@400;500;600;700&display=swap">
<style>
/* Layout: navy header band + single centred column (max 860px); tab bar fixed to bottom on phones, under the header on wide screens. */
:root{
  --acc:#14294f; --acc-tl:#14294f; --acc-td:#a9c1f2; --acc-sl:#e7ecf6; --acc-sd:#1b2b4b;
  --bg:#f3f5f9; --surface:#ffffff; --ink:#101a2e; --muted:#56627a; --line:#d9dfea; --line-strong:#b9c3d6;
  --head-bg:var(--acc); --head-ink:#ffffff;
  --accent:var(--acc); --accent-ink:#ffffff; --accent-text:var(--acc-tl); --accent-soft:var(--acc-sl);
  --p:#1d7a45; --p-bg:#e2f3e8; --l:#985a00; --l-bg:#fcefd6; --a:#b4271b; --a-bg:#fce6e3; --e:#3949a8; --e-bg:#e6e9fb; --u:#5d6880; --u-bg:#eceff4;
  --shadow:0 1px 2px rgba(16,26,46,.06),0 4px 14px rgba(16,26,46,.06);
  --f-display:"Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Source Sans 3",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --radius:10px; --tabs-h:64px;
}
:root[data-accent="royal"]{--acc:#1d4bb0;--acc-tl:#1b46a6;--acc-td:#a7c0fa;--acc-sl:#e6edfc;--acc-sd:#192d57}
:root[data-accent="teal"]{--acc:#0d5c63;--acc-tl:#0b545a;--acc-td:#8fd6d9;--acc-sl:#e0f1f2;--acc-sd:#123a3e}
:root[data-accent="maroon"]{--acc:#7a1f2b;--acc-tl:#731d29;--acc-td:#f0a9b2;--acc-sl:#f7e6e8;--acc-sd:#3f1d23}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0b1222; --surface:#131c30; --ink:#e7ecf6; --muted:#9ba7bf; --line:#253250; --line-strong:#3a4a6c;
  --head-bg:#0f1a31; --accent-text:var(--acc-td); --accent-soft:var(--acc-sd);
  --p:#5fd08d; --p-bg:#143424; --l:#f0b65a; --l-bg:#3a2a10; --a:#ff8a7e; --a-bg:#3d1a17; --e:#a3b0ff; --e-bg:#1f2550; --u:#a3adc2; --u-bg:#222c42;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0b1222; --surface:#131c30; --ink:#e7ecf6; --muted:#9ba7bf; --line:#253250; --line-strong:#3a4a6c;
  --head-bg:#0f1a31; --accent-text:var(--acc-td); --accent-soft:var(--acc-sd);
  --p:#5fd08d; --p-bg:#143424; --l:#f0b65a; --l-bg:#3a2a10; --a:#ff8a7e; --a-bg:#3d1a17; --e:#a3b0ff; --e-bg:#1f2550; --u:#a3adc2; --u-bg:#222c42;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.45;padding-bottom:calc(var(--tabs-h) + env(safe-area-inset-bottom,0px) + 16px)}
body.task-mode{padding-bottom:calc(150px + env(safe-area-inset-bottom,0px))}
body.modal-open{overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--head-bg)}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15;letter-spacing:.005em}
h1{font-size:1.9rem;font-weight:700}
h2{font-size:1.3rem;font-weight:600}
h3{font-size:1.1rem;font-weight:600}
p{margin:0}
a{color:var(--accent-text)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent-text);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.eyebrow{font-family:var(--f-display);font-size:.8rem;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:.9rem}

/* header */
.demo-banner{background:#f6c445;color:#2b2100;font-size:.9rem;font-weight:600;padding-block:6px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));text-align:center}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--head-bg);color:var(--head-ink)}
.top-in{max-width:900px;margin:0 auto;display:flex;align-items:center;gap:12px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;flex-direction:column;min-width:0;flex:1}
.brand .eyebrow{color:rgba(255,255,255,.7);font-size:.72rem}
.org{font-family:var(--f-display);font-weight:700;font-size:1.15rem;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{display:inline-grid;place-items:center;width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;flex:none}
.icon-btn.hdr{background:transparent;border-color:rgba(255,255,255,.35);color:#fff}
.icon-btn svg{width:22px;height:22px}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);border-top:1px solid var(--line);position:fixed;left:0;right:0;bottom:0;z-index:20;padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabs a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:var(--tabs-h);text-decoration:none;color:var(--muted);font-weight:600;font-size:.82rem}
.tabs a svg{width:24px;height:24px}
.tabs a[aria-current="page"]{color:var(--accent-text)}
.tabs a[aria-current="page"] svg{stroke-width:2.4}
body.task-mode .tabs{display:none}
@media (min-width:900px){
  body{padding-bottom:32px} body.task-mode{padding-bottom:120px}
  .tabs{position:static;max-width:900px;margin:0 auto;background:transparent;border:0;display:flex;gap:4px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .tabs a{flex-direction:row;min-height:44px;padding:0 16px;color:rgba(255,255,255,.75);font-size:1rem;border-bottom:3px solid transparent}
  .tabs a svg{width:20px;height:20px}
  .tabs a[aria-current="page"]{color:#fff;border-bottom-color:#fff}
  body.task-mode .tabs{display:flex}
}

/* page */
.wrap{max-width:900px;margin:0 auto;padding-block:20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:22px}
.page-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.page-head > div{min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}
.section{display:flex;flex-direction:column;gap:12px}
.section-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:10px;border:1.5px solid var(--line-strong);background:var(--surface);font-weight:600;font-size:1rem;cursor:pointer;text-decoration:none;color:var(--ink);white-space:nowrap}
.btn:hover{border-color:var(--accent-text)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.12)}
.btn.danger{color:var(--a);border-color:var(--a)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--accent-text)}
.btn:disabled{opacity:.5;cursor:not-allowed;filter:none}
.btn svg{width:20px;height:20px}
.btn.block{width:100%}
.take-cta{min-height:64px;font-family:var(--f-display);font-size:1.45rem;letter-spacing:.02em;border-radius:12px}
.take-cta svg{width:28px;height:28px}

/* forms */
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field > span{font-weight:600;font-size:.95rem}
.field small{color:var(--muted);font-size:.85rem}
.input,select.input,textarea.input{width:100%;min-height:48px;padding:10px 12px;border-radius:10px;border:1.5px solid var(--line-strong);background:var(--surface);font-size:1rem}
textarea.input{min-height:80px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(220px,100%),1fr));gap:14px}
.form{display:flex;flex-direction:column;gap:14px}
.searchbox{position:relative}
.searchbox svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:20px;height:20px;color:var(--muted)}
.searchbox .input{padding-left:42px}

/* status visuals */
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-weight:600;font-size:.88rem;line-height:1.4;white-space:nowrap}
.chip::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor;flex:none}
.c-P{color:var(--p);background:var(--p-bg)} .c-L{color:var(--l);background:var(--l-bg)} .c-A{color:var(--a);background:var(--a-bg)} .c-E{color:var(--e);background:var(--e-bg)} .c-U{color:var(--u);background:var(--u-bg)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(130px,46%),1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;display:flex;flex-direction:column;gap:2px;border-top:5px solid var(--sc)}
.tile .k{display:flex;align-items:center;gap:7px;font-weight:600;color:var(--sc)}
.tile .k::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--sc)}
.tile .v{font-family:var(--f-display);font-size:2.1rem;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.tile.rate{--sc:var(--accent-text)} .tile.rate .k::before{display:none}
.s-P{--sc:var(--p)} .s-L{--sc:var(--l)} .s-A{--sc:var(--a)} .s-E{--sc:var(--e)} .s-U{--sc:var(--u)}
.bar{display:flex;height:10px;border-radius:999px;overflow:hidden;background:var(--u-bg)}
.bar i{display:block;height:100%}
.bar .b-P{background:var(--p)} .bar .b-L{background:var(--l)} .bar .b-A{background:var(--a)} .bar .b-E{background:var(--e)}

/* session cards */
.sess-list{display:flex;flex-direction:column;gap:10px;list-style:none;margin:0;padding:0}
.sess{display:flex;flex-direction:column;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;text-decoration:none;color:inherit;box-shadow:var(--shadow)}
.sess:hover{border-color:var(--accent-text)}
.sess-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.sess-top > div{min-width:0}
.sess-name{font-weight:700;font-size:1.08rem}
.sess-meta{color:var(--muted);font-size:.93rem}
.go{color:var(--accent-text);font-weight:600;white-space:nowrap;font-size:.95rem;display:inline-flex;align-items:center;gap:4px}
.date-h{font-family:var(--f-display);font-weight:600;font-size:1rem;color:var(--muted);letter-spacing:.03em;margin-top:6px}
.empty{border:1.5px dashed var(--line-strong);border-radius:var(--radius);padding:20px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:10px;align-items:center}

/* take attendance */
.take-head{display:flex;flex-direction:column;gap:6px}
.back{display:inline-flex;align-items:center;gap:4px;font-weight:600;text-decoration:none;min-height:40px}
.sticky-sum{position:sticky;top:calc(env(safe-area-inset-top,0px) + 64px);z-index:10;background:var(--bg);padding-block:8px;display:flex;flex-direction:column;gap:8px;border-bottom:1px solid var(--line)}
@media (min-width:900px){.sticky-sum{top:calc(env(safe-area-inset-top,0px) + 112px)}}
.tools{display:flex;gap:10px;flex-wrap:wrap}
.tools .searchbox{flex:1 1 200px}
.roster{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.row{background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--sc,var(--u));border-radius:var(--radius);padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.row .who{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.row .who > div{min-width:0}
.row .nm{font-weight:700;font-size:1.05rem}
.row .sub{color:var(--muted);font-size:.88rem}
.row .now{font-weight:700;font-size:.85rem;color:var(--sc);white-space:nowrap}
.marks{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.mk{min-height:50px;border-radius:9px;border:1.5px solid var(--line-strong);background:var(--surface);font-weight:700;font-size:.95rem;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:5px;padding:0 4px;color:var(--ink)}
.mk::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--mc);flex:none}
.mk[data-s="P"]{--mc:var(--p);--mbg:var(--p-bg)} .mk[data-s="L"]{--mc:var(--l);--mbg:var(--l-bg)} .mk[data-s="A"]{--mc:var(--a);--mbg:var(--a-bg)} .mk[data-s="E"]{--mc:var(--e);--mbg:var(--e-bg)}
.mk[aria-pressed="true"]{background:var(--mbg);border-color:var(--mc);color:var(--mc);box-shadow:inset 0 0 0 1.5px var(--mc)}
.mk[aria-pressed="true"]::before{content:"✓";width:auto;height:auto;background:none;font-size:1rem}
@media (max-width:380px){.mk{font-size:.86rem}}
.savebar{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -4px 16px rgba(0,0,0,.08);padding-block:10px calc(10px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.savebar-in{max-width:900px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.savebar .row2{display:flex;gap:10px}
.savebar .row2 .btn{flex:1}
.unm{font-weight:600;font-size:.95rem;text-align:center}
.unm.warn{color:var(--l)}
.unm.ok{color:var(--p)}

/* members */
.mlist{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.mlist li + li{border-top:1px solid var(--line)}
.mitem{display:flex;align-items:center;gap:12px;width:100%;min-height:60px;padding:10px 14px;background:none;border:0;text-align:left;cursor:pointer}
.mitem:hover{background:var(--accent-soft)}
.mitem .grow{flex:1;min-width:0}
.mitem .nm{font-weight:700}
.mitem .sub{color:var(--muted);font-size:.9rem}
.mitem .rt{font-variant-numeric:tabular-nums;font-weight:700;text-align:right;white-space:nowrap}
.mitem .rt small{display:block;font-weight:400;color:var(--muted);font-size:.78rem}
.tag{display:inline-block;padding:1px 8px;border-radius:6px;background:var(--u-bg);color:var(--u);font-size:.78rem;font-weight:700;letter-spacing:.03em;text-transform:uppercase;vertical-align:2px;margin-left:6px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{min-height:40px;padding:0 14px;border-radius:999px;border:1.5px solid var(--line-strong);background:var(--surface);font-weight:600;cursor:pointer;font-size:.93rem}
.seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

/* reports */
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(140px,100%),1fr));gap:12px}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.95rem}
th,td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-family:var(--f-display);font-weight:600;font-size:.85rem;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);background:var(--bg);position:sticky;top:0}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
.rate-big{font-family:var(--f-display);font-weight:700;font-size:3rem;line-height:1;color:var(--accent-text)}
.formula{font-size:.88rem;color:var(--muted)}

/* modal + toast */
.modal-wrap{position:fixed;inset:0;z-index:50;background:rgba(8,14,28,.55);display:flex;align-items:flex-end;justify-content:center}
.modal{background:var(--surface);color:var(--ink);width:100%;max-width:560px;max-height:92vh;display:flex;flex-direction:column;border-radius:16px 16px 0 0;padding-bottom:env(safe-area-inset-bottom,0px)}
@media (min-width:640px){.modal-wrap{align-items:center;padding:16px}.modal{border-radius:16px}}
.modal-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.modal-b{padding:16px;overflow:auto;display:flex;flex-direction:column;gap:14px}
.modal-f{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end;padding:12px 16px;border-top:1px solid var(--line)}
.modal-f .btn{flex:1 1 140px}
.modal-f .spacer{flex:1 1 100%;height:0}
.err{color:var(--a);background:var(--a-bg);border-radius:8px;padding:8px 12px;font-weight:600}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tabs-h) + env(safe-area-inset-bottom,0px) + 16px);z-index:60;background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:10px;font-weight:600;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
body.task-mode .toast{bottom:calc(150px + env(safe-area-inset-bottom,0px))}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.swatch{display:flex;align-items:center;gap:8px;min-height:44px;padding:0 14px 0 8px;border-radius:999px;border:1.5px solid var(--line-strong);background:var(--surface);cursor:pointer;font-weight:600}
.swatch i{width:26px;height:26px;border-radius:50%;background:var(--sw)}
.swatch[aria-pressed="true"]{border-color:var(--accent-text);box-shadow:inset 0 0 0 1.5px var(--accent-text)}
.grp-row{display:flex;gap:6px;align-items:center}
.grp-row .input{flex:1;min-width:0}
.grp-row .icon-btn{width:44px;height:48px}
.login{min-height:70vh;display:grid;place-items:center}
.login .card{width:100%;max-width:400px;display:flex;flex-direction:column;gap:16px}
@media (prefers-reduced-motion:no-preference){.toast{animation:pop .18s ease-out}@keyframes pop{from{opacity:0;transform:translate(-50%,8px)}}}
</style>

<div id="app">
  <div class="demo-banner" id="demoBanner" hidden>Single-device demo: records are saved in this browser only.</div>
  <header class="top">
    <div class="top-in">
      <div class="brand"><span class="eyebrow">Attendance</span><span class="org" id="orgName">The 5th Kajang Boys' Brigade Company</span></div>
      <button class="icon-btn hdr" id="btnSettings" type="button" aria-label="Settings and appearance">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      </button>
    </div>

<script id="bb-seed">
/* Sample data: realistic roster and ~10 weeks of parades, generated relative to "today" (YYYY-MM-DD, Malaysia time). */
function bbSeed(today){
  function addDays(iso,n){var d=new Date(iso+'T00:00:00Z');d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10);}
  function dow(iso){return new Date(iso+'T00:00:00Z').getUTCDay();}
  var a=51105; function rnd(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}
  var groups=[{id:'g-pj',name:'Pre-Junior',sort:1},{id:'g-jr',name:'Junior',sort:2},{id:'g-sr',name:'Senior',sort:3}];
  var people=[
    ['g-pj','Ethan Lim Jun Hao',''],['g-pj','Muhammad Aiman Hakimi',''],['g-pj','Lucas Tan Zhi Xuan',''],['g-pj','Arjun Nair',''],['g-pj','Daniel Wong Kai Le',''],['g-pj','Isaac Lee Yi Heng',''],['g-pj','Rayyan Danish bin Azman',''],['g-pj','Aaron Chong Wei Jie',''],['g-pj','Joshua Ng Yu Xiang','',-21],
    ['g-jr','Caleb Teoh Jia Le',''],['g-jr','Nathan Ooi Zhen Yu',''],['g-jr','Adam Haziq bin Rosli',''],['g-jr','Samuel Raj a/l Kumar',''],['g-jr','Timothy Khoo Wen Hao',''],['g-jr','Jayden Loh Kah Wai',''],['g-jr','Hareesh Kumar',''],['g-jr','Gabriel Yap Shi Hong',''],['g-jr','Ryan Goh Jun Wei',''],['g-jr','Benjamin Chan Ee Sheng',''],['g-jr','Jonathan Ho Zi Yang',''],['g-jr','Elijah Phang Kit Meng','',null,-40],
    ['g-sr','Andrew Tan Wei Ming','Staff Sergeant'],['g-sr','Matthew Lau Chee Keong','Sergeant'],['g-sr','Joel Fernandez','Corporal'],['g-sr','Darren Yeoh Jin Kai','Corporal'],['g-sr','Marcus Liew Zhi Hao','Lance Corporal'],['g-sr','Kevin Siow Jun Yi','Lance Corporal'],['g-sr','Brandon Choo Wai Lun','Private'],['g-sr','Aidan Thevan','Private'],['g-sr','Josiah Kong Yee Herng','Private'],['g-sr','Shawn Leong Kar Hou','Private'],['g-sr','Nicholas Foo Jia Hao','Private',null,-20]
  ];
  var members=people.map(function(p,i){
    return {id:'m-'+(i+1),name:p[1],groupId:p[0],rank:p[2],joinedOn:p[3]?addDays(today,p[3]):'2025-01-11',contact:'',archived:p[4]!=null,archivedOn:p[4]!=null?addDays(today,p[4]):null,rel:0.62+rnd()*0.33};
  });
  var sessions=[];
  var back=(dow(today)+1)%7; if(back===0) back=7;
  var lastSat=addDays(today,-back);
  for(var w=9;w>=0;w--){
    var d=addDays(lastSat,-7*w);
    if(w%2===0) sessions.push({id:'s-'+d+'-band',name:'Senior Band Practice',date:d,time:'10:00',groupId:'g-sr'});
    sessions.push({id:'s-'+d+'-parade',name:'Weekly Parade',date:d,time:'14:30',groupId:null});
  }
  sessions.push({id:'s-'+today+'-nco',name:'NCO Training',date:today,time:'19:00',groupId:'g-sr'});
  sessions.push({id:'s-'+today+'-drill',name:'Drill Practice',date:today,time:'20:15',groupId:'g-jr'});
  var staff=['Capt. Steven Lim','Lt. Grace Chin','Lt. Daniel Ong'];
  var records=[];
  sessions.forEach(function(s,si){
    if(s.id==='s-'+today+'-drill') return;
    s.createdAt=new Date(Date.parse(s.date+'T'+s.time+':00+08:00')-3600e3).toISOString();
    var by=staff[si%3];
    var stamp=new Date(Date.parse(s.date+'T'+s.time+':00+08:00')+25*60e3).toISOString();
    members.forEach(function(m){
      if(s.groupId&&m.groupId!==s.groupId) return;
      if(m.joinedOn>s.date) return;
      if(m.archivedOn&&m.archivedOn<=s.date) return;
      var r=rnd(),st;
      if(r<m.rel) st='P'; else if(r<m.rel+0.07) st='L'; else if(r<m.rel+0.13) st='E'; else st='A';
      if(rnd()<0.02) st='U';
      records.push({sessionId:s.id,memberId:m.id,status:st,updatedAt:stamp,updatedBy:by});
    });
  });
  sessions[sessions.length-1].createdAt=new Date().toISOString();
  members.forEach(function(m){delete m.rel;});
  return {orgName:"The 5th Kajang Boys' Brigade Company",groups:groups,members:members,sessions:sessions,records:records};
}
</script>

<script>
(function(){
'use strict';
/* ---------- constants & helpers ---------- */
var TZ='Asia/Kuala_Lumpur';
var FBCFG=window.BB_FIREBASE_CONFIG;
var MODE=window.BB_SERVER?'server':(FBCFG&&FBCFG.apiKey&&FBCFG.apiKey.indexOf('PASTE')<0&&window.firebase?'firebase':'demo');
var SERVER=MODE==='server';
var STATUS={P:'Present',L:'Late',A:'Absent',E:'Excused',U:'Unmarked'};
var MARKS=['P','L','A','E'];
var RANKS=['','Recruit','Private','Lance Corporal','Corporal','Sergeant','Staff Sergeant','Warrant Officer'];
var SESSION_NAMES=['Weekly Parade','Drill Practice','Band Practice','NCO Training','Bible Class','Camp','Service Project','Church Service'];
var DAYS=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
var DAYS_FULL=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
var $=function(s,r){return (r||document).querySelector(s);};
var $$=function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s));};
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function uid(){return Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-4);}
function klNow(d){
  var f=new Intl.DateTimeFormat('en-GB',{timeZone:TZ,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'});
  var o={}; f.formatToParts(d||new Date()).forEach(function(p){o[p.type]=p.value;});
  return {date:o.year+'-'+o.month+'-'+o.day,time:o.hour+':'+o.minute};
}
function fmtDate(iso){return iso?iso.slice(8,10)+'/'+iso.slice(5,7)+'/'+iso.slice(0,4):'';}
function dowOf(iso){return new Date(iso+'T00:00:00Z').getUTCDay();}
function fmtDay(iso){return DAYS[dowOf(iso)]+' '+fmtDate(iso);}
function fmtTime(t){if(!t)return'';var h=+t.slice(0,2),m=t.slice(3,5);return ((h%12)||12)+':'+m+(h<12?' am':' pm');}
function fmtStamp(ts){if(!ts)return'';var p=klNow(new Date(ts));return fmtDate(p.date)+' '+fmtTime(p.time);}
function addDays(iso,n){var d=new Date(iso+'T00:00:00Z');d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10);}
function rateOf(c){var d=c.P+c.L+c.A;return d?(c.P+c.L)/d*100:null;}
function fmtRate(v){return v==null?'—':(Math.round(v*10)/10).toFixed(1)+'%';}
function zero(){return {P:0,L:0,A:0,E:0,U:0};}
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,v);}catch(e){return null;}}

/* ---------- appearance (per-device) ---------- */
var hostTheme=document.documentElement.getAttribute('data-theme');
function applyAppearance(){
  var t=ls('bb-theme')||'system', a=ls('bb-accent')||'navy', root=document.documentElement;
  if(t==='system'){ if(hostTheme) root.setAttribute('data-theme',hostTheme); else root.removeAttribute('data-theme'); }
  else root.setAttribute('data-theme',t);
  if(a==='navy') root.removeAttribute('data-accent'); else root.setAttribute('data-accent',a);
}
applyAppearance();

/* ---------- local (demo) backend: mirrors the server API ---------- */
var LS_KEY='bb5kajang-attendance-demo-v1';
var Local={
  db:null, persisted:true,
  load:function(){
    var raw=ls(LS_KEY);
    if(raw){try{this.db=JSON.parse(raw);return;}catch(e){}}
    this.db=bbSeed(klNow().date); this.save();
  },
  save:function(){if(this.memory)return;try{localStorage.setItem(LS_KEY,JSON.stringify(this.db));this.persisted=true;}catch(e){this.persisted=false;}},
  reset:function(){ls(LS_KEY,null);this.db=null;this.load();},
  fail:function(msg,status){var e=new Error(msg);e.status=status||400;throw e;},
  handle:function(method,path,body){
    if(!this.db) this.load();
    var db=this.db, self=this, m, b=body||{};
    var who=this.who||'Demo staff', now=new Date().toISOString();
    function clean(s){return String(s||'').trim();}
    if(method==='GET'&&path==='state') return JSON.parse(JSON.stringify(Object.assign({},db,{user:{name:who}})));
    if(method==='PUT'&&path==='settings'){var n=clean(b.orgName);if(!n)self.fail('Enter an organisation name.');db.orgName=n.slice(0,120);self.save();return {ok:true};}
    if(method==='PUT'&&path==='groups'){
      var list=(b.groups||[]).map(function(g){return {id:g.id,name:clean(g.name)};});
      if(!list.length) self.fail('Keep at least one group.');
      var seen={}; list.forEach(function(g){if(!g.name)self.fail('Group names cannot be blank.');var k=g.name.toLowerCase();if(seen[k])self.fail('Two groups are both called "'+g.name+'".');seen[k]=1;});
      var keep={}; list.forEach(function(g){if(g.id)keep[g.id]=1;});
      db.groups.forEach(function(g){ if(!keep[g.id]){
        if(db.members.some(function(x){return x.groupId===g.id;})) self.fail('"'+g.name+'" still has members. Move them to another group first.');
        if(db.sessions.some(function(x){return x.groupId===g.id;})) self.fail('"'+g.name+'" is used by past sessions, so it cannot be removed. Rename it instead.');
      }});
      db.groups=list.map(function(g,i){return {id:g.id||('g-'+uid()),name:g.name.slice(0,60),sort:i+1};});
      self.save(); return {ok:true};
    }
    function memberFrom(src,old){
      var name=clean(src.name); if(!name) self.fail('Enter the member’s full name.');
      if(!db.groups.some(function(g){return g.id===src.groupId;})) self.fail('Choose a group.');
      return Object.assign(old||{id:'m-'+uid(),archived:false,archivedOn:null},{name:name.slice(0,120),groupId:src.groupId,rank:clean(src.rank).slice(0,40),joinedOn:src.joinedOn||klNow().date,contact:clean(src.contact).slice(0,200)});
    }
    if(method==='POST'&&path==='members'){var nm=memberFrom(b);db.members.push(nm);self.save();return nm;}
    if((m=path.match(/^members\/([\w-]+)$/))&&method==='PUT'){
      var mem=db.members.find(function(x){return x.id===m[1];}); if(!mem) self.fail('Member not found.',404);
      if('archived' in b && Object.keys(b).length===1){mem.archived=!!b.archived;mem.archivedOn=b.archived?klNow().date:null;}
      else memberFrom(b,mem);
      self.save(); return mem;
    }
    function sessionFrom(src,old){
      var name=clean(src.name); if(!name) self.fail('Enter a session name.');
      if(!/^\d{4}-\d{2}-\d{2}$/.test(src.date||'')) self.fail('Choose a date.');
      if(!/^\d{2}:\d{2}$/.test(src.time||'')) self.fail('Choose a time.');
      var gid=src.groupId||null; if(gid&&!db.groups.some(function(g){return g.id===gid;})) self.fail('Choose a group.');
      var dup=db.sessions.find(function(x){return x.date===src.date&&x.time===src.time&&x.name.toLowerCase()===name.toLowerCase()&&(x.groupId||null)===gid&&(!old||x.id!==old.id);});
      if(dup) self.fail('That session already exists at the same date and time.');
      return Object.assign(old||{id:'s-'+uid(),createdAt:now},{name:name.slice(0,80),date:src.date,time:src.time,groupId:gid});
    }
    if(method==='POST'&&path==='sessions'){var ns=sessionFrom(b);db.sessions.push(ns);self.save();return ns;}
    if((m=path.match(/^sessions\/([\w-]+)$/))){
      var si=db.sessions.findIndex(function(x){return x.id===m[1];}); if(si<0) self.fail('Session not found.',404);
      if(method==='PUT'){sessionFrom(b,db.sessions[si]);self.save();return db.sessions[si];}
      if(method==='DELETE'){var sid=db.sessions[si].id;db.sessions.splice(si,1);db.records=db.records.filter(function(r){return r.sessionId!==sid;});self.save();return {ok:true};}
    }
    if((m=path.match(/^sessions\/([\w-]+)\/records$/))&&method==='PUT'){
      var sess=db.sessions.find(function(x){return x.id===m[1];}); if(!sess) self.fail('Session not found.',404);
      var count=0;
      (b.records||[]).forEach(function(r){
        if(!STATUS[r.status]) self.fail('Unknown status.');
        if(!db.members.some(function(x){return x.id===r.memberId;})) self.fail('Unknown member.');
        var ex=db.records.find(function(x){return x.sessionId===sess.id&&x.memberId===r.memberId;});
        if(ex){ if(ex.status!==r.status){ex.status=r.status;ex.updatedAt=now;ex.updatedBy=who;count++;} }
        else {db.records.push({sessionId:sess.id,memberId:r.memberId,status:r.status,updatedAt:now,updatedBy:who});count++;}
      });
      self.save(); return {saved:count};
    }
    self.fail('Not found',404);
  }
};

/* ---------- Firebase backend (free Spark plan): Google sign-in + Firestore ----------
   Firestore layout: config/org {orgName}, config/staff {emails:[...]} (edited in the Firebase console only),
   groups/{id}, members/{id}, sessions/{id} with records:{memberId:{status,updatedAt,updatedBy}}.
   Each change runs through the same validation as the demo, then only the changed documents are written. */
var FB={
  auth:null, fs:null,
  init:function(){firebase.initializeApp(FBCFG);this.auth=firebase.auth();this.fs=firebase.firestore();},
  currentUser:function(){var a=this.auth;return new Promise(function(res){var un=a.onAuthStateChanged(function(u){un();res(u);});});},
  signIn:function(){
    var p=new firebase.auth.GoogleAuthProvider(), a=this.auth;
    if(p.setCustomParameters) p.setCustomParameters({prompt:'select_account'});
    return a.signInWithPopup(p).catch(function(e){
      if(e&&(e.code==='auth/popup-blocked'||e.code==='auth/operation-not-supported-in-this-environment')) return a.signInWithRedirect(p);
      throw e;});
  },
  err:function(e){
    var m=e&&e.code==='permission-denied'?'Your Google account is not on the staff list. Ask the company captain to add your email.':(e&&e.message)||String(e);
    var x=new Error(m);x.code=e&&e.code;return x;
  },
  load:function(){
    var fs=this.fs, self=this;
    return Promise.all([fs.doc('config/org').get(),fs.collection('groups').get(),fs.collection('members').get(),fs.collection('sessions').get()]).then(function(r){
      var db={orgName:(r[0].exists&&r[0].data().orgName)||"The 5th Kajang Boys' Brigade Company",groups:[],members:[],sessions:[],records:[],_fresh:!r[0].exists&&!r[1].docs.length};
      r[1].docs.forEach(function(d){db.groups.push(Object.assign({sort:0},d.data(),{id:d.id}));});
      r[2].docs.forEach(function(d){db.members.push(Object.assign({rank:'',contact:'',archived:false,archivedOn:null},d.data(),{id:d.id}));});
      r[3].docs.forEach(function(d){
        var x=d.data(), recs=x.records||{}; delete x.records; x.id=d.id; x.groupId=x.groupId||null; db.sessions.push(x);
        Object.keys(recs).forEach(function(mid){var v=recs[mid]||{};db.records.push({sessionId:d.id,memberId:mid,status:v.status||'U',updatedAt:v.updatedAt||'',updatedBy:v.updatedBy||''});});
      });
      return db;
    },function(e){throw self.err(e);});
  },
  firstRun:function(){
    var fs=this.fs, b=fs.batch();
    b.set(fs.doc('config/org'),{orgName:"The 5th Kajang Boys' Brigade Company"});
    ['Pre-Junior','Junior','Senior'].forEach(function(n,i){b.set(fs.doc('groups/g-'+uid()),{name:n,sort:i+1});});
    var self=this; return b.commit().catch(function(e){throw self.err(e);});
  },
  reload:function(){return this.load().then(function(db){delete db._fresh;Local.db=db;});},
  snap:function(db){
    var m=new Map();
    m.set('config/org',JSON.stringify({orgName:db.orgName}));
    db.groups.forEach(function(g){m.set('groups/'+g.id,JSON.stringify(g));});
    db.members.forEach(function(x){m.set('members/'+x.id,JSON.stringify(x));});
    db.sessions.forEach(function(x){m.set('sessions/'+x.id,JSON.stringify(x));});
    db.records.forEach(function(r){m.set('rec/'+r.sessionId+'/'+r.memberId,JSON.stringify({status:r.status,updatedAt:r.updatedAt,updatedBy:r.updatedBy}));});
    return m;
  },
  handle:function(method,path,body){
    if(method==='GET'){try{return Promise.resolve(Local.handle(method,path,body));}catch(e){return Promise.reject(e);}}
    var before=this.snap(Local.db), res;
    try{res=Local.handle(method,path,body);}catch(e){return Promise.reject(e);}
    var after=this.snap(Local.db), fs=this.fs, b=fs.batch(), n=0, self=this;
    after.forEach(function(v,k){
      if(before.get(k)===v) return; n++;
      var p=k.split('/'), data=JSON.parse(v);
      if(p[0]==='rec'){var o={};o[p[2]]=data;b.set(fs.doc('sessions/'+p[1]),{records:o},{merge:true});}
      else if(p[0]==='sessions') b.set(fs.doc(k),data,{merge:true});
      else b.set(fs.doc(k),data);
    });
    before.forEach(function(v,k){if(after.has(k)||k.indexOf('rec/')===0)return;n++;b.delete(fs.doc(k));});
    if(!n) return Promise.resolve(res);
    return b.commit().then(function(){return res;},function(e){
      var err=self.err(e); return self.reload().then(function(){throw err;},function(){throw err;});
    });
  }
};

function api(method,path,body){
  if(MODE==='firebase') return FB.handle(method,path,body);
  if(MODE==='demo'){ try{ return Promise.resolve(Local.handle(method,path,body)); }catch(e){ return Promise.reject(e); } }
  return fetch('api/'+path,{method:method,credentials:'same-origin',headers:{'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined})
    .then(function(r){return r.json().catch(function(){return {};}).then(function(j){
      if(!r.ok){var e=new Error(j.error||('Request failed ('+r.status+')'));e.status=r.status;throw e;}
      return j;});});
}

/* ---------- state & derived indexes ---------- */
var S=null, G=new Map(), M=new Map(), R=new Map(), T=null;
function index(){
  S.groups.sort(function(a,b){return a.sort-b.sort;});
  S.sessions.sort(function(a,b){return (b.date+b.time).localeCompare(a.date+a.time);});
  G=new Map(S.groups.map(function(g){return [g.id,g];}));
  M=new Map(S.members.map(function(m){return [m.id,m];}));
  R=new Map();
  S.records.forEach(function(r){var x=R.get(r.sessionId);if(!x)R.set(r.sessionId,x=new Map());x.set(r.memberId,r);});
  $('#orgName').textContent=S.orgName;
}
function gname(id){return id?(G.get(id)||{name:'(removed group)'}).name:'All groups';}
function gsort(id){var g=G.get(id);return g?g.sort:999;}
function byMember(a,b){return gsort(a.groupId)-gsort(b.groupId)||a.name.localeCompare(b.name);}
function roster(s){
  var recs=R.get(s.id)||new Map(), ids=new Set(recs.keys());
  S.members.forEach(function(m){
    if(m.archived) return; if(s.groupId&&m.groupId!==s.groupId) return; if(m.joinedOn&&m.joinedOn>s.date) return;
    ids.add(m.id);
  });
  return Array.from(ids).map(function(id){return M.get(id);}).filter(Boolean).sort(byMember);
}
function statusOf(s,mid){var r=(R.get(s.id)||new Map()).get(mid);return r?r.status:'U';}
function countsOf(s){var c=zero();roster(s).forEach(function(m){c[statusOf(s,m.id)]++;});return c;}
function refresh(){return api('GET','state').then(function(st){S=st;index();});}

/* ---------- UI bits ---------- */
var view=$('#view');
function toast(msg){var t=document.createElement('div');t.className='toast';t.setAttribute('role','status');t.textContent=msg;document.body.appendChild(t);setTimeout(function(){t.remove();},2600);}
function chipsHTML(c,showZero){return '<div class="chips">'+['P','L','A','E','U'].filter(function(k){return showZero||c[k];}).map(function(k){return '<span class="chip c-'+k+'">'+STATUS[k]+' <b class="num">'+c[k]+'</b></span>';}).join('')+'</div>';}
function barHTML(c){var t=c.P+c.L+c.A+c.E+c.U;if(!t)return '';return '<div class="bar" aria-hidden="true">'+['P','L','A','E'].map(function(k){return c[k]?'<i class="b-'+k+'" style="width:'+(c[k]/t*100)+'%"></i>':'';}).join('')+'</div>';}
function tilesHTML(c,withRate){
  return '<div class="tiles">'+(withRate?'<div class="tile rate"><span class="k">Attendance rate</span><span class="v">'+fmtRate(rateOf(c))+'</span></div>':'')+

function openModal(o){
  return new Promise(function(resolve){
    var wrap=document.createElement('div'); wrap.className='modal-wrap';
    wrap.innerHTML='<div class="modal" role="dialog" aria-modal="true" aria-labelledby="mdl-t"><div class="modal-h"><h2 id="mdl-t">'+esc(o.title)+'</h2><button type="button" class="icon-btn" data-m="__close" aria-label="Close">'+ICON.x+'</button></div><div class="modal-b">'+o.html+'<div class="err" data-err hidden></div></div><div class="modal-f">'+
      (o.actions||[]).map(function(a){return a.spacer?'<span class="spacer"></span>':'<button type="button" class="btn '+(a.kind||'')+'" data-m="'+a.value+'">'+esc(a.label)+'</button>';}).join('')+'</div></div>';
    document.body.appendChild(wrap); document.body.classList.add('modal-open');
    var prev=document.activeElement;
    function close(v){wrap.remove();document.body.classList.remove('modal-open');document.removeEventListener('keydown',kd);if(prev&&prev.focus)try{prev.focus({preventScroll:true});}catch(e){}resolve(v);}
    function kd(e){if(e.key==='Escape')close(null);}
    document.addEventListener('keydown',kd);
    wrap.addEventListener('click',function(e){
      if(e.target===wrap) return close(null);
      if(o.onClick) o.onClick(e,wrap);
      var b=e.target.closest('[data-m]'); if(!b) return;
      var v=b.dataset.m; if(v==='__close') return close(null);
      if(!o.onAction) return close(v);
      var err=$('[data-err]',wrap); err.hidden=true; b.disabled=true;
      Promise.resolve().then(function(){return o.onAction(v,wrap);}).then(function(res){
        b.disabled=false; if(res===false) return; close(res===undefined?v:res);
      },function(ex){b.disabled=false;err.textContent=ex.message||String(ex);err.hidden=false;});
    });
    var form=$('form',wrap); if(form) form.addEventListener('submit',function(e){e.preventDefault();var p=$('.modal-f .btn.primary',wrap);if(p)p.click();});
    if(o.onOpen) o.onOpen(wrap);
    setTimeout(function(){var f=$('.modal-b input:not([type=hidden]),.modal-b select,.modal-f .btn.primary',wrap);if(f)f.focus();},40);
  });
}
function confirmBox(title,html,okLabel,kind){
  return openModal({title:title,html:html,actions:[{label:'Cancel',value:'no'},{label:okLabel,value:'yes',kind:kind||'primary'}]}).then(function(v){return v==='yes';});
}
function groupOptions(sel,withAll){
  return (withAll?'<option value="">'+esc(withAll)+'</option>':'')+S.groups.map(function(g){return '<option value="'+esc(g.id)+'"'+(g.id===sel?' selected':'')+'>'+esc(g.name)+'</option>';}).join('');
}
function dateHint(iso){return iso?DAYS_FULL[dowOf(iso)]+', '+fmtDate(iso):'';}
function wireDateHints(root){
  $$('input[type=date][data-hint]',root).forEach(function(inp){
    var out=$('#'+inp.dataset.hint,root)||document.getElementById(inp.dataset.hint);
    function upd(){if(out)out.textContent=dateHint(inp.value);} inp.addEventListener('input',upd); upd();
  });
}

/* ---------- routing ---------- */
var currentHash='', ignoreHash=false;
function route(){
  var h=(location.hash||'#dashboard').slice(1)||'dashboard';
  currentHash='#'+h;
  var tab=h.indexOf('take-')===0?'attendance':h;
  $$('#tabs a').forEach(function(a){if(a.dataset.tab===tab)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current');});
  document.body.classList.toggle('task-mode',h.indexOf('take-')===0);
  render();
  window.scrollTo(0,0);
}
function render(){
  var h=currentHash.slice(1);
  if(h.indexOf('take-')===0) return viewTake(h.slice(5));
  if(h==='attendance') return viewAttendance();
  if(h==='members') return viewMembers();
  if(h==='reports') return viewReports();
  return viewDashboard();
}
window.addEventListener('hashchange',function(){
  if(ignoreHash){ignoreHash=false;return;}
  if(T&&T.dirty){
    var target=location.hash;
    ignoreHash=true; location.hash=currentHash;
    confirmBox('Discard unsaved marks?','<p>You have attendance marks that are not saved yet. Leave this session and lose them?</p>','Discard changes','danger').then(function(ok){
      if(ok){T=null;location.hash=target;}
    });
    return;
  }
  T=null; route();
});
window.addEventListener('beforeunload',function(e){if(T&&T.dirty){e.preventDefault();e.returnValue='';}});

/* ---------- Dashboard ---------- */
function viewDashboard(){
  var today=klNow().date;
  var todays=S.sessions.filter(function(s){return s.date===today;}).sort(function(a,b){return a.time.localeCompare(b.time);});
  var tot=zero(); todays.forEach(function(s){var c=countsOf(s);for(var k in tot)tot[k]+=c[k];});
  var recent=S.sessions.filter(function(s){return s.date<today;}).slice(0,4);
  var ctaHref=todays.length===1?'#take-'+todays[0].id:'#attendance';
  var ctaSub=todays.length===1?esc(todays[0].name)+' · '+fmtTime(todays[0].time):(todays.length?todays.length+' sessions today, choose one':'Start a new session for today');
  view.innerHTML=
    '<div class="page-head"><div><p class="eyebrow">Today · Malaysia time</p><h1>'+DAYS_FULL[dowOf(today)]+', '+fmtDate(today)+'</h1></div></div>'+
    '<div class="section"><a class="btn primary take-cta" href="'+ctaHref+'" id="takeCta">'+ICON.check+'Take Attendance</a><p class="muted small" style="text-align:center">'+ctaSub+'</p></div>'+
    '<section class="section"><div class="section-h"><h2>Today’s attendance</h2>'+(todays.length?'<span class="muted small">'+todays.length+' session'+(todays.length>1?'s':'')+' combined</span>':'')+'</div>'+
      (todays.length?tilesHTML(tot,true):'<div class="empty"><p>No parade or session has been created for today.</p></div>')+'</section>'+
    (todays.length?'<section class="section"><h2>Today’s sessions</h2><ul class="sess-list">'+todays.map(sessCard).join('')+'</ul></section>':'')+
    '<section class="section"><div class="section-h"><h2>Recent sessions</h2><a href="#attendance" class="small">All sessions ›</a></div>'+
      (recent.length?'<ul class="sess-list">'+recent.map(sessCard).join('')+'</ul>':'<div class="empty">No past sessions yet.</div>')+'</section>';
}

    '<datalist id="'+prefix+'Names">'+SESSION_NAMES.map(function(n){return '<option value="'+esc(n)+'">';}).join('')+'</datalist></label>'+
    '<div class="grid2"><label class="field"><span>Date</span><input class="input" type="date" id="'+prefix+'Date" value="'+esc(s.date||now.date)+'" data-hint="'+prefix+'DateHint" required><small id="'+prefix+'DateHint"></small></label>'+

function readSessionForm(root,prefix){return {name:$('#'+prefix+'Name',root).value,date:$('#'+prefix+'Date',root).value,time:$('#'+prefix+'Time',root).value,groupId:$('#'+prefix+'Group',root).value||null};}
function viewAttendance(){

  var shown=list.slice(0,sessLimit), html='', last='';
  shown.forEach(function(s){ if(s.date!==last){ if(last) html+='</ul>'; html+='<h3 class="date-h">'+DAYS_FULL[dowOf(s.date)]+', '+fmtDate(s.date)+'</h3><ul class="sess-list">'; last=s.date; } html+=sessCard(s); });

    '<div class="page-head"><div><p class="eyebrow">Sessions</p><h1>Attendance</h1></div></div>'+
    '<section class="card section" id="newSession"><h2>Start a session</h2><form id="sessForm">'+sessionFormHTML(null,'ns')+
      '<div class="err" id="nsErr" hidden></div><button class="btn primary block" type="submit" style="margin-top:14px">'+ICON.check+'Create and take attendance</button></form></section>'+
    '<section class="section"><div class="section-h"><h2>All sessions</h2><label class="field" style="flex:0 1 220px"><select class="input" id="sessFilter" aria-label="Filter sessions by group"><option value="">Every group</option><option value="all"'+(sessGroupFilter==='all'?' selected':'')+'>All-group sessions only</option>'+groupOptions(sessGroupFilter)+'</select></label></div>'+
      (html||'<div class="empty">No sessions yet. Create one above.</div>')+
      (list.length>sessLimit?'<button class="btn block" id="moreSess">Show more sessions ('+(list.length-sessLimit)+' older)</button>':'')+'</section>';

  $('#sessForm').addEventListener('submit',function(e){

/* ---------- Take attendance ---------- */
function viewTake(id){
  var s=S.sessions.find(function(x){return x.id===id;});
  if(!s){view.innerHTML='<a class="back" href="#attendance">‹ Attendance</a><div class="empty">This session was not found. It may have been deleted.</div>';return;}
  var ros=roster(s);
  if(!T||T.id!==id){
    var orig=new Map(); ros.forEach(function(m){orig.set(m.id,statusOf(s,m.id));});
    T={id:id,orig:orig,marks:new Map(orig),dirty:false,hasRec:new Set((R.get(id)||new Map()).keys()),q:''};
  }
  var recs=Array.from((R.get(id)||new Map()).values());
  var lastRec=recs.sort(function(a,b){return b.updatedAt.localeCompare(a.updatedAt);})[0];
  view.innerHTML=
    '<div class="take-head"><a class="back" href="#attendance">‹ Attendance</a>'+
      '<div class="page-head"><div><p class="eyebrow">'+esc(gname(s.groupId))+' · '+ros.length+' members</p><h1>'+esc(s.name)+'</h1><p class="muted">'+DAYS_FULL[dowOf(s.date)]+', '+fmtDate(s.date)+' · '+fmtTime(s.time)+'</p></div>'+
      '<button class="btn" id="editSess" type="button">Edit details</button></div>'+
      (lastRec?'<p class="small muted">Last saved '+fmtStamp(lastRec.updatedAt)+(lastRec.updatedBy?' by '+esc(lastRec.updatedBy):'')+'. Tap a different status to correct a record, then save.</p>':'<p class="small muted">Not saved yet. Everyone starts as Unmarked.</p>')+
    '</div>'+
    '<div class="sticky-sum"><div id="takeChips"></div><div class="tools"><div class="searchbox">'+ICON.search+'<input class="input" id="takeSearch" type="search" placeholder="Find a member" aria-label="Find a member" value="'+esc(T.q)+'"></div>'+
      '<button class="btn" id="markRest" type="button">Mark Remaining as Present</button></div></div>'+
    (ros.length?'<ul class="roster" id="roster">'+ros.map(function(m){return rowHTML(m);}).join('')+'</ul>':'<div class="empty">No active members in '+esc(gname(s.groupId))+'. Add members first.</div>')+
    '<div class="savebar"><div class="savebar-in"><div class="unm" id="unmarkedNote"></div><div class="row2"><a class="btn" href="#attendance">Back</a><button class="btn primary" id="saveTake" type="button">Save attendance</button></div></div></div>';
  updateTakeSummary(); applyTakeSearch();
  $('#roster')&&$('#roster').addEventListener('click',function(e){
    var b=e.target.closest('.mk'); if(!b) return;
    var mid=b.closest('.row').dataset.id, st=b.dataset.s, cur=T.marks.get(mid)||'U';
    T.marks.set(mid,cur===st?'U':st); updateRow(mid); updateTakeSummary();
  });
  $('#takeSearch').addEventListener('input',function(e){T.q=e.target.value;applyTakeSearch();});
  $('#markRest').addEventListener('click',function(){
    var n=0; roster(s).forEach(function(m){if((T.marks.get(m.id)||'U')==='U'){T.marks.set(m.id,'P');updateRow(m.id);n++;}});
    updateTakeSummary(); toast(n?'Marked '+n+' remaining as Present':'Everyone is already marked');
  });
  $('#saveTake').addEventListener('click',function(){saveTake(s);});
  $('#editSess').addEventListener('click',function(){editSession(s);});
}
function rowHTML(m){
  var st=T.marks.get(m.id)||'U';
  return '<li class="row s-'+st+'" data-id="'+esc(m.id)+'" data-name="'+esc(m.name.toLowerCase())+'"><div class="who"><div><div class="nm">'+esc(m.name)+(m.archived?'<span class="tag">Archived</span>':'')+'</div><div class="sub">'+esc([m.rank,gname(m.groupId)].filter(Boolean).join(' · '))+'</div></div><span class="now">'+STATUS[st]+'</span></div>'+
    '<div class="marks" role="group" aria-label="Status for '+esc(m.name)+'">'+MARKS.map(function(k){return '<button type="button" class="mk" data-s="'+k+'" aria-pressed="'+(st===k)+'">'+STATUS[k]+'</button>';}).join('')+'</div></li>';
}
function updateRow(mid){
  var li=$('.row[data-id="'+mid+'"]'); if(!li) return; var st=T.marks.get(mid)||'U';
  li.className='row s-'+st; $('.now',li).textContent=STATUS[st];
  $$('.mk',li).forEach(function(b){b.setAttribute('aria-pressed',String(b.dataset.s===st));});
}
function updateTakeSummary(){
  var s=S.sessions.find(function(x){return x.id===T.id;}), ros=roster(s), c=zero(), dirty=false, missing=false;
  ros.forEach(function(m){var st=T.marks.get(m.id)||'U';c[st]++;if(st!==(T.orig.get(m.id)||'U'))dirty=true;if(!T.hasRec.has(m.id))missing=true;});
  T.dirty=dirty;
  $('#takeChips').innerHTML=chipsHTML(c,true);
  var n=$('#unmarkedNote');
  n.className='unm '+(c.U?'warn':'ok');
  n.textContent=c.U?(c.U+' of '+ros.length+' still unmarked'):('All '+ros.length+' members marked');
  var b=$('#saveTake'); b.disabled=!(dirty||(missing&&ros.length)); b.textContent=b.disabled?'Saved':'Save attendance';
  $('#markRest').disabled=!c.U;
}
function applyTakeSearch(){var q=(T.q||'').trim().toLowerCase();$$('#roster .row').forEach(function(li){li.hidden=!!q&&li.dataset.name.indexOf(q)<0;});}
function saveTake(s){
  var ros=roster(s), unmarked=ros.filter(function(m){return (T.marks.get(m.id)||'U')==='U';}).length;
  var go=unmarked?openModal({title:'Some members are still unmarked',html:'<p><strong>'+unmarked+'</strong> '+(unmarked===1?'member is':'members are')+' still unmarked. They will be saved as Unmarked and left out of the attendance rate. You can come back and mark them later.</p>',actions:[{label:'Keep marking',value:'no'},{label:'Save anyway',value:'yes',kind:'primary'}]}).then(function(v){return v==='yes';}):Promise.resolve(true);
  go.then(function(ok){
    if(!ok) return;
    var changes=ros.filter(function(m){return !T.hasRec.has(m.id)||(T.marks.get(m.id)||'U')!==(T.orig.get(m.id)||'U');}).map(function(m){return {memberId:m.id,status:T.marks.get(m.id)||'U'};});
    var btn=$('#saveTake'); btn.disabled=true; btn.textContent='Saving…';
    return api('PUT','sessions/'+s.id+'/records',{records:changes}).then(function(){
      T=null; return refresh();
    }).then(function(){render();toast('Attendance saved');}).catch(function(ex){btn.disabled=false;btn.textContent='Save attendance';toast(ex.message);});
  });
}
function editSession(s){
  var hasRecs=(R.get(s.id)||new Map()).size>0;
  openModal({title:'Edit session',html:'<form>'+sessionFormHTML(s,'es')+'</form>'+(hasRecs?'<p class="small muted">Changing the group keeps everyone already recorded in this session.</p>':''),
    actions:[{label:'Delete session',value:'del',kind:'danger'},{label:'Cancel',value:'cancel'},{label:'Save details',value:'save',kind:'primary'}],
    onOpen:wireDateHints,
    onAction:function(v,root){
      if(v==='cancel') return;
      if(v==='save') return api('PUT','sessions/'+s.id,readSessionForm(root,'es')).then(function(){return refresh();}).then(function(){render();toast('Session updated');});
      if(v==='del') return confirmBox('Delete this session?','<p>This deletes <strong>'+esc(s.name)+'</strong> on '+fmtDate(s.date)+' and its '+(R.get(s.id)||new Map()).size+' attendance records. This cannot be undone.</p>','Delete session','danger').then(function(ok){
        if(!ok) return false;
        return api('DELETE','sessions/'+s.id).then(function(){T=null;return refresh();}).then(function(){location.hash='#attendance';toast('Session deleted');});
      });
    }});
}

/* ---------- Members ---------- */
var memQ='', memGroup='', memArchived=false;
var statsCache=null;
function memberStats(){
  if(statsCache&&statsCache.S===S) return statsCache.map;
  var map=new Map();
  S.sessions.forEach(function(s){roster(s).forEach(function(m){var c=map.get(m.id);if(!c)map.set(m.id,c=zero());c[statusOf(s,m.id)]++;});});
  statsCache={S:S,map:map}; return map;
}
function viewMembers(){
  var active=S.members.filter(function(m){return !m.archived;}), archived=S.members.length-active.length;
  view.innerHTML=
    '<div class="page-head"><div><p class="eyebrow">'+active.length+' active · '+archived+' archived</p><h1>Members</h1></div>'+
      '<div class="tools"><button class="btn" id="manageGroups" type="button">Manage groups</button><button class="btn primary" id="addMember" type="button">'+ICON.plus+'Add member</button></div></div>'+
    '<div class="section"><div class="searchbox">'+ICON.search+'<input class="input" type="search" id="memSearch" placeholder="Search by name or rank" aria-label="Search members" value="'+esc(memQ)+'"></div>'+
      '<div class="seg" id="memSeg" role="group" aria-label="Filter by group"><button type="button" data-g="" aria-pressed="'+(!memGroup&&!memArchived)+'">All active</button>'+
      S.groups.map(function(g){var n=active.filter(function(m){return m.groupId===g.id;}).length;return '<button type="button" data-g="'+esc(g.id)+'" aria-pressed="'+(memGroup===g.id&&!memArchived)+'">'+esc(g.name)+' <span class="num">'+n+'</span></button>';}).join('')+
      '<button type="button" data-g="__arch" aria-pressed="'+memArchived+'">Archived <span class="num">'+archived+'</span></button></div></div>'+
    '<div id="memList"></div>';
  drawMemberList();
  $('#memSearch').addEventListener('input',function(e){memQ=e.target.value;drawMemberList();});
  $('#memSeg').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;var g=b.dataset.g;memArchived=g==='__arch';memGroup=memArchived?'':g;viewMembers();});
  $('#addMember').addEventListener('click',function(){editMember(null);});
  $('#manageGroups').addEventListener('click',manageGroups);
  $('#memList').addEventListener('click',function(e){var b=e.target.closest('[data-mid]');if(b)editMember(M.get(b.dataset.mid));});
}
function drawMemberList(){
  var q=memQ.trim().toLowerCase(), stats=memberStats();
  var list=S.members.filter(function(m){
    if(memArchived!==!!m.archived) return false;
    if(memGroup&&m.groupId!==memGroup) return false;
    return !q||m.name.toLowerCase().indexOf(q)>=0||(m.rank||'').toLowerCase().indexOf(q)>=0;
  }).sort(byMember);
  if(!list.length){$('#memList').innerHTML='<div class="empty">'+(q?'No members match “'+esc(memQ)+'”.':memArchived?'No archived members.':'No members in this group yet.')+'</div>';return;}
  var html='', cur=null;
  list.forEach(function(m){
    if(m.groupId!==cur){ if(cur!==null) html+='</ul>'; cur=m.groupId; html+='<h3 class="date-h">'+esc(gname(m.groupId))+'</h3><ul class="mlist">'; }
    var c=stats.get(m.id)||zero(), r=rateOf(c);
    html+='<li><button type="button" class="mitem" data-mid="'+esc(m.id)+'"><span class="grow"><span class="nm">'+esc(m.name)+'</span>'+(m.archived?'<span class="tag">Archived '+fmtDate(m.archivedOn)+'</span>':'')+'<br><span class="sub">'+esc(m.rank||'No rank')+' · joined '+fmtDate(m.joinedOn)+'</span></span><span class="rt">'+fmtRate(r)+'<small>attendance</small></span></button></li>';
  });
  $('#memList').innerHTML=html+'</ul>';
}
function editMember(m){
  var isNew=!m; m=m||{groupId:memGroup||(S.groups[0]&&S.groups[0].id),joinedOn:klNow().date,rank:''};
  var stats=memberStats().get(m.id)||zero();
  var actions=isNew?[{label:'Cancel',value:'cancel'},{label:'Add member',value:'save',kind:'primary'}]:
    [{label:m.archived?'Restore member':'Archive member',value:'arch',kind:m.archived?'':'danger'},{label:'Cancel',value:'cancel'},{label:'Save changes',value:'save',kind:'primary'}];
  openModal({title:isNew?'Add member':'Edit member',
    html:'<form class="form"><label class="field"><span>Full name</span><input class="input" id="mfName" value="'+esc(m.name||'')+'" maxlength="120" autocomplete="off" required></label>'+
      '<div class="grid2"><label class="field"><span>Group</span><select class="input" id="mfGroup">'+groupOptions(m.groupId)+'</select></label>'+
      '<label class="field"><span>Rank</span><select class="input" id="mfRank">'+RANKS.map(function(r){return '<option value="'+esc(r)+'"'+(r===(m.rank||'')?' selected':'')+'>'+(r||'No rank')+'</option>';}).join('')+(m.rank&&RANKS.indexOf(m.rank)<0?'<option selected>'+esc(m.rank)+'</option>':'')+'</select></label></div>'+
      '<label class="field"><span>Joined on</span><input class="input" type="date" id="mfJoined" value="'+esc(m.joinedOn||'')+'" data-hint="mfJoinedHint"><small id="mfJoinedHint"></small></label>'+
      '<label class="field"><span>Parent or guardian contact <small>(optional)</small></span><input class="input" id="mfContact" value="'+esc(m.contact||'')+'" maxlength="200" inputmode="tel"></label></form>'+
      (isNew?'':'<div><p class="eyebrow" style="margin-bottom:6px">Attendance record</p>'+chipsHTML(stats,true)+'<p class="small muted" style="margin-top:6px">Rate '+fmtRate(rateOf(stats))+'. '+(m.archived?'Archived members keep all their past records.':'Archiving hides the member from new sessions but keeps every past record.')+'</p></div>'),
    actions:actions, onOpen:wireDateHints,
    onAction:function(v,root){
      if(v==='cancel') return;
      if(v==='arch') return api('PUT','members/'+m.id,{archived:!m.archived}).then(refresh).then(function(){render();toast(m.archived?'Member restored':'Member archived. Past records kept.');});
      var body={name:$('#mfName',root).value,groupId:$('#mfGroup',root).value,rank:$('#mfRank',root).value,joinedOn:$('#mfJoined',root).value,contact:$('#mfContact',root).value};
      return api(isNew?'POST':'PUT',isNew?'members':'members/'+m.id,body).then(refresh).then(function(){render();toast(isNew?'Member added':'Changes saved');});
    }});
}
function manageGroups(){
  var rows=S.groups.map(function(g){return {id:g.id,name:g.name};});
  function used(id){return S.members.some(function(m){return m.groupId===id;})||S.sessions.some(function(s){return s.groupId===id;});}
  function draw(root){
    $('#grpRows',root).innerHTML=rows.map(function(g,i){
      return '<div class="grp-row" data-i="'+i+'"><input class="input" value="'+esc(g.name)+'" aria-label="Group name" maxlength="60" data-name>'+
        '<button type="button" class="icon-btn" data-g="up" aria-label="Move up"'+(i?'':' disabled')+'>'+ICON.up+'</button>'+
        '<button type="button" class="icon-btn" data-g="down" aria-label="Move down"'+(i<rows.length-1?'':' disabled')+'>'+ICON.down+'</button>'+
        '<button type="button" class="icon-btn" data-g="del" aria-label="Remove group" title="'+(g.id&&used(g.id)?'In use: move members out first':'Remove')+'">'+ICON.x+'</button></div>';
    }).join('');
  }
  function sync(root){$$('.grp-row',root).forEach(function(r){rows[+r.dataset.i].name=$('[data-name]',r).value;});}
  openModal({title:'Manage groups',
    html:'<p class="small muted">Rename, reorder, add or remove groups. A group with members or past sessions cannot be removed.</p><div id="grpRows" class="form" style="gap:8px"></div><div class="grp-row"><input class="input" id="grpNew" placeholder="New group name, e.g. Primers" maxlength="60"><button type="button" class="btn" data-g="add">'+ICON.plus+'Add</button></div>',
    actions:[{label:'Cancel',value:'cancel'},{label:'Save groups',value:'save',kind:'primary'}],
    onOpen:draw,
    onClick:function(e,root){
      var b=e.target.closest('[data-g]'); if(!b) return; sync(root);
      var act=b.dataset.g, row=b.closest('.grp-row'), i=row&&row.dataset.i!=null?+row.dataset.i:-1;
      if(act==='add'){var n=$('#grpNew',root).value.trim();if(n){rows.push({name:n});$('#grpNew',root).value='';}}
      if(act==='up'&&i>0){var t=rows[i-1];rows[i-1]=rows[i];rows[i]=t;}
      if(act==='down'&&i<rows.length-1){var t2=rows[i+1];rows[i+1]=rows[i];rows[i]=t2;}
      if(act==='del'){ if(rows[i].id&&used(rows[i].id)){var err=$('[data-err]',root);err.textContent='"'+rows[i].name+'" still has members or past sessions. Move members out first, or rename it.';err.hidden=false;return;} rows.splice(i,1);}
      draw(root);
    },
    onAction:function(v,root){
      if(v!=='save') return; sync(root);
      var pending=$('#grpNew',root).value.trim(); if(pending) rows.push({name:pending});
      return api('PUT','groups',{groups:rows}).then(refresh).then(function(){render();toast('Groups saved');});
    }});
}

/* ---------- Reports ---------- */
var RF=null;
function reportRows(){
  var rows=[];
  S.sessions.forEach(function(s){
    if(s.date<RF.from||s.date>RF.to) return;
    roster(s).forEach(function(m){
      if(RF.group&&m.groupId!==RF.group) return;
      if(RF.member&&m.id!==RF.member) return;
      var r=(R.get(s.id)||new Map()).get(m.id), st=r?r.status:'U';
      if(RF.status&&st!==RF.status) return;
      rows.push({s:s,m:m,st:st,r:r});
    });
  });
  return rows;
}
function viewReports(){
  var today=klNow().date;
  if(!RF) RF={from:addDays(today,-90),to:today,group:'',member:'',status:''};
  var mems=S.members.slice().sort(function(a,b){return a.name.localeCompare(b.name);});
  view.innerHTML=
    '<div class="page-head"><div><p class="eyebrow">History</p><h1>Reports</h1></div><button class="btn primary" id="exportCsv" type="button">'+ICON.dl+'Export CSV</button></div>'+
    '<section class="card"><div class="filters">'+
      '<label class="field"><span>From</span><input class="input" type="date" id="rfFrom" value="'+RF.from+'" data-hint="rfFromH"><small id="rfFromH"></small></label>'+
      '<label class="field"><span>To</span><input class="input" type="date" id="rfTo" value="'+RF.to+'" data-hint="rfToH"><small id="rfToH"></small></label>'+
      '<label class="field"><span>Group</span><select class="input" id="rfGroup">'+groupOptions(RF.group,'All groups')+'</select></label>'+
      '<label class="field"><span>Member</span><select class="input" id="rfMember"><option value="">All members</option>'+mems.map(function(m){return '<option value="'+esc(m.id)+'"'+(m.id===RF.member?' selected':'')+'>'+esc(m.name)+(m.archived?' (archived)':'')+'</option>';}).join('')+'</select></label>'+
      '<label class="field"><span>Status</span><select class="input" id="rfStatus"><option value="">All statuses</option>'+['P','L','A','E','U'].map(function(k){return '<option value="'+k+'"'+(RF.status===k?' selected':'')+'>'+STATUS[k]+'</option>';}).join('')+'</select></label>'+
    '</div></section><div id="repOut" class="section" style="gap:22px"></div>';
  wireDateHints(view);
  ['rfFrom','rfTo','rfGroup','rfMember','rfStatus'].forEach(function(id){
    $('#'+id).addEventListener('change',function(){RF={from:$('#rfFrom').value||'0000-01-01',to:$('#rfTo').value||'9999-12-31',group:$('#rfGroup').value,member:$('#rfMember').value,status:$('#rfStatus').value};drawReport();});
  });
  $('#exportCsv').addEventListener('click',exportCsv);
  drawReport();
}
function drawReport(){
  var rows=reportRows(), c=zero(), per=new Map(), sessions=new Set();
  rows.forEach(function(x){c[x.st]++;sessions.add(x.s.id);var p=per.get(x.m.id);if(!p)per.set(x.m.id,p=Object.assign(zero(),{m:x.m}));p[x.st]++;});
  var perList=Array.from(per.values()).sort(function(a,b){return byMember(a.m,b.m);});
  var LIMIT=150;
  $('#repOut').innerHTML=
    '<section class="section"><div class="section-h"><h2>Summary</h2><span class="muted small">'+rows.length+' records · '+sessions.size+' sessions · '+fmtDate(RF.from)+' to '+fmtDate(RF.to)+'</span></div>'+
      tilesHTML(c,true)+'<p class="formula">Attendance rate = (Present + Late) ÷ (Present + Late + Absent) × 100. Excused and Unmarked are shown separately and not counted.</p></section>'+
    (perList.length?'<section class="section"><h2>By member</h2><div class="tbl-wrap"><table><thead><tr><th>Member</th><th>Group</th><th class="n">Present</th><th class="n">Late</th><th class="n">Absent</th><th class="n">Excused</th><th class="n">Unmarked</th><th class="n">Rate</th></tr></thead><tbody>'+
      perList.map(function(p){return '<tr><td>'+esc(p.m.name)+(p.m.archived?' <span class="tag">Archived</span>':'')+'</td><td>'+esc(gname(p.m.groupId))+'</td><td class="n">'+p.P+'</td><td class="n">'+p.L+'</td><td class="n">'+p.A+'</td><td class="n">'+p.E+'</td><td class="n">'+p.U+'</td><td class="n"><b>'+fmtRate(rateOf(p))+'</b></td></tr>';}).join('')+
      '</tbody></table></div></section>':'')+
    '<section class="section"><div class="section-h"><h2>Records</h2>'+(rows.length>LIMIT?'<span class="muted small">Showing the latest '+LIMIT+' of '+rows.length+'. Export CSV for all.</span>':'')+'</div>'+
      (rows.length?'<div class="tbl-wrap"><table><thead><tr><th>Date</th><th>Session</th><th>Member</th><th>Status</th><th>Updated</th></tr></thead><tbody>'+
      rows.slice(0,LIMIT).map(function(x){return '<tr><td class="num">'+fmtDay(x.s.date)+'<br><span class="muted small">'+fmtTime(x.s.time)+'</span></td><td><a href="#take-'+esc(x.s.id)+'">'+esc(x.s.name)+'</a><br><span class="muted small">'+esc(gname(x.s.groupId))+'</span></td><td>'+esc(x.m.name)+'<br><span class="muted small">'+esc(gname(x.m.groupId))+'</span></td><td><span class="chip c-'+x.st+'">'+STATUS[x.st]+'</span></td><td class="small muted">'+(x.r?fmtStamp(x.r.updatedAt)+'<br>'+esc(x.r.updatedBy||''):'Not saved')+'</td></tr>';}).join('')+
      '</tbody></table></div>':'<div class="empty">No records match these filters.</div>')+'</section>';
}
function csvCell(v){v=String(v==null?'':v);return /[",\n\r]/.test(v)||/^[=+\-@]/.test(v)?'"'+(/^[=+\-@]/.test(v)?"'":'')+v.replace(/"/g,'""')+'"':v;}
function exportCsv(){
  var rows=reportRows();
  var head=['Date','Day','Time','Session','Session group','Member','Rank','Member group','Status','Last updated','Updated by'];
  var lines=[head.join(',')].concat(rows.map(function(x){return [fmtDate(x.s.date),DAYS_FULL[dowOf(x.s.date)],x.s.time,x.s.name,gname(x.s.groupId),x.m.name,x.m.rank,gname(x.m.groupId),STATUS[x.st],x.r?fmtStamp(x.r.updatedAt):'',x.r?x.r.updatedBy:''].map(csvCell).join(',');}));
  var csv='﻿'+lines.join('\r\n')+'\r\n';
  var name='attendance_'+fmtDate(RF.from).replace(/\//g,'-')+'_to_'+fmtDate(RF.to).replace(/\//g,'-')+'.csv';
  saveFile(name,csv,rows.length);
}
function saveFile(name,csv,n){
  var viaBlob=function(){
    var url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
    var a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(url);},4000);
    toast('Exported '+n+' records');
  };
  if(window.claude&&window.claude.use){
    window.claude.use('downloads').then(function(d){
      if(!d) return showCsv(name,csv);
      return d.save({filename:name,data:csv}).then(function(){toast('Exported '+n+' records');},function(e){if(e&&e.code==='declined')return;showCsv(name,csv);});
    },function(){showCsv(name,csv);});
  } else viaBlob();
}
function showCsv(name,csv){
  openModal({title:'Copy CSV',html:'<p class="small muted">Downloads are not available in this view. Copy the CSV below and paste it into a spreadsheet, or save it as <b>'+esc(name)+'</b>.</p><textarea class="input" id="csvText" rows="10" readonly style="font-family:ui-monospace,monospace;font-size:.8rem">'+esc(csv.replace(/^﻿/,''))+'</textarea>',
    actions:[{label:'Close',value:'close'},{label:'Copy CSV',value:'copy',kind:'primary'}],
    onAction:function(v,root){if(v!=='copy')return;var ta=$('#csvText',root);
      return navigator.clipboard.writeText(ta.value).then(function(){toast('CSV copied');},function(){ta.focus();ta.select();toast('Text selected. Press copy.');return false;});}});
}

/* ---------- settings & appearance sheet ---------- */
function openSettings(){
  var t=ls('bb-theme')||'system', a=ls('bb-accent')||'navy';
  var accents=[['navy','Navy','#14294f'],['royal','Royal blue','#1d4bb0'],['teal','Teal','#0d5c63'],['maroon','Maroon','#7a1f2b']];
  openModal({title:'Settings',
    html:'<div class="field"><span>Theme</span><div class="seg" id="themeSeg">'+[['system','Match device'],['light','Light'],['dark','Dark']].map(function(o){return '<button type="button" data-theme-opt="'+o[0]+'" aria-pressed="'+(t===o[0])+'">'+o[1]+'</button>';}).join('')+'</div></div>'+
      '<div class="field"><span>Colour</span><div class="swatches">'+accents.map(function(o){return '<button type="button" class="swatch" data-accent-opt="'+o[0]+'" aria-pressed="'+(a===o[0])+'" style="--sw:'+o[2]+'"><i></i>'+o[1]+'</button>';}).join('')+'</div><small>Theme and colour are saved on this device only.</small></div>'+
      '<form><label class="field"><span>Organisation name</span><input class="input" id="setOrg" value="'+esc(S.orgName)+'" maxlength="120"><small>Shown in the header for all staff'+(MODE!=='demo'?'':' on this device')+'.</small></label></form>'+
      (MODE!=='demo'?'<p class="small">Signed in as <b>'+esc(S.user&&S.user.name)+'</b>.</p>':'<p class="small muted">This is a single-device demo. Data lives in this browser’s storage; clearing site data or using another device starts fresh. Use the server version to share records between staff.</p>'),
    actions:(MODE!=='demo'?[{label:'Sign out',value:'out',kind:'danger'}]:[{label:'Reset demo data',value:'reset',kind:'danger'}]).concat([{label:'Close',value:'close'},{label:'Save name',value:'save',kind:'primary'}]),
    onClick:function(e,root){
      var b=e.target.closest('[data-theme-opt],[data-accent-opt]'); if(!b) return;
      if(b.dataset.themeOpt){ls('bb-theme',b.dataset.themeOpt);$$('[data-theme-opt]',root).forEach(function(x){x.setAttribute('aria-pressed',String(x===b));});}
      else {ls('bb-accent',b.dataset.accentOpt);$$('[data-accent-opt]',root).forEach(function(x){x.setAttribute('aria-pressed',String(x===b));});}
      applyAppearance();
    },
    onAction:function(v,root){
      if(v==='close') return;
      if(v==='save') return api('PUT','settings',{orgName:$('#setOrg',root).value}).then(refresh).then(function(){render();toast('Organisation name saved');});
      if(v==='out') return (MODE==='firebase'?FB.auth.signOut():api('POST','logout')).then(function(){location.reload();});
      if(v==='reset') return confirmBox('Reset demo data?','<p>This replaces everything in this browser with fresh sample data.</p>','Reset','danger').then(function(ok){if(!ok)return false;T=null;Local.reset();return refresh().then(function(){route();toast('Demo data reset');});});
    }});
}
$('#btnSettings').addEventListener('click',function(){if(S)openSettings();});

/* ---------- sign-in (server mode) ---------- */
function viewLogin(msg){
  document.body.classList.add('task-mode');
  $('#tabs').hidden=true; $('#btnSettings').hidden=true;
  view.innerHTML='<div class="login"><form class="card" id="loginForm"><div><p class="eyebrow">Staff only</p><h1>Sign in</h1><p class="muted">Member records are only visible to signed-in staff.</p></div>'+
    '<label class="field"><span>Username</span><input class="input" id="lgUser" autocomplete="username" autocapitalize="none" required></label>'+
    '<label class="field"><span>Password</span><input class="input" id="lgPass" type="password" autocomplete="current-password" required></label>'+
    '<div class="err" id="lgErr"'+(msg?'':' hidden')+'>'+esc(msg||'')+'</div><button class="btn primary block" type="submit">Sign in</button></form></div>';
  $('#lgUser').focus();
  $('#loginForm').addEventListener('submit',function(e){
    e.preventDefault(); var err=$('#lgErr'); err.hidden=true;
    api('POST','login',{username:$('#lgUser').value,password:$('#lgPass').value}).then(function(){location.reload();},function(ex){err.textContent=ex.message;err.hidden=false;});
  });
}

/* ---------- boot ---------- */
function viewGoogleLogin(msg,email){
  document.body.classList.add('task-mode');
  $('#tabs').hidden=true; $('#btnSettings').hidden=true;
  view.innerHTML='<div class="login"><div class="card"><div><p class="eyebrow">Staff only</p><h1>Sign in</h1><p class="muted">Member records are only visible to staff on the company’s staff list.</p></div>'+
    (email?'<p class="small">Signed in as <b>'+esc(email)+'</b></p>':'')+
    '<div class="err" id="lgErr"'+(msg?'':' hidden')+'>'+esc(msg||'')+'</div>'+
    (email?'<button class="btn block" id="lgOut" type="button">Use a different Google account</button>':'<button class="btn primary block" id="lgGoogle" type="button">Sign in with Google</button>')+'</div></div>';
  var g=$('#lgGoogle'); if(g) g.addEventListener('click',function(){
    var err=$('#lgErr'); err.hidden=true; g.disabled=true;
    FB.signIn().then(function(){location.reload();},function(ex){g.disabled=false;if(ex&&/popup-closed|cancelled-popup/.test(ex.code||''))return;err.textContent=ex.message||String(ex);err.hidden=false;});
  });
  var o=$('#lgOut'); if(o) o.addEventListener('click',function(){FB.auth.signOut().then(function(){location.reload();});});
}
function bootFirebase(){
  try{FB.init();}catch(e){view.innerHTML='<div class="empty">Firebase could not start: '+esc(e.message)+'. Check firebase-config.js.</div>';return;}
  FB.currentUser().then(function(u){
    if(!u) return viewGoogleLogin();
    Local.memory=true; Local.who=u.displayName||u.email;
    return FB.load().then(function(db){
      if(db._fresh) return FB.firstRun().then(function(){return FB.load();});
      return db;
    }).then(function(db){delete db._fresh;Local.db=db;return refresh();}).then(function(){
      if(!location.hash) history.replaceState(null,'','#dashboard');
      route();
      document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible'&&!(T&&T.dirty)&&!document.querySelector('.modal-wrap'))FB.reload().then(refresh).then(render).catch(function(){});});
    },function(e){
      if(e.code==='permission-denied') return viewGoogleLogin(e.message,u.email);
      view.innerHTML='<div class="empty"><p>Could not load attendance data: '+esc(e.message)+'</p><button class="btn" onclick="location.reload()">Try again</button></div>';
    });
  });
}
function boot(){
  if(MODE==='firebase') return bootFirebase();
  if(!SERVER){Local.load();$('#demoBanner').hidden=false;if(!Local.persisted)$('#demoBanner').textContent='Single-device demo: this browser blocks storage, so changes will be lost on refresh.';}
  refresh().then(function(){
    if(!location.hash) history.replaceState(null,'','#dashboard');
    route();
    if(SERVER) document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible'&&!(T&&T.dirty)&&!document.querySelector('.modal-wrap'))refresh().then(render).catch(function(){});});
  },function(e){
    if(e.status===401) viewLogin(); else view.innerHTML='<div class="empty"><p>Could not load attendance data: '+esc(e.message)+'</p><button class="btn" onclick="location.reload()">Try again</button></div>';
  });
}
boot();
})();
</script>
