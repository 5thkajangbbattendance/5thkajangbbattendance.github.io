<title>5th Kajang Parade HQ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: white grouped sidebar + top bar on desktop; compact top bar + 5-tab bottom bar on phones. Soft navy-tinted canvas, white 16px cards, deep teal brand, mint highlight. */
:root{
  --acc:#1e3a8a; --acc-tl:#1e3a8a; --acc-td:#a9c0ff; --acc-sl:#e8eefc; --acc-sd:#1a2b5c; --mint-l:#cfdcff; --mint-d:#1d2b55; --deep:#0b1736;
  --bg:#f3f6fc; --surface:#ffffff; --surface-2:#f3f6fc; --surface-3:#e7ecf7; --ink:#0d1833; --ink-2:#2f3b58; --muted:#5d6987; --line:#e1e7f3; --line-strong:#ccd5e8;
  --accent:var(--acc); --accent-ink:#ffffff; --accent-text:var(--acc-tl); --accent-soft:var(--acc-sl); --mint:var(--mint-l); --mint-ink:#0d2a25;
  --p:#067647; --p-bg:#ecfdf3; --p-bd:#abefc6; --l:#b54708; --l-bg:#fffaeb; --l-bd:#fedf89; --a:#b42318; --a-bg:#fef3f2; --a-bd:#fecdca; --e:#175cd3; --e-bg:#eff8ff; --e-bd:#b2ddff; --u:#475467; --u-bg:#f2f4f7; --u-bd:#d0d5dd;
  --av0:#fde9cc; --av0i:#8a4b08; --av1:#d3f1e8; --av1i:#0f6e5f; --av2:#e7e2fb; --av2i:#4b3aa8; --av3:#dbeafe; --av3i:#1d4ed8; --av4:#fde2e6; --av4i:#a3243b; --av5:#0b1736; --av5i:#e8eefc;
  --shadow:0 1px 2px rgba(16,24,40,.04),0 1px 3px rgba(16,24,40,.03);
  --shadow-lg:0 20px 40px -12px rgba(16,24,40,.22);
  --f:"Manrope",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:16px; --r-sm:10px;
}
:root[data-accent="royal"]{--acc:#2556d9;--acc-tl:#1f4cc4;--acc-td:#9fbcff;--acc-sl:#e8efff;--acc-sd:#17295e;--mint-l:#d0ddff;--mint-d:#1c2d66;--deep:#0d1a45}
:root[data-accent="teal"]{--acc:#0f6e5f;--acc-tl:#0f6e5f;--acc-td:#5fd3bd;--acc-sl:#e3f4ef;--acc-sd:#14352f;--mint-l:#b5e9dd;--mint-d:#1b4740;--deep:#0f2e29}
:root[data-accent="emerald"]{--acc:#047857;--acc-tl:#047857;--acc-td:#6ee7b7;--acc-sl:#e6f6ef;--acc-sd:#0f3326;--mint-l:#bdeed6;--mint-d:#164534;--deep:#0b2a1f}
:root[data-accent="crimson"]{--acc:#9b2335;--acc-tl:#9b2335;--acc-td:#f2a0ac;--acc-sl:#fbeaec;--acc-sd:#3d1820;--mint-l:#f7d0d6;--mint-d:#4b1d26;--deep:#2b0f15}
:root[data-accent="violet"]{--acc:#5b3fd1;--acc-tl:#5236c4;--acc-td:#c0b1fa;--acc-sl:#efebfd;--acc-sd:#251c4f;--mint-l:#dcd3fb;--mint-d:#2e2560;--deep:#1a1338}
:root[data-accent="amber"]{--acc:#b45309;--acc-tl:#a14a07;--acc-td:#fcc77a;--acc-sl:#fdf3e6;--acc-sd:#3d2410;--mint-l:#f9dcb3;--mint-d:#4a2c12;--deep:#2b1808}
:root[data-accent="slate"]{--acc:#334155;--acc-tl:#334155;--acc-td:#c2cbd9;--acc-sl:#edf0f5;--acc-sd:#232c3b;--mint-l:#d5dce6;--mint-d:#2c3646;--deep:#141b26}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#08112a; --surface:#0f1b3d; --surface-2:#14234a; --surface-3:#1b2c58; --ink:#e8edf9; --ink-2:#c3cde6; --muted:#93a1c6; --line:#22325f; --line-strong:#32467e;
  --accent-text:var(--acc-td); --accent-soft:var(--acc-sd); --mint:var(--mint-d); --mint-ink:#e8efed;
  --p:#75e0a7; --p-bg:#0b2d1d; --p-bd:#13573a; --l:#fdc54b; --l-bg:#3a2006; --l-bd:#7a3d0c; --a:#fda29b; --a-bg:#3d120d; --a-bd:#7a1f16; --e:#84caff; --e-bg:#0b2545; --e-bd:#1849a9; --u:#cfd5dd; --u-bg:#1d2733; --u-bd:#344054;
  --av0:#3a2a12; --av0i:#fcd9a4; --av1:#123a32; --av1i:#9ae6d2; --av2:#29224d; --av2i:#cbbffb; --av3:#132c55; --av3i:#a9c8fb; --av4:#40161f; --av4i:#f7b3c0; --av5:#e8eefc; --av5i:#0b1736;
  --shadow:0 1px 2px rgba(0,0,0,.4); --shadow-lg:0 20px 40px -12px rgba(0,0,0,.6); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#08112a; --surface:#0f1b3d; --surface-2:#14234a; --surface-3:#1b2c58; --ink:#e8edf9; --ink-2:#c3cde6; --muted:#93a1c6; --line:#22325f; --line-strong:#32467e;
  --accent-text:var(--acc-td); --accent-soft:var(--acc-sd); --mint:var(--mint-d); --mint-ink:#e8efed;
  --p:#75e0a7; --p-bg:#0b2d1d; --p-bd:#13573a; --l:#fdc54b; --l-bg:#3a2006; --l-bd:#7a3d0c; --a:#fda29b; --a-bg:#3d120d; --a-bd:#7a1f16; --e:#84caff; --e-bg:#0b2545; --e-bd:#1849a9; --u:#cfd5dd; --u-bg:#1d2733; --u-bd:#344054;
  --av0:#3a2a12; --av0i:#fcd9a4; --av1:#123a32; --av1i:#9ae6d2; --av2:#29224d; --av2i:#cbbffb; --av3:#132c55; --av3i:#a9c8fb; --av4:#40161f; --av4i:#f7b3c0; --av5:#e8eefc; --av5i:#0b1736;
  --shadow:0 1px 2px rgba(0,0,0,.4); --shadow-lg:0 20px 40px -12px rgba(0,0,0,.6); color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);font-size:15px;line-height:1.5;padding-bottom:calc(70px + env(safe-area-inset-bottom,0px));-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
body.modal-open{overflow:hidden}
h1,h2,h3{font-family:var(--f);margin:0;line-height:1.2;text-wrap:balance;color:var(--ink)}
h1{font-size:1.9rem;font-weight:700;letter-spacing:-.025em}
h2{font-size:1.05rem;font-weight:700;letter-spacing:-.01em}
h3{font-size:.95rem;font-weight:700}
p{margin:0}
a{color:var(--accent-text)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid color-mix(in srgb,var(--accent-text) 45%,transparent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.eyebrow{font-size:.72rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)} .small{font-size:.86rem} .grow{flex:1;min-width:0}
svg{flex:none}

/* ---- shell ---- */
.app{display:flex;min-height:100vh}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.crest{width:36px;height:36px;object-fit:contain;flex:none}
.side{display:none}
.topbar{display:none}
.mtop{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.mtop .ttl{flex:1;min-width:0}
.mtop .ttl b{display:block;font-weight:700;font-size:1.02rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mtop .ttl span{display:block;font-size:.74rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.bnav a,.bnav button{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:60px;text-decoration:none;color:var(--muted);font-weight:600;font-size:.72rem;background:none;border:0;cursor:pointer;position:relative}
.bnav svg{width:22px;height:22px}
.bnav [aria-current]{color:var(--accent-text)}
.bnav [aria-current]::before{content:"";position:absolute;top:0;left:30%;right:30%;height:3px;border-radius:0 0 3px 3px;background:var(--accent)}
.nbadge{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:#d92d20;color:#fff;font-size:.7rem;font-weight:700;line-height:1}
.bnav .nbadge{position:absolute;top:6px;left:calc(50% + 6px)}
.avbtn{width:40px;height:40px;border-radius:50%;border:0;background:var(--deep);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--line-strong) 70%,transparent);color:#fff;font-weight:700;font-size:.85rem;cursor:pointer;display:grid;place-items:center;flex:none}
@media (min-width:1000px){
  body{padding-bottom:0}
  body::before{display:none}
  .mtop,.bnav{display:none}
  .side{display:flex;flex-direction:column;width:264px;flex:none;position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--surface);border-right:1px solid var(--line);padding:20px 16px 16px}
  .brandbox{display:flex;align-items:center;gap:10px;border:1px solid var(--line-strong);border-radius:12px;padding:8px 10px;margin-bottom:18px}
  .brandbox b{display:block;font-size:1rem;font-weight:700;line-height:1.2}
  .brandbox span{display:block;font-size:.74rem;color:var(--muted);line-height:1.3}
  .side nav{display:flex;flex-direction:column;gap:2px;flex:1}
  .nav-label{font-size:.7rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:14px 12px 6px}
  .nav-label:first-child{padding-top:2px}
  .side nav a{display:flex;align-items:center;gap:12px;min-height:44px;padding:0 12px;border-radius:12px;text-decoration:none;color:var(--ink-2);font-weight:500;font-size:.93rem}
  .side nav a:hover{background:var(--surface-2);color:var(--ink)}
  .side nav a[aria-current]{background:var(--accent);color:var(--accent-ink);font-weight:600}
  .side nav svg{width:19px;height:19px}
  .side nav a .nbadge{margin-left:auto}
  .side-user{display:flex;align-items:center;gap:10px;border-top:1px solid var(--line);padding:14px 4px 0;margin-top:12px}
  .side-user .grow b{display:block;font-size:.9rem;line-height:1.2}
  .side-user .grow span{display:block;font-size:.76rem;color:var(--muted)}
  .topbar{display:flex;justify-content:flex-end;align-items:center;gap:10px;padding:18px max(32px,env(safe-area-inset-right,0px)) 0 32px;position:relative;z-index:15}
}
.wrap{max-width:1240px;width:100%;margin:0 auto;padding-block:18px 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:20px}
@media (min-width:1000px){.wrap{padding:22px 32px 36px}}
.demo-note{max-width:1240px;width:100%;margin:12px auto 0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@media (min-width:1000px){.demo-note{padding:0 32px;margin-top:16px}}
.motto-foot{margin:0 0 14px;text-align:center;font-size:.8rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}

/* global search */
.gsearch{position:relative;width:240px}
.gsearch svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:17px;height:17px;color:var(--muted)}
.gsearch input{width:100%;height:42px;border-radius:999px;border:1px solid var(--line-strong);background:var(--surface);padding:0 14px 0 36px;font-size:.9rem}
.gres{position:absolute;top:48px;right:0;width:320px;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow-lg);padding:6px;max-height:380px;overflow:auto}
.gres button{display:flex;align-items:center;gap:10px;width:100%;padding:8px;border:0;background:none;border-radius:10px;text-align:left;cursor:pointer;color:var(--ink)}
.gres button:hover,.gres button:focus-visible{background:var(--surface-2)}
.gres small{display:block;color:var(--muted);font-size:.78rem}

/* ---- page header ---- */
.ph{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px}
.ph > div{min-width:0}
.ph .sub{color:var(--muted);margin-top:6px}
.ph-actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.datebar{display:flex;align-items:center;gap:2px;background:var(--surface);border:1px solid var(--line-strong);border-radius:12px;padding:3px;height:44px}
.datebar .ibtn{width:36px;height:36px;border:0}
.datebar input{border:0;background:transparent;height:36px;padding:0 4px;max-width:142px;font-weight:600;font-size:.9rem}
.datebar b{font-size:.92rem}

/* ---- cards ---- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:16px;min-width:0}
.card-h{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-start;gap:10px}
.card-h > div{min-width:0}
.card-s{color:var(--muted);font-size:.86rem;margin-top:2px}
.card.deep{background:var(--deep);border-color:var(--deep);color:#e8f3ef}
.card.deep h2{color:#fff}
.card.deep .card-s,.card.deep .muted{color:rgba(232,243,239,.72)}
.card.deep .input{background:#fff;color:#0f1f1c;border-color:#fff}
.card.deep .btn.primary{background:var(--mint-l);border-color:var(--mint-l);color:#0d2a25}
.card.deep .btn.sec{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.2);color:#fff}
.g-3{display:grid;gap:20px;grid-template-columns:1fr}
.g-2{display:grid;gap:20px;grid-template-columns:1fr}
@media (min-width:900px){.g-2{grid-template-columns:1.4fr 1fr}.g-3{grid-template-columns:1fr 1fr}}
@media (min-width:1280px){.g-3{grid-template-columns:1.35fr 1.1fr 1fr}}

/* ---- buttons ---- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--line-strong);background:var(--surface);font-weight:600;font-size:.92rem;cursor:pointer;text-decoration:none;color:var(--ink);white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08);background:var(--accent)}
.btn.danger{color:var(--a);border-color:var(--a-bd);background:var(--surface)}
.btn.danger:hover{background:var(--a-bg)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--accent-text)}
.btn.ghost:hover{background:var(--accent-soft)}
.btn.sm{min-height:36px;padding:0 12px;font-size:.85rem;border-radius:10px}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.btn svg{width:17px;height:17px}
.ibtn{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:50%;border:1px solid var(--line-strong);background:var(--surface);cursor:pointer;flex:none;color:var(--ink);padding:0}
.ibtn:hover{background:var(--surface-2)}
.ibtn svg{width:18px;height:18px}
.ibtn:disabled{opacity:.35;cursor:not-allowed}
.ibtn.sm{width:34px;height:34px}
.ibtn.sm svg{width:16px;height:16px}
.icon-btn{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:50%;border:1px solid var(--line-strong);background:var(--surface);cursor:pointer;color:var(--ink);padding:0}
.icon-btn svg{width:18px;height:18px}
.icon-btn:disabled{opacity:.35;cursor:not-allowed}
.row-btns{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

/* ---- forms ---- */
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field > span{font-size:.84rem;font-weight:600;color:var(--ink-2)}
.field small{color:var(--muted);font-size:.8rem}
.input,select.input,textarea.input{width:100%;min-height:44px;padding:9px 12px;border-radius:10px;border:1px solid var(--line-strong);background:var(--surface);font-size:.94rem;color:var(--ink)}
.input:focus{border-color:var(--accent-text);outline:3px solid color-mix(in srgb,var(--accent-text) 18%,transparent);outline-offset:0}
textarea.input{min-height:84px}
.check{display:flex;align-items:center;gap:10px;min-height:40px;cursor:pointer;font-size:.92rem}
.check input{width:18px;height:18px;accent-color:var(--acc)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(210px,100%),1fr));gap:14px}
.form{display:flex;flex-direction:column;gap:14px}
.searchbox{position:relative}
.od-status{gap:12px}
.od-status-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.od-seg{align-self:stretch;max-width:none;display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr))}
.od-grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(320px,100%),1fr))}
.od-list{display:flex;flex-direction:column}
.od-kv{display:flex;justify-content:space-between;gap:16px;padding:11px 0;border-top:1px solid var(--line)}
.od-kv:first-child{border-top:0}
.od-kv span{color:var(--muted);font-size:.88rem}
.od-kv b{font-weight:600;text-align:right;overflow-wrap:anywhere}
.od-lines{display:flex;flex-direction:column}
.od-line{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;padding:12px 0;border-top:1px solid var(--line)}
.od-line:first-child{border-top:0}
.od-part{display:flex;flex-direction:column;gap:2px;min-width:0}
.od-part span{color:var(--muted);font-size:.86rem}
.od-amt{display:flex;flex-direction:column;align-items:flex-end;gap:2px;text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.od-amt span{color:var(--muted);font-size:.86rem}
.od-total{border-top:2px solid var(--line-strong);font-size:1.05rem}
.od-notes{white-space:pre-line}
.od-danger{display:flex;flex-direction:row;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.ordering{gap:12px}
.ordering-h{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-start;gap:12px}
.ordering-h h2{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ordering-msg{border-left:4px solid var(--accent-text);background:var(--surface-2);border-radius:10px;padding:10px 14px}
.ordering-msg span{display:block;font-size:.76rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.ordering-msg p{white-space:pre-line}
.round-pick .field{max-width:360px}
.rounds{display:flex;flex-direction:column;gap:12px}
.round{border:1px solid var(--line);border-radius:14px;padding:14px}
.round-h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
.round-log{list-style:none;margin:10px 0 0;padding:0 0 0 14px;border-left:2px solid var(--line-strong);display:flex;flex-direction:column;gap:8px;font-size:.88rem;color:var(--ink-2)}
.round-log p{margin:2px 0 0;color:var(--muted);white-space:pre-line}
.contacts{display:flex;flex-direction:column;gap:8px}
.contact-row{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr) minmax(0,1fr) auto;gap:8px;align-items:center}
@media (max-width:640px){.contact-row{grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto}.contact-row [data-c=name]{grid-column:1 / -1}}
.pm-list{display:flex;flex-direction:column;gap:10px}
.pm-row{display:grid;grid-template-columns:72px minmax(0,1fr) auto;gap:14px;align-items:center;border:1px solid var(--line);border-radius:14px;padding:12px}
.pm-thumb{width:72px;height:72px;border-radius:12px;background:var(--accent-soft);color:var(--accent-text);display:grid;place-items:center;overflow:hidden;font-weight:800;font-size:.8rem}
.pm-thumb img{width:100%;height:100%;object-fit:contain;background:#fff}
.pm-b{display:flex;flex-direction:column;gap:2px;min-width:0}
.pm-b p{margin:4px 0 0;color:var(--ink-2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pm-side{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
@media (max-width:640px){.pm-row{grid-template-columns:56px minmax(0,1fr)}.pm-thumb{width:56px;height:56px}.pm-side{grid-column:1 / -1;flex-direction:row;justify-content:space-between;align-items:center}}

var DEL={__del:1};
function isDel(v){return v===DEL||(v&&typeof v==='object'&&v.__del===1);}

function deepMerge(a,b){

    if(isDel(v)) delete a[k];
    else if(v&&typeof v==='object'&&!Array.isArray(v)&&a[k]&&typeof a[k]==='object'&&!Array.isArray(a[k])) deepMerge(a[k],v);

  });

}
var LS_KEY='bb5kj-parade-demo-v3';
var Local={
  db:null, subs:[], persisted:true,
  init:function(){var raw=ls(LS_KEY);if(raw){try{this.db=JSON.parse(raw);}catch(e){}}if(!this.db){this.db=bbSeed(today());this.save();}},
  save:function(){try{localStorage.setItem(LS_KEY,JSON.stringify(this.db));this.persisted=true;}catch(e){this.persisted=false;}},
  reset:function(){ls(LS_KEY,null);this.db=bbSeed(today());this.save();var self=this;this.subs.forEach(function(s){self.emit(s);});},
  read:function(s){
    var db=this.db; if(s.doc) return clone(db[s.doc])||null;
    var out={}; Object.keys(db).forEach(function(k){var i=k.indexOf('/');if(k.slice(0,i)===s.coll)out[k.slice(i+1)]=clone(db[k]);});
    return out;
  },
  emit:function(s){var v=this.read(s);setTimeout(function(){if(!s.dead)s.cb(v);},0);},
  sub:function(coll,cb){var s={coll:coll,cb:cb};this.subs.push(s);this.emit(s);return function(){s.dead=true;};},
  subDoc:function(path,cb){var s={doc:path,cb:cb};this.subs.push(s);this.emit(s);return function(){s.dead=true;};},
  get:function(path){return Promise.resolve(clone(this.db[path])||null);},
  commit:function(ops){
    var db=this.db, touched={}, self=this;
    ops.forEach(function(o){
      if(o.del) delete db[o.path]; else if(o.merge) db[o.path]=deepMerge(db[o.path]||{},o.data); else db[o.path]=strip(clone(o.data));
      touched[o.path]=1; touched[o.path.split('/')[0]]=1;
    });
    this.save(); this.subs.forEach(function(s){if(!s.dead&&(s.doc?touched[s.doc]:touched[s.coll]))self.emit(s);});
    return Promise.resolve();
  }
};
function friendly(e){
  var c=(e&&e.code)||'', m;
  if(/invalid-credential|wrong-password|user-not-found|invalid-login|invalid-email/.test(c)) m='Username or password is incorrect.';
  else if(/email-already-in-use/.test(c)) m='That username is already taken. Choose another.';
  else if(/weak-password/.test(c)) m='Use a password of at least 8 characters.';
  else if(/too-many-requests/.test(c)) m='Too many tries. Wait a few minutes, then try again.';
  else if(/operation-not-allowed/.test(c)) m='Username sign-in is not switched on yet. In Firebase, open Authentication, Sign-in method, and enable Email/Password.';
  else if(/network-request-failed|unavailable/.test(c)) m='No internet connection. Check your signal and try again.';
  else if(/permission-denied/.test(c)) m='Your duty does not allow this change.';
  else if(/requires-recent-login/.test(c)) m='Sign out and sign in again, then retry.';
  else m=(e&&e.message)||String(e);
  var x=new Error(m); x.code=c; return x;
}

  fs:null, auth:null,
  init:function(){firebase.initializeApp(FBCFG);this.auth=firebase.auth();this.fs=firebase.firestore();if(FBCFG.emulatorHost){this.auth.useEmulator('http://'+FBCFG.emulatorHost+':9099',{disableWarnings:true});this.fs.useEmulator(FBCFG.emulatorHost,8080);}},

  sub:function(coll,cb,opts){

  },
  subDoc:function(path,cb){return this.fs.doc(path).onSnapshot(function(d){cb(d.exists?d.data():null);},function(e){console.warn('read '+path,e.code);cb(null);});},
  get:function(path){return this.fs.doc(path).get().then(function(d){return d.exists?d.data():null;}).catch(function(e){throw friendly(e);});},
  commit:function(ops){

VIEWS.dates=function(){
  var ym=D.slice(0,7), y=+ym.slice(0,4), m=+ym.slice(5,7), lead=(dowOf(ym+'-01')+6)%7, days=new Date(Date.UTC(y,m,0)).getUTCDate(), all=seen();
  var cells=''; for(var i=0;i<lead;i++) cells+='<span aria-hidden="true"></span>';
  for(var d=1;d<=days;d++){
    var iso=ym+'-'+(d<10?'0':'')+d, st=paradeStatus(iso), cls=[], tag='';
    if(st==='off'){cls.push('off');tag='Off';} else if(st){cls.push('has');var c=countsOn(iso,all);tag=fmtPct(pct(c.P+c.L,all.length)).replace(/\.\d/,'');}
    if(iso===today()) cls.push('today'); if(iso===D) cls.push('sel');
    cells+='<button type="button" class="'+cls.join(' ')+'" data-act="calPick" data-d="'+iso+'" aria-label="'+fmtLong(iso)+(tag?', '+tag:'')+'">'+d+(tag?'<i>'+tag+'</i>':'')+'</button>';
  }
  var st=paradeStatus(D), pd=ST.parades[D]||{}, detail;

  else if(st){var c2=countsOn(D,all);detail='<div class="chips">'+['P','L','A','E','U'].map(function(k){return '<span class="pill c-'+k+'">'+STATUS[k]+' '+c2[k]+'</span>';}).join('')+'</div><p class="small muted">'+statusLabel(st,pd)+' · strength '+fmtPct(pct(c2.P+c2.L,all.length))+'</p><div class="row-btns"><a class="btn sm" href="#command">Open in Command</a><a class="btn sm ghost" href="#report">View report</a></div>';}
  else detail='<p class="muted">Nothing recorded.</p><div class="row-btns"><a class="btn sm" href="#command">Open in Command</a></div>';
  view.innerHTML=head('Calendar','Every parade and parade-off day, month by month.','<div class="datebar"><button class="icon-btn" data-act="calMonth" data-v="-1" aria-label="Previous month">'+ICON.left+'</button><b style="padding:0 8px">'+MONTHS[m-1]+' '+y+'</b><button class="icon-btn" data-act="calMonth" data-v="1" aria-label="Next month">'+ICON.right+'</button></div>')+
    '<section class="card"><div class="cal">'+['MON','TUE','WED','THU','FRI','SAT','SUN'].map(function(x){return '<span class="dow">'+x+'</span>';}).join('')+cells+'</div><p class="small muted">Green days had a parade, with the strength shown. Grey days were set as parade off.</p></section>'+

function rosterSort(a,b){
  if(RS.sort==='az') return a.name.localeCompare(b.name);
  if(RS.sort==='high') return rankIdx(a.rank)-rankIdx(b.rank)||a.name.localeCompare(b.name);
  if(RS.sort==='low') return rankIdx(b.rank)-rankIdx(a.rank)||a.name.localeCompare(b.name);
  return byRoll(a,b);
}

function parseCSV(text){
  var rows=[],row=[],f='',q=false;
  for(var i=0;i<text.length;i++){var ch=text[i];
    if(q){if(ch==='"'){if(text[i+1]==='"'){f+='"';i++;}else q=false;}else f+=ch;}
    else if(ch==='"')q=true; else if(ch===','){row.push(f);f='';} else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&text[i+1]==='\n')i++;row.push(f);rows.push(row);row=[];f='';} else f+=ch;}
  if(f||row.length){row.push(f);rows.push(row);}
  return rows.filter(function(r){return r.some(function(c){return c.trim();});});
}
function csvToPeople(text){
  var rows=parseCSV(text), out=[], bad=[];
  if(rows.length&&/name/i.test(rows[0][0])) rows.shift();
  rows.forEach(function(r,i){
    var name=(r[0]||'').trim().replace(/\s+/g,' '), sec=(r[1]||'').trim().toLowerCase(), rank=(r[2]||'').trim(), sq=parseInt(r[3],10), lead=/^(y|yes|true|1)$/i.test((r[4]||'').trim());
    var m=sec.match(/squad\s*(\d)/); if(m){sq=+m[1];sec='members';}
    if(/^officer/.test(sec))sec='officers'; else if(/^primer/.test(sec))sec='primers'; else if(/^helper/.test(sec))sec='helper'; else if(/^member/.test(sec))sec='members';
    if(!name||SECTIONS.indexOf(sec)<0||(sec==='members'&&!(sq>=1&&sq<=4))){bad.push(i+1);return;}
    var rk=RANKS[sec].filter(function(x){return x.toLowerCase()===rank.toLowerCase();})[0]||(sec==='members'?'Private':RANKS[sec][0]);
    out.push({name:name,section:sec,rank:rk,squad:sec==='members'?sq:null,squadLeader:sec==='members'&&lead,active:true});
  });
  return {people:out,bad:bad};
}
ACT.rsImport=function(){
  openModal({title:'Import roster from CSV',html:'<p class="small muted">One person per line: <b>Name, Section, Rank, Squad, Squad leader</b>. Section is Officers, Primers, Helper or Members. Squad is 1 to 4 for members. Names already on the roster are skipped.</p><label class="field"><span>Choose a CSV file</span><input class="input" type="file" id="csvFile" accept=".csv,text/csv"></label><label class="field"><span>Or paste the CSV</span><textarea class="input" id="csvText" rows="8" placeholder="Name,Section,Rank,Squad,Squad leader&#10;Tan Wei Ming,Members,Private,1,No"></textarea></label><p class="small" id="csvInfo"></p>',
    actions:[{label:'Cancel',value:'no'},{label:'Import',value:'go',kind:'primary'}],
    onChange:function(e,w){if(e.target.id==='csvFile'&&e.target.files[0]){var fr=new FileReader();fr.onload=function(){$('#csvText',w).value=String(fr.result).replace(/^﻿/,'');var r=csvToPeople($('#csvText',w).value);$('#csvInfo',w).textContent=r.people.length+' people found'+(r.bad.length?', '+r.bad.length+' lines could not be read (lines '+r.bad.slice(0,8).join(', ')+')':'')+'.';};fr.readAsText(e.target.files[0]);}},
    onAction:function(v,w){
      if(v!=='go') return;
      var r=csvToPeople($('#csvText',w).value); if(!r.people.length) throw new Error('No people found. Check that each line has a name and a section.');
      var have={}; roll(true).forEach(function(p){have[p.name.toLowerCase()]=1;});
      var upd={}, n=0; r.people.forEach(function(p){if(have[p.name.toLowerCase()])return;have[p.name.toLowerCase()]=1;upd['p'+uid()+n]=p;n++;});
      if(!n) throw new Error('Everyone in that file is already on the roster.');
      return savePeople(upd).then(function(){toast('Imported '+plural(n,'person','people')+(r.bad.length?'. '+r.bad.length+' lines skipped.':''));});
    }});
};

ACT.wbSaveSite=function(){
  var d={}; SITE_FIELDS.forEach(function(f){d[f[0]]=$('#sf_'+f[0]).value.trim();});
  var contacts=[], bad='';
  $$('#sfContacts .contact-row').forEach(function(r,i){var c={};['name','role','phone'].forEach(function(k){c[k]=$('[data-c="'+k+'"]',r).value.trim();});
    if(!c.name&&!c.role&&!c.phone)return; if(!c.name)bad=bad||'Enter the name for officer '+(i+1)+'.'; else if(c.phone.replace(/\D/g,'').length<7)bad=bad||'Check the WhatsApp number for '+c.name+'.'; contacts.push(c);});
  if(bad){toast(bad);return;}
  d.contacts=contacts;
  if(d.email&&!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(d.email)){toast('Check the email address.');return;}
  ['instagram','facebook'].forEach(function(k){if(d[k]&&!/^https:\/\//.test(d[k]))d[k]='https://'+d[k].replace(/^\/+/,'');});
  d.updatedAt=new Date().toISOString(); d.updatedBy=ME.name;
  Store.commit([{path:'config/site',merge:true,data:d}]).then(function(){toast('Site details saved. The website shows them straight away.');},function(e){toast(e.message);});
};

function qrImage(file){
  return new Promise(function(res,rej){
    if(!/^image\//.test(file.type)) return rej(new Error('Choose an image file.'));
    var r=new FileReader(); r.onerror=function(){rej(new Error('Could not read the image.'));};
    r.onload=function(){var im=new Image();im.onerror=function(){rej(new Error('Could not open the image.'));};im.onload=function(){
      var k=Math.min(1,720/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);
      var x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.imageSmoothingEnabled=false;x.drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/png'));};im.src=r.result;};
    r.readAsDataURL(file);
  });
}

      '<div class="field"><span>QR code <i>(optional)</i></span><div id="pmPrev">'+prev()+'</div><div class="row-btns"><input class="input" type="file" id="pmF" accept="image/*" style="flex:1"><button type="button" class="btn sm ghost" data-pmrm="1">Remove QR</button></div><small>Upload a clear screenshot of the QR. Crop out anything you do not want parents to see.</small></div>'+

      '<label class="check"><input type="checkbox" id="pmS"'+(m.show!==false?' checked':'')+'> Show on the website</label></form>',

    onClick:function(e,w){if(e.target.closest('[data-pmrm]')){qr='';$('#pmPrev',w).innerHTML=prev();$('#pmF',w).value='';}},

function shrinkImage(file,max,quality){
  return new Promise(function(res,rej){
    var url=URL.createObjectURL(file), img=new Image();
    img.onload=function(){
      var r=Math.min(1,max/Math.max(img.width,img.height)), c=document.createElement('canvas');
      c.width=Math.round(img.width*r); c.height=Math.round(img.height*r);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(url);
      var q=quality, out=c.toDataURL('image/jpeg',q); while(out.length>850000&&q>0.4){q-=0.1;out=c.toDataURL('image/jpeg',q);}
      res(out);
    };
    img.onerror=function(){URL.revokeObjectURL(url);rej(new Error('That file could not be read as a photo. Use a JPG or PNG.'));};
    img.src=url;
  });
}

  openModal({title:id?'Edit post':'New post',

      o1.push([o.ref||'',k.d,k.t,OR_LABEL[st],o.childName||'',o.kind==='new'?'New member':'Existing member',USEC[o.section]||'',o.kind==='new'?(o.age?'Age '+o.age:''):(o.squad||''),o.parentName||'',String(o.phone||''),
        (o.items||[]).map(function(l){var d=lineDesc(l);return l.qty+' × '+l.name+(d?' ('+d+')':'');}).join('; '),orQty(o),Math.round((+o.total||0)*100)/100,o.payMethod||'',o.notes||'',o.handledBy?o.handledBy+' · '+fmtStamp(o.handledAt):'']);});
    o1.push([]); o1.push(['','','','','','','','','','','Total, not counting cancelled','',Math.round(sum*100)/100]);
    var ws1=xlSheet(X,o1,3,[12],60); var tc=X.utils.encode_cell({r:o1.length-1,c:12}); if(ws1[tc])ws1[tc].z='#,##0.00';
    ws1['!autofilter']=list.length?{ref:X.utils.encode_range({s:{r:3,c:0},e:{r:3+list.length,c:15}})}:undefined;
    list.forEach(function(o,i){var a=X.utils.encode_cell({r:4+i,c:0});if(ws1[a])ws1[a].l={Target:"#'"+names[i]+"'!A1",Tooltip:'Open order '+(o.ref||'')};});
    X.utils.book_append_sheet(wb,ws1,'Orders');
    var prep={}; list.filter(function(o){var s=o.status||'new';return s==='new'||s==='paid';}).forEach(function(o){(o.items||[]).forEach(function(l){var key=[l.name,l.size||'',l.detail||''].join('|');if(!prep[key])prep[key]=[l.name,l.size||'',l.detail||'',0];prep[key][3]+=(+l.qty||0);});});
    var rows=Object.keys(prep).map(function(k){return prep[k];}).sort(function(a,b){return a[0].localeCompare(b[0])||a[1].localeCompare(b[1],undefined,{numeric:true})||a[2].localeCompare(b[2]);});
    var o3=[['Parts to prepare · new and paid orders'],['Downloaded '+stamp],[],['Part','Size','Details','Qty']].concat(rows);
    X.utils.book_append_sheet(wb,xlSheet(X,o3,3,[]),'To prepare');
    list.forEach(function(o,i){X.utils.book_append_sheet(wb,orderSheet(X,o,org),names[i]);});
    var out=X.write(wb,{bookType:'xlsx',type:'array'});
    var fname='uniform-orders-'+rname.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')+'-'+today()+'.xlsx';
    saveFile(fname,out,'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet','Downloaded '+fname);
  },function(e){toast(e.message);});
};

/* ---------- Staff ---------- */
VIEWS.staff=function(){

      '<label class="field"><span>Password</span><input class="input" id="nsPass" type="text" autocomplete="new-password" minlength="8"><small>At least 8 characters. Give it to them in person.</small></label>'+
      '<label class="field"><span>Duty</span><select class="input" id="nsDuty" data-on="nsDuty">'+order.map(function(k){return opt(k,DUTY_LABEL[k],'leader');}).join('')+'</select><small id="nsNote">'+DUTY_NOTE.leader+'</small></label>'+

        (own?'<div class="grid2"><label class="field"><span>Name on the board</span><input class="input" data-f="name" value="'+esc(s.name)+'" maxlength="40"></label><label class="field"><span>Duty</span><select class="input" data-f="duty"'+(me?' disabled':'')+'>'+order.map(function(k){return opt(k,DUTY_LABEL[k],s.duty);}).join('')+'</select></label>'+

ACT.stLogin=function(b){
  var old=b.dataset.u, s0=ST.staff[old];
  openModal({title:'Change login for '+s0.name,
    html:'<p class="small muted">Set a new username and password. The old login stops working straight away. Their name, duty, squad and past marks stay the same.</p><form class="form"><label class="field"><span>Username</span><input class="input" id="clU" value="'+esc(s0.username||'')+'" autocapitalize="none" autocomplete="off" maxlength="30"></label><label class="field"><span>New password</span><input class="input" id="clP" type="text" autocomplete="new-password" minlength="8"><small>At least 8 characters. Give it to them in person.</small></label></form>',
    actions:[{label:'Cancel',value:'no'},{label:'Save new login',value:'go',kind:'primary'}],
    onAction:function(v,w){
      if(v!=='go') return;
      var u=cleanUser($('#clU',w).value), p=$('#clP',w).value;
      if(!validUser(u)) throw new Error('Usernames need 3 to 30 letters, numbers, dots or dashes.');
      if(p.length<8) throw new Error('Passwords need at least 8 characters.');
      if(Object.keys(ST.staff).some(function(k){return k!==old&&ST.staff[k].username===u;})) throw new Error('That username is already used by another post.');
      return Auth.createOther(u,p).then(function(a){
        var d=Object.assign({},clone(s0),{username:u,loginChangedAt:new Date().toISOString(),loginChangedBy:ME.name});
        var ops=[{path:'staff/'+a.uid,data:d},{path:'staff/'+old,del:true},{path:'logins/'+u,data:{email:a.email,uid:a.uid}}];
        if(s0.username&&s0.username!==u) ops.push({path:'logins/'+s0.username,del:true});
        return Store.commit(ops);
      }).then(function(){toast('New login saved for '+s0.name+'. Username: '+u);});
    }});
};
ON.nsDuty=function(t){$('#nsNote').textContent=DUTY_NOTE[t.value];$('#nsSqWrap').hidden=t.value!=='leader';};
ACT.stCreate=function(b){
  var name=$('#nsName').value.trim(), u=cleanUser($('#nsUser').value), p=$('#nsPass').value, duty=$('#nsDuty').value, sq=duty==='leader'?+$('#nsSq').value:null;
  if(!name){toast('Enter a display name.');return;} if(!validUser(u)){toast('Usernames need 3 to 30 letters, numbers, dots or dashes.');return;} if(p.length<8){toast('Passwords need at least 8 characters.');return;}
  if(Object.keys(ST.staff).some(function(k){return ST.staff[k].username===u;})){toast('That username is already taken.');return;}
  b.disabled=true;
  Auth.createOther(u,p).then(function(a){return Store.commit([{path:'staff/'+a.uid,data:{username:u,name:name,duty:duty,squad:sq,active:true,createdAt:new Date().toISOString()}},{path:'logins/'+u,data:{email:a.email,uid:a.uid}}]);})
    .then(function(){toast('Account created for '+name+'. Username: '+u);},function(e){toast(e.message);b.disabled=false;});
};
ACT.stKey=function(){
  var a=$('#rkA').value,c=$('#rkB').value; if(a.length<8){toast('Use a recovery key of at least 8 characters.');return;} if(a!==c){toast('The two keys do not match.');return;}
  Store.commit([{path:'config/recovery',data:{key:a,setAt:new Date().toISOString()}}]).then(function(){toast('Recovery key saved');$('#rkA').value='';$('#rkB').value='';},function(e){toast(e.message);});
};
ACT.stSave=function(b){
  var box=$('[data-staff="'+b.dataset.u+'"]'), name=$('[data-f=name]',box).value.trim(), duty=$('[data-f=duty]',box).value;
  if(!name){toast('Enter a name.');return;}
  Store.commit([{path:'staff/'+b.dataset.u,merge:true,data:{name:name,duty:duty,squad:duty==='leader'?+$('[data-f=squad]',box).value:null}}]).then(function(){toast('Saved');},function(e){toast(e.message);});
};
ACT.stActive=function(b){
  var on=b.dataset.v==='1', s=ST.staff[b.dataset.u];
  var go=on?Promise.resolve(true):confirmBox('Revoke '+s.name+'?','<p>They will be signed out and cannot sign in again until reinstated. Their past marks stay.</p>','Revoke','danger');
  go.then(function(ok){if(ok)Store.commit([{path:'staff/'+b.dataset.u,merge:true,data:{active:on}}]).then(function(){toast(on?'Reinstated':'Revoked');},function(e){toast(e.message);});});
};

      if(e.target.closest('[data-pw]')){var cur=$('#pwCur',w).value,nw=$('#pwNew',w).value;if(nw.length<8){toast('Use a new password of at least 8 characters.');return;}Auth.changePassword(cur,nw).then(function(){toast('Password changed');$('#pwCur',w).value='';$('#pwNew',w).value='';},function(er){toast(er.message);});}

      if(v==='save'){var n=$('#soName',w).value.trim();if(!n)throw new Error('Enter the organisation name.');return Store.commit([{path:'config/org',merge:true,data:{orgName:n,code:$('#soCode',w).value.trim()||'5THKJBB',est:$('#soEst',w).value.trim()}}]).then(function(){toast('Saved');});}
    }});

/* ---------- sign-in, first-time setup, recovery ---------- */
var busyAuth=false;
function loginShell(panel){
  document.body.classList.add('login-mode');
  view.innerHTML='<div class="login"><section class="login-brand"><div class="lb-top"><img class="crest" src="'+ROOT+'bb-crest.png" alt="" onerror="this.remove()"><div><b>Parade HQ</b><span>The 5th Kajang Boys’ Brigade Company</span></div></div>'+
    '<div class="lb-mid"><h1>Every parade, <em>accounted for.</em></h1><p>Attendance, reports and records for the officers and squad leaders of the 5th Kajang Company.</p>'+
    '</div>'+
    '<p class="lb-motto">Sure &amp; Stedfast</p></section><section class="login-panel">'+panel+'</section></div>';
}
function viewLogin(msg){
  loginShell('<form id="lgForm"><div><h2>Sign in</h2><p class="muted" style="margin-top:6px">Welcome back. Use the username and password from your Owner.</p></div><label class="field"><span>Username</span><input class="input" id="lgUser" autocomplete="username" autocapitalize="none" required></label><label class="field"><span>Password</span><input class="input" id="lgPass" type="password" autocomplete="current-password" required></label>'+
    '<div class="err" id="lgErr"'+(msg?'':' hidden')+'>'+esc(msg||'')+'</div><button class="btn primary block" type="submit">Sign in</button><button class="btn ghost" type="button" id="lgForgot">Forgot Owner password?</button></form>');
  $('#lgUser').focus();
  $('#lgForm').addEventListener('submit',function(e){e.preventDefault();var err=$('#lgErr'),btn=$('#lgForm .btn.primary');err.hidden=true;btn.disabled=true;btn.textContent='Please wait…';
    Auth.signIn($('#lgUser').value,$('#lgPass').value).catch(function(ex){err.textContent=ex.message;err.hidden=false;btn.disabled=false;btn.textContent='Sign in';});});
  $('#lgForgot').addEventListener('click',viewRecover);
}
function viewSetup(){
  loginShell('<form id="suForm"><div><h2>First-time setup</h2><p class="muted small">No Owner account exists yet. Create it now. The Owner can then issue posts to officers and squad leaders.</p></div>'+
    '<label class="field"><span>Display name</span><input class="input" id="suName" value="Owner" maxlength="40"></label><label class="field"><span>Username</span><input class="input" id="suUser" value="owner" autocapitalize="none" maxlength="30"></label>'+
    '<label class="field"><span>Password</span><input class="input" id="suPass" type="password" autocomplete="new-password"></label><label class="field"><span>Confirm password</span><input class="input" id="suPass2" type="password" autocomplete="new-password"></label>'+
    '<div class="err" id="suErr" hidden></div><button class="btn primary block" type="submit">Create Owner account</button></form>');
  $('#suForm').addEventListener('submit',function(e){
    e.preventDefault(); var err=$('#suErr'); err.hidden=true;
    var name=$('#suName').value.trim()||'Owner', u=cleanUser($('#suUser').value), p=$('#suPass').value;
    var fail=function(m){err.textContent=m;err.hidden=false;busyAuth=false;};
    if(!validUser(u)) return fail('Usernames need 3 to 30 letters, numbers, dots or dashes.');
    if(p.length<8) return fail('Use a password of at least 8 characters.');
    if(p!==$('#suPass2').value) return fail('The two passwords do not match.');
    busyAuth=true;
    Auth.createSelf(u,p).then(function(id){
      return Fire.commit([{path:'staff/'+id,data:{username:u,name:name,duty:'owner',active:true,createdAt:new Date().toISOString()}},{path:'config/owner',data:{uid:id}}])
        .then(function(){return Fire.commit([{path:'config/org',data:{orgName:"The 5th Kajang Boys' Brigade Company",code:'5THKJBB',est:'2020'}},{path:'config/rosterIndex',data:buildIndex({})}]);});
    }).then(function(){location.reload();},function(ex){fail(ex.message);});
  });
}
function viewRecover(){
  loginShell('<form id="rcForm"><div><h2>Recover Owner access</h2><p class="muted small">Enter the Owner recovery key that was set on the Staff page. You get a new Owner login, and the old Owner login is revoked.</p></div>'+
    '<label class="field"><span>Recovery key</span><input class="input" id="rcKey" type="password"></label><label class="field"><span>New Owner username</span><input class="input" id="rcUser" autocapitalize="none" maxlength="30"><small>Must be different from the old username.</small></label>'+
    '<label class="field"><span>New password</span><input class="input" id="rcPass" type="password" autocomplete="new-password"></label>'+
    '<div class="err" id="rcErr" hidden></div><button class="btn primary block" type="submit">Recover access</button><button class="btn ghost" type="button" id="rcBack">Back to log in</button></form>');
  $('#rcBack').addEventListener('click',function(){viewLogin();});
  $('#rcForm').addEventListener('submit',function(e){
    e.preventDefault(); var err=$('#rcErr'); err.hidden=true;
    var key=$('#rcKey').value, u=cleanUser($('#rcUser').value), p=$('#rcPass').value, oldUid=null;
    var fail=function(m){err.textContent=m;err.hidden=false;busyAuth=false;};
    if(!key) return fail('Enter the recovery key.'); if(!validUser(u)) return fail('Usernames need 3 to 30 letters, numbers, dots or dashes.'); if(p.length<8) return fail('Use a password of at least 8 characters.');
    busyAuth=true;
    Fire.get('config/owner').then(function(o){oldUid=o&&o.uid;return Auth.createSelf(u,p);}).then(function(id){
      return Fire.commit([{path:'staff/'+id,data:{username:u,name:'Owner',duty:'owner',active:true,recoveryKey:key,createdAt:new Date().toISOString()}},{path:'config/owner',data:{uid:id}}]).then(function(){
        var ops=[{path:'staff/'+id,merge:true,data:{recoveryKey:DEL}}]; if(oldUid&&oldUid!==id) ops.push({path:'staff/'+oldUid,merge:true,data:{active:false}});
        return Fire.commit(ops);
      },function(ex){
        var cu=Fire.auth.currentUser, gone=cu?cu.delete().catch(function(){}):Promise.resolve();
        return gone.then(function(){throw new Error(/duty|permission/i.test(ex.message)?'That recovery key does not match.':ex.message);});
      });
    }).then(function(){location.reload();},function(ex){Fire.auth.signOut().catch(function(){});fail(ex.message);});
  });
}
function viewNotPosted(){
  loginShell('<form><div><h2>No post yet</h2><p class="muted">This login is not posted, or the post was revoked. Ask the Owner to issue you a post on the Staff page.</p></div><button class="btn block" type="button" id="npOut">Use a different login</button></form>');
  $('#npOut').addEventListener('click',function(){Auth.signOut().then(function(){location.reload();});});
}

/* ---------- boot ---------- */
function start(){document.body.classList.remove('login-mode');startSubs();}
function boot(){
  if(MODE==='demo'){
    Local.init(); $('#demoBanner').hidden=false;
    if(!Local.persisted) $('#demoText').textContent='This browser blocks storage, so changes in this demo are lost on refresh.';
    var s=Local.db['staff/demo-owner']||{name:'Owner'}; ME={uid:'demo-owner',name:s.name,duty:'owner',squad:null};
    start(); return;
  }
  try{Fire.init();}catch(e){view.innerHTML='<div class="empty">Firebase could not start: '+esc(e.message)+'. Check firebase-config.js.</div>';return;}
  Fire.auth.onAuthStateChanged(function(user){
    if(busyAuth) return;
    if(!user){Fire.get('config/owner').then(function(o){if(o)viewLogin();else viewSetup();},function(){viewLogin();});return;}
    Fire.get('staff/'+user.uid).then(function(s){
      if(!s||s.active===false) return viewNotPosted();
      ME={uid:user.uid,name:s.name,duty:s.duty,squad:s.squad||null,username:s.username}; start();
    },function(e){if(e.code==='permission-denied')return viewNotPosted();view.innerHTML='<div class="empty"><p>Could not load your post: '+esc(e.message)+'</p><button class="btn" onclick="location.reload()">Try again</button></div>';});
  });
}
boot();
})();
</script>
