<!doctype html>
<html lang="en-MY">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#0b1736">
<meta name="robots" content="noindex">
<title>Page not found · 5th Kajang BB</title>
<link rel="icon" href="/bb-crest.png">
<style>
:root{--bg:#F5F7FA;--card:#fff;--ink:#172033;--muted:#4A5568;--line:#D6DDE8;--navy:#1E3F7A;--on:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#0F1726;--card:#172238;--ink:#EEF2F8;--muted:#A3B0C6;--line:#2A3956;--navy:#9DB8F0;--on:#0F1726}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:var(--bg);color:var(--ink);font:16px/1.55 Arial,Helvetica,sans-serif}
main{width:100%;max-width:440px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:32px 24px;text-align:center}
img{width:72px;height:72px}
h1{font-size:1.5rem;margin:14px 0 6px}
p{color:var(--muted);margin:0 0 22px}
nav{display:flex;flex-direction:column;gap:10px}
a{display:block;padding:12px 16px;border-radius:10px;border:1px solid var(--line);color:var(--ink);text-decoration:none;font-weight:700}
a.main{background:var(--navy);border-color:var(--navy);color:var(--on)}
a:focus-visible{outline:3px solid var(--navy);outline-offset:2px}
</style>
</head>
<body>
<main>
  <img src="/bb-crest.png" alt="" width="72" height="72">
  <h1>Page not found</h1>
  <p>This link may be old or mistyped. Try one of these instead.</p>
  <nav aria-label="Pages">
    <a class="main" href="/">Go to the 5th Kajang BB website</a>
    <a href="/notices/">Notice board</a>
    <a href="/uniform/">Uniform order</a>
    <a href="/#join">Join us</a>
  </nav>
</main>
</body>
</html>
