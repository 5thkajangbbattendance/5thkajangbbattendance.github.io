*{box-sizing:border-box}

/* ---- shell ---- */
.app{display:flex;min-height:100vh}
.main{flex:1;min-width:0;display:flex;flex-direction:column}

/* global search */
.gsearch{position:relative;width:240px}
.gsearch svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:17px;height:17px;color:var(--muted)}

.g-3{display:grid;gap:20px;grid-template-columns:1fr}

@media (min-width:1280px){.g-3{grid-template-columns:1.35fr 1.1fr 1fr}}

/* ---- buttons ---- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--line-strong);background:var(--surface);font-weight:600;font-size:.92rem;cursor:pointer;text-decoration:none;color:var(--ink);white-space:nowrap}

.btn.block{width:100%}

.ibtn{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:50%;border:1px solid var(--line-strong);background:var(--surface);cursor:pointer;flex:none;color:var(--ink);padding:0}

/* ---- forms ---- */
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field > span{font-size:.84rem;font-weight:600;color:var(--ink-2)}

.input,select.input,textarea.input{width:100%;min-height:44px;padding:9px 12px;border-radius:10px;border:1px solid var(--line-strong);background:var(--surface);font-size:.94rem;color:var(--ink)}
.input:focus{border-color:var(--accent-text);outline:3px solid color-mix(in srgb,var(--accent-text) 18%,transparent);outline-offset:0}

.form{display:flex;flex-direction:column;gap:14px}

/* segmented tabs (template "Requests | Leave calendar | …") */
.seg{display:inline-flex;flex-wrap:wrap;gap:2px;padding:4px;border:1px solid var(--line-strong);border-radius:12px;background:var(--surface);max-width:100%;align-self:flex-start}

/* ---- status ---- */
.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:999px;font-weight:600;font-size:.78rem;white-space:nowrap;border:1px solid transparent;line-height:1.6}

/* KPI cards */

@media (max-width:640px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.kpi{padding:14px}.kpi-v{font-size:1.75rem}.kpi-h{font-size:.8rem;gap:8px}.kpi-i{width:30px;height:30px}.mini{padding:10px}.mini b{font-size:1rem}}
.kpi{gap:10px;padding:18px}
.kpi-h{display:flex;align-items:center;gap:10px;color:var(--ink-2);font-size:.88rem;font-weight:500}

.kpi-n{font-size:.8rem;color:var(--muted)}
.kpi.feature{background:var(--mint);border-color:color-mix(in srgb,var(--mint) 70%,var(--accent-text));color:var(--mint-ink)}
.kpi.feature .kpi-h,.kpi.feature .kpi-n{color:var(--mint-ink);opacity:.85}
.kpi.feature .kpi-i{background:transparent;border-color:currentColor}
.kpi.feature .kpi-v{color:var(--mint-ink)}
.tiles{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(130px,46%),1fr))}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow)}

function parseCSV(text){
  var rows=[],row=[],f='',q=false;
  for(var i=0;i<text.length;i++){var ch=text[i];
    if(q){if(ch==='"'){if(text[i+1]==='"'){f+='"';i++;}else q=false;}else f+=ch;}
    else if(ch==='"')q=true; else if(ch===','){row.push(f);f='';} else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&text[i+1]==='\n')i++;row.push(f);rows.push(row);row=[];f='';} else f+=ch;}
  if(f||row.length){row.push(f);rows.push(row);}
  return rows.filter(function(r){return r.some(function(c){return c.trim();});});
}
function csvToPeople(text){
  var rows=parseCSV(text), out=[], bad=[];
  if(rows.length&&/name/i.test(rows[0][0])) rows.shift();
  rows.forEach(function(r,i){
    var name=(r[0]||'').trim().replace(/\s+/g,' '), sec=(r[1]||'').trim().toLowerCase(), rank=(r[2]||'').trim(), sq=parseInt(r[3],10), lead=/^(y|yes|true|1)$/i.test((r[4]||'').trim());
    var m=sec.match(/squad\s*(\d)/); if(m){sq=+m[1];sec='members';}
    if(/^officer/.test(sec))sec='officers'; else if(/^primer/.test(sec))sec='primers'; else if(/^helper/.test(sec))sec='helper'; else if(/^member/.test(sec))sec='members';
    if(!name||SECTIONS.indexOf(sec)<0||(sec==='members'&&!(sq>=1&&sq<=4))){bad.push(i+1);return;}
    var rk=RANKS[sec].filter(function(x){return x.toLowerCase()===rank.toLowerCase();})[0]||(sec==='members'?'Private':RANKS[sec][0]);
    out.push({name:name,section:sec,rank:rk,squad:sec==='members'?sq:null,squadLeader:sec==='members'&&lead,active:true});
  });
  return {people:out,bad:bad};
}

    onAction:function(v,w){

      var r=csvToPeople($('#csvText',w).value); if(!r.people.length) throw new Error('No people found. Check that each line has a name and a section.');
      var have={}; roll(true).forEach(function(p){have[p.name.toLowerCase()]=1;});

};

    '<section class="card"><h2>Owner recovery key</h2><p class="small muted">If you forget the Owner password, use this key on the sign-in page to set up a new Owner login. Set a new key here whenever you want, and keep it somewhere safe.</p>'+
      '<div class="grid2"><label class="field"><span>New recovery key</span><input class="input" id="rkA" type="password" autocomplete="new-password"></label><label class="field"><span>Confirm key</span><input class="input" id="rkB" type="password" autocomplete="new-password"></label></div><div><button class="btn" data-act="stKey">Save recovery key</button></div></section>'+
    '<section class="card"><h2>Posted staff</h2><p class="small muted">Names on this board are what leaders see when they sign in, and what the Changes page shows. On the free plan a password cannot be reset from here: ask the person to change it under Settings, or revoke the post and issue a new username.</p>'+
      list.map(function(s){var me=s.uid===ME.uid;return '<div class="card" style="box-shadow:none;background:var(--surface-2)" data-staff="'+esc(s.uid)+'"><div><b>'+esc(s.name)+'</b>'+(s.active===false?'<span class="tag grey">Revoked</span>':'')+(me?'<span class="tag">You</span>':'')+'<br><span class="small muted">Username: '+esc(s.username||'')+' · '+esc(DUTY_LABEL[s.duty]||'')+(s.duty==='leader'?' · Squad '+s.squad:'')+'</span></div>'+
        '<div class="grid2"><label class="field"><span>Name on the board</span><input class="input" data-f="name" value="'+esc(s.name)+'" maxlength="40"></label><label class="field"><span>Duty</span><select class="input" data-f="duty"'+(me?' disabled':'')+'>'+order.map(function(k){return opt(k,DUTY_LABEL[k],s.duty);}).join('')+'</select></label>'+
        '<label class="field"><span>Squad</span><select class="input" data-f="squad">'+[1,2,3,4].map(function(n){return opt(n,'Squad '+n,s.squad||1);}).join('')+'</select><small>Used for Squad Leaders only.</small></label></div>'+
        '<div class="row-btns"><button class="btn sm" data-act="stSave" data-u="'+esc(s.uid)+'">Save name &amp; duty</button>'+(me?'':(s.active===false?'<button class="btn sm" data-act="stActive" data-u="'+esc(s.uid)+'" data-v="1">Reinstate</button>':'<button class="btn sm danger" data-act="stActive" data-u="'+esc(s.uid)+'" data-v="0">Revoke</button>'))+'</div></div>';}).join('')+'</section>';
};
ON.nsDuty=function(t){$('#nsNote').textContent=DUTY_NOTE[t.value];$('#nsSqWrap').hidden=t.value!=='leader';};
ACT.stCreate=function(b){
  var name=$('#nsName').value.trim(), u=cleanUser($('#nsUser').value), p=$('#nsPass').value, duty=$('#nsDuty').value, sq=duty==='leader'?+$('#nsSq').value:null;
  if(!name){toast('Enter a display name.');return;} if(!validUser(u)){toast('Usernames need 3 to 30 letters, numbers, dots or dashes.');return;} if(p.length<8){toast('Passwords need at least 8 characters.');return;}
  if(Object.keys(ST.staff).some(function(k){return ST.staff[k].username===u;})){toast('That username is already taken.');return;}
  b.disabled=true;
  Auth.createOther(u,p).then(function(id){return Store.commit([{path:'staff/'+id,data:{username:u,name:name,duty:duty,squad:sq,active:true,createdAt:new Date().toISOString()}}]);})
    .then(function(){toast('Account created for '+name+'. Username: '+u);},function(e){toast(e.message);b.disabled=false;});
};
ACT.stKey=function(){
  var a=$('#rkA').value,c=$('#rkB').value; if(a.length<8){toast('Use a recovery key of at least 8 characters.');return;} if(a!==c){toast('The two keys do not match.');return;}
  Store.commit([{path:'config/recovery',data:{key:a,setAt:new Date().toISOString()}}]).then(function(){toast('Recovery key saved');$('#rkA').value='';$('#rkB').value='';},function(e){toast(e.message);});
};
ACT.stSave=function(b){
  var box=$('[data-staff="'+b.dataset.u+'"]'), name=$('[data-f=name]',box).value.trim(), duty=$('[data-f=duty]',box).value;
  if(!name){toast('Enter a name.');return;}
  Store.commit([{path:'staff/'+b.dataset.u,merge:true,data:{name:name,duty:duty,squad:duty==='leader'?+$('[data-f=squad]',box).value:null}}]).then(function(){toast('Saved');},function(e){toast(e.message);});
};
ACT.stActive=function(b){
  var on=b.dataset.v==='1', s=ST.staff[b.dataset.u];
  var go=on?Promise.resolve(true):confirmBox('Revoke '+s.name+'?','<p>They will be signed out and cannot sign in again until reinstated. Their past marks stay.</p>','Revoke','danger');
  go.then(function(ok){if(ok)Store.commit([{path:'staff/'+b.dataset.u,merge:true,data:{active:on}}]).then(function(){toast(on?'Reinstated':'Revoked');},function(e){toast(e.message);});});
};

/* ---------- settings ---------- */
function openSettings(){
  var t=ls('bb-theme')||'system', a=ls('bb-accent')||'teal', org=ST.org||{};
  var accents=[['teal','Teal','#0f6e5f'],['navy','Navy','#1e3a8a'],['crimson','Crimson','#9b2335'],['violet','Violet','#5b3fd1']];
  var html='<div class="field"><span>Theme</span><div class="seg">'+[['system','Match device'],['light','Light'],['dark','Dark']].map(function(o){return '<button type="button" data-theme-opt="'+o[0]+'" aria-pressed="'+(t===o[0])+'">'+o[1]+'</button>';}).join('')+'</div></div>'+
    '<div class="field"><span>Colour</span><div class="swatches">'+accents.map(function(o){return '<button type="button" class="swatch" data-accent-opt="'+o[0]+'" aria-pressed="'+(a===o[0])+'" style="--sw:'+o[2]+'"><i></i>'+o[1]+'</button>';}).join('')+'</div><small>Theme and colour are saved on this device only.</small></div>'+
    '<p class="small">Signed in as <b>'+esc(ME.name)+'</b> · '+esc(DUTY_LABEL[ME.duty]+(ME.duty==='leader'?' (Squad '+ME.squad+')':''))+'</p>';
  if(isOwner()) html+='<form class="form"><label class="field"><span>Organisation name</span><input class="input" id="soName" value="'+esc(org.orgName||'')+'" maxlength="120"></label><div class="grid2"><label class="field"><span>Short code</span><input class="input" id="soCode" value="'+esc(org.code||'5THKJBB')+'" maxlength="20"></label><label class="field"><span>Established</span><input class="input" id="soEst" value="'+esc(org.est||'2020')+'" maxlength="4" inputmode="numeric"></label></div></form>';
  if(MODE==='firebase') html+='<details><summary class="btn sm ghost">Change my password</summary><div class="form" style="margin-top:10px"><label class="field"><span>Current password</span><input class="input" type="password" id="pwCur" autocomplete="current-password"></label><label class="field"><span>New password</span><input class="input" type="password" id="pwNew" autocomplete="new-password"></label><button type="button" class="btn" data-pw="1">Change password</button></div></details>';
  if(MODE==='demo') html+='<div class="field"><span>Preview as (demo only)</span><select class="input" id="viewAs">'+Object.keys(ST.staff).map(function(k){var s=ST.staff[k];return opt(k,s.name+' · '+DUTY_LABEL[s.duty],ME.uid);}).join('')+'</select><small>See what each duty can do. Nothing is saved.</small></div><p class="small muted">This demo keeps its data in this browser only. Connect Firebase to share records between staff.</p>';
  openModal({title:'Settings',html:html,
    actions:(MODE==='firebase'?[{label:'Sign out',value:'out',kind:'danger'}]:[{label:'Reset demo data',value:'reset',kind:'danger'}]).concat([{label:'Close',value:'close'}]).concat(isOwner()?[{label:'Save organisation',value:'save',kind:'primary'}]:[]),
    onClick:function(e,w){
      var b=e.target.closest('[data-theme-opt],[data-accent-opt]');
      if(b){if(b.dataset.themeOpt){ls('bb-theme',b.dataset.themeOpt);$$('[data-theme-opt]',w).forEach(function(x){x.setAttribute('aria-pressed',String(x===b));});}else{ls('bb-accent',b.dataset.accentOpt);$$('[data-accent-opt]',w).forEach(function(x){x.setAttribute('aria-pressed',String(x===b));});}applyAppearance();}
      if(e.target.closest('[data-pw]')){var cur=$('#pwCur',w).value,nw=$('#pwNew',w).value;if(nw.length<8){toast('Use a new password of at least 8 characters.');return;}Auth.changePassword(cur,nw).then(function(){toast('Password changed');$('#pwCur',w).value='';$('#pwNew',w).value='';},function(er){toast(er.message);});}
    },
    onChange:function(e){if(e.target.id==='viewAs'){var s=ST.staff[e.target.value];ME={uid:e.target.value,name:s.name,duty:s.duty,squad:s.squad||null};buildNav();route();toast('Previewing as '+s.name);}},
    onAction:function(v,w){
      if(v==='close') return;
      if(v==='out') return Auth.signOut().then(function(){location.reload();});
      if(v==='reset') return confirmBox('Reset demo data?','<p>This replaces everything in this browser with fresh sample data.</p>','Reset','danger').then(function(ok){if(!ok)return false;Local.reset();toast('Demo data reset');});
      if(v==='save'){var n=$('#soName',w).value.trim();if(!n)throw new Error('Enter the organisation name.');return Store.commit([{path:'config/org',merge:true,data:{orgName:n,code:$('#soCode',w).value.trim()||'5THKJBB',est:$('#soEst',w).value.trim()}}]).then(function(){toast('Saved');});}
    }});
}

/* ---------- sign-in, first-time setup, recovery ---------- */
var busyAuth=false;
function loginShell(panel){
  document.body.classList.add('login-mode');
  view.innerHTML='<div class="login"><section class="login-brand"><div class="lb-top"><img class="crest" src="bb-crest.png" alt="" onerror="this.remove()"><div><b>Parade HQ</b><span>The 5th Kajang Boys’ Brigade Company</span></div></div>'+
    '<div class="lb-mid"><h1>Every parade, <em>accounted for.</em></h1><p>Attendance, reports and records for the officers and squad leaders of the 5th Kajang Company.</p>'+
    '<ul class="lb-feat"><li>'+ICON.check+'Mark a whole squad in seconds on your phone</li><li>'+ICON.check+'Reports, year records and Excel downloads</li><li>'+ICON.check+'Each leader sees only what their duty allows</li></ul></div>'+
    '<p class="lb-motto">Sure &amp; Stedfast</p></section><section class="login-panel">'+panel+'</section></div>';
}
function viewLogin(msg){
  loginShell('<form id="lgForm"><div><h2>Sign in</h2><p class="muted" style="margin-top:6px">Welcome back. Use the username and password from your Owner.</p></div><label class="field"><span>Username</span><input class="input" id="lgUser" autocomplete="username" autocapitalize="none" required></label><label class="field"><span>Password</span><input class="input" id="lgPass" type="password" autocomplete="current-password" required></label>'+
    '<div class="err" id="lgErr"'+(msg?'':' hidden')+'>'+esc(msg||'')+'</div><button class="btn primary block" type="submit">Sign in</button><button class="btn ghost" type="button" id="lgForgot">Forgot Owner password?</button></form>');
  $('#lgUser').focus();
  $('#lgForm').addEventListener('submit',function(e){e.preventDefault();var err=$('#lgErr'),btn=$('#lgForm .btn.primary');err.hidden=true;btn.disabled=true;btn.textContent='Please wait…';
    Auth.signIn($('#lgUser').value,$('#lgPass').value).catch(function(ex){err.textContent=ex.message;err.hidden=false;btn.disabled=false;btn.textContent='Sign in';});});
  $('#lgForgot').addEventListener('click',viewRecover);
}
function viewSetup(){
  loginShell('<form id="suForm"><div><h2>First-time setup</h2><p class="muted small">No Owner account exists yet. Create it now. The Owner can then issue posts to officers and squad leaders.</p></div>'+
    '<label class="field"><span>Display name</span><input class="input" id="suName" value="Owner" maxlength="40"></label><label class="field"><span>Username</span><input class="input" id="suUser" value="owner" autocapitalize="none" maxlength="30"></label>'+
    '<label class="field"><span>Password</span><input class="input" id="suPass" type="password" autocomplete="new-password"></label><label class="field"><span>Confirm password</span><input class="input" id="suPass2" type="password" autocomplete="new-password"></label>'+
    '<div class="err" id="suErr" hidden></div><button class="btn primary block" type="submit">Create Owner account</button></form>');
  $('#suForm').addEventListener('submit',function(e){
    e.preventDefault(); var err=$('#suErr'); err.hidden=true;
    var name=$('#suName').value.trim()||'Owner', u=cleanUser($('#suUser').value), p=$('#suPass').value;
    var fail=function(m){err.textContent=m;err.hidden=false;busyAuth=false;};
    if(!validUser(u)) return fail('Usernames need 3 to 30 letters, numbers, dots or dashes.');
    if(p.length<8) return fail('Use a password of at least 8 characters.');
    if(p!==$('#suPass2').value) return fail('The two passwords do not match.');
    busyAuth=true;
    Auth.createSelf(u,p).then(function(id){
      return Fire.commit([{path:'staff/'+id,data:{username:u,name:name,duty:'owner',active:true,createdAt:new Date().toISOString()}},{path:'config/owner',data:{uid:id}}])
        .then(function(){return Fire.commit([{path:'config/org',data:{orgName:"The 5th Kajang Boys' Brigade Company",code:'5THKJBB',est:'2020'}},{path:'config/rosterIndex',data:buildIndex({})}]);});
    }).then(function(){location.reload();},function(ex){fail(ex.message);});
  });
}
function viewRecover(){
  loginShell('<form id="rcForm"><div><h2>Recover Owner access</h2><p class="muted small">Enter the Owner recovery key that was set on the Staff page. You get a new Owner login, and the old Owner login is revoked.</p></div>'+
    '<label class="field"><span>Recovery key</span><input class="input" id="rcKey" type="password"></label><label class="field"><span>New Owner username</span><input class="input" id="rcUser" autocapitalize="none" maxlength="30"><small>Must be different from the old username.</small></label>'+
    '<label class="field"><span>New password</span><input class="input" id="rcPass" type="password" autocomplete="new-password"></label>'+
    '<div class="err" id="rcErr" hidden></div><button class="btn primary block" type="submit">Recover access</button><button class="btn ghost" type="button" id="rcBack">Back to log in</button></form>');
  $('#rcBack').addEventListener('click',function(){viewLogin();});
  $('#rcForm').addEventListener('submit',function(e){
    e.preventDefault(); var err=$('#rcErr'); err.hidden=true;
    var key=$('#rcKey').value, u=cleanUser($('#rcUser').value), p=$('#rcPass').value, oldUid=null;
    var fail=function(m){err.textContent=m;err.hidden=false;busyAuth=false;};
    if(!key) return fail('Enter the recovery key.'); if(!validUser(u)) return fail('Usernames need 3 to 30 letters, numbers, dots or dashes.'); if(p.length<8) return fail('Use a password of at least 8 characters.');
    busyAuth=true;
    Fire.get('config/owner').then(function(o){oldUid=o&&o.uid;return Auth.createSelf(u,p);}).then(function(id){
      return Fire.commit([{path:'staff/'+id,data:{username:u,name:'Owner',duty:'owner',active:true,recoveryKey:key,createdAt:new Date().toISOString()}},{path:'config/owner',data:{uid:id}}]).then(function(){
        var ops=[{path:'staff/'+id,merge:true,data:{recoveryKey:DEL}}]; if(oldUid&&oldUid!==id) ops.push({path:'staff/'+oldUid,merge:true,data:{active:false}});
        return Fire.commit(ops);
      },function(ex){
        var cu=Fire.auth.currentUser, gone=cu?cu.delete().catch(function(){}):Promise.resolve();
        return gone.then(function(){throw new Error(/duty|permission/i.test(ex.message)?'That recovery key does not match.':ex.message);});
      });
    }).then(function(){location.reload();},function(ex){Fire.auth.signOut().catch(function(){});fail(ex.message);});
  });
}
function viewNotPosted(){
  loginShell('<form><div><h2>No post yet</h2><p class="muted">This login is not posted, or the post was revoked. Ask the Owner to issue you a post on the Staff page.</p></div><button class="btn block" type="button" id="npOut">Use a different login</button></form>');
  $('#npOut').addEventListener('click',function(){Auth.signOut().then(function(){location.reload();});});
}

/* ---------- boot ---------- */
function start(){document.body.classList.remove('login-mode');startSubs();}
function boot(){
  if(MODE==='demo'){
    Local.init(); $('#demoBanner').hidden=false;
    if(!Local.persisted) $('#demoText').textContent='This browser blocks storage, so changes in this demo are lost on refresh.';
    var s=Local.db['staff/demo-owner']||{name:'Owner'}; ME={uid:'demo-owner',name:s.name,duty:'owner',squad:null};
    start(); return;
  }
  try{Fire.init();}catch(e){view.innerHTML='<div class="empty">Firebase could not start: '+esc(e.message)+'. Check firebase-config.js.</div>';return;}
  Fire.auth.onAuthStateChanged(function(user){
    if(busyAuth) return;
    if(!user){Fire.get('config/owner').then(function(o){if(o)viewLogin();else viewSetup();},function(){viewLogin();});return;}
    Fire.get('staff/'+user.uid).then(function(s){
      if(!s||s.active===false) return viewNotPosted();
      ME={uid:user.uid,name:s.name,duty:s.duty,squad:s.squad||null,username:s.username}; start();
    },function(e){if(e.code==='permission-denied')return viewNotPosted();view.innerHTML='<div class="empty"><p>Could not load your post: '+esc(e.message)+'</p><button class="btn" onclick="location.reload()">Try again</button></div>';});
  });
}
boot();
})();
</script>
</body></html>
